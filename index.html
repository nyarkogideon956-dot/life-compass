<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Compass</title>
<meta name="theme-color" content="#0C3C78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Compass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --navy:#0C3C78;--blue:#1565C0;--sky:#E8F0FB;--sky2:#D3E3F8;--bg:#F4F7FC;--card:#fff;
  --ink:#0F1E33;--muted:#5F7A99;--line:#E1E8F2;--ok:#1E8E5A;--warn:#B26A00;--bad:#C0392B;
  --r:14px;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header img{width:32px;height:32px;border-radius:8px;background:#fff}
header h1{font-size:18px;font-weight:600;margin:0;flex:1}
header button{background:none;border:0;color:#fff;padding:6px;border-radius:10px;display:flex}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
nav.many button{font-size:10px}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:10px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--navy);font-weight:600}
nav button.on svg{stroke:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--navy)}
.card h2 .sp{flex:1}
.hello{background:var(--navy);color:#fff;border:0}
.hello .big{font-size:20px;font-weight:600}
.hello .sub{opacity:.8;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl{flex:1}
.row .lbl small{display:block;color:var(--muted);font-size:12.5px}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--sky2);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--navy);border-color:var(--navy)}
.check svg{width:18px;height:18px;stroke:#fff;opacity:0}
.check.on svg{opacity:1}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--sky2);background:var(--sky);color:var(--navy);font-size:20px;line-height:1}
.step b{min-width:34px;text-align:center}
input[type=number],input[type=text],input[type=search],input[type=tel],input[type=url],input[type=password],input[type=time],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--sky)}
.mini{width:84px!important;text-align:center}
.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--navy);color:#fff;font-weight:600;width:100%}
.btn.ghost{background:var(--sky);color:var(--navy)}
.btn.sm{width:auto;padding:7px 12px;font-size:14px}
.btn.danger{background:#FBEAEA;color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--sky);color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hello .chip{background:rgba(255,255,255,.15);color:#fff}
.bar{height:8px;background:var(--sky);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.done i{background:var(--ok)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--sky);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat b{font-size:20px;color:var(--navy)}
.seg{display:flex;background:var(--sky);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--navy)}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(12,60,120,.12)}
.muted{color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.area{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.goal{padding:10px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .t{display:flex;gap:8px;align-items:flex-start}
.goal .t span{flex:1}
.goal.done .t span{text-decoration:line-through;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .h{color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--sky);display:flex;align-items:center;justify-content:center;position:relative;color:var(--navy)}
.cal .d.on{background:var(--navy);color:#fff}
.cal .d.today{outline:2px solid var(--blue);outline-offset:1px}
.cal .d.m::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:#F5B700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.list .it{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.list .it:first-child{border-top:0}
.list .it .x{flex:1}
.list .it .x small{display:block;color:var(--muted);font-size:12.5px}
.amt{font-weight:600;white-space:nowrap}
.amt.neg{color:var(--bad)}
.icon-btn{background:none;border:0;color:var(--muted);padding:4px;display:flex}
.chart svg{width:100%;height:auto;display:block}
.sheet-bg{position:fixed;inset:0;background:rgba(15,30,51,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;color:var(--navy);font-size:17px}
.f{margin-bottom:11px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.banner{background:#FFF6E0;border:1px solid #F3DDA6;color:#6B4A00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.banner .btn{width:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
textarea{min-height:76px;resize:vertical}
.vision{white-space:pre-wrap;font-size:14.5px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.enc .blk{padding:12px 0;border-top:1px solid var(--line)}
.enc .blk:first-of-type{border-top:0;padding-top:0}
.kicker{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);font-weight:600;margin-bottom:4px}
.enc .ref{font-size:18px;font-weight:700;color:var(--navy)}
.enc .theme{font-size:15px}
.enc .q{font-weight:600;margin-bottom:8px}
.enc .quote{font-size:16px;font-style:italic}
.enc textarea{min-height:64px}
.scripture{background:var(--sky);border-radius:12px;padding:12px!important;border:0!important;margin-bottom:4px}
.vid video{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:16/9}
.chgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.chgrid span{aspect-ratio:1;border-radius:4px;background:var(--sky);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.chgrid span.r{background:var(--navy);color:#fff}
.chgrid span.cur{outline:2px solid #F5B700}
.wkmini{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px;color:var(--muted)}
.wkmini b{color:var(--navy);font-size:16px}
.up{color:var(--ok);font-size:12.5px}
#alarm{position:fixed;inset:0;z-index:60;background:rgba(12,60,120,.96);display:flex;align-items:center;justify-content:center;padding:24px}
#alarm[hidden]{display:none}
.alarmbox{background:#fff;border-radius:22px;padding:26px 20px 20px;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.alarmbox .bell{color:var(--navy);animation:shake .6s infinite}
.alarmbox .atime{font-size:40px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.alarmbox .atitle{font-size:19px;font-weight:600;margin-bottom:8px}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.alarmbox .bell{animation:none}}
.addrow{display:grid;grid-template-columns:1fr 104px 44px;gap:6px;align-items:center}
.addrow .btn{height:40px;padding:0;display:flex;align-items:center;justify-content:center}
.todo.done b{text-decoration:line-through;color:var(--muted);font-weight:400}
.alarms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.achip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--sky);color:var(--navy)}
.achip.med{background:#E3F4EB;color:#1E7F52}.achip.diary{background:#F1EAFB;color:#5B3A99}
.days{display:flex;gap:5px}
.days label{flex:1;cursor:pointer}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{display:flex;align-items:center;justify-content:center;height:38px;border-radius:10px;border:1.5px solid var(--sky2);font-weight:600;color:var(--navy)}
.days input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.days input:focus-visible+span{outline:3px solid var(--blue)}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#C9D6E6;border-radius:99px;transition:.2s}
.switch span::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--navy)}
.switch input:checked+span::before{transform:translateX(18px)}
.chip.good{background:#E3F4EB;color:#1E7F52}.chip.bad{background:#FBEAEA;color:var(--bad)}
.dentry{padding-bottom:6px}
.pstrip{display:flex;flex-wrap:wrap;gap:8px}
.pstrip.view{margin-top:10px}
.pthumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--sky)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.pthumb.missing::after{content:"Picture not on this phone";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);padding:4px}
.pdel{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(15,30,51,.7);color:#fff;font-size:16px;line-height:1}
.padd{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--sky2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--navy);font-size:11.5px;cursor:pointer;text-align:center}
#photoView{position:fixed;inset:0;z-index:70;background:rgba(5,12,25,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#photoView[hidden]{display:none}
#photoView img{max-width:100%;max-height:80vh;border-radius:8px}
#photoView .btn{width:auto;padding:10px 28px}
.nfilter{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.nfilter button{flex:none;border:1px solid var(--sky2);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--navy)}
.nfilter button span{color:var(--muted);font-size:12px}
.nfilter button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.nfilter button.on span{color:#C9D9F0}
.note .nk{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);font-weight:600}
.note .nt{font-weight:600;margin-top:2px}
.note .nx{white-space:pre-wrap;font-size:15px;margin-top:4px}
.note.diary .nk{color:#5B3A99}.note.lesson .nk{color:#8A5A00}
.pararow{display:flex;align-items:center;gap:8px}.pararow input{width:80px!important;text-align:center}.pararow span{color:var(--muted)}.note.question .nk{color:#1E7F52}.note.bible .nk{color:var(--navy)}
.wdot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;background:#B8C4D3}
.wdot.green{background:#1E8E5A}.wdot.orange{background:#E08A00}.wdot.red{background:#C0392B}
.wchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:#EEF1F5;color:#5F6B7A}
.wchip.green{background:#E3F4EB;color:#1E7F52}.wchip.orange{background:#FFF1DA;color:#8A5A00}.wchip.red{background:#FBEAEA;color:#A32D2D}
.person{border-left:4px solid #B8C4D3;border-radius:0 var(--r) var(--r) 0}
.person.green{border-left-color:#1E8E5A}.person.orange{border-left-color:#E08A00}.person.red{border-left-color:#C0392B}
.person [data-a=contactsheet]{cursor:pointer}
.legend i.wdot{width:10px;height:10px;margin:0 4px 0 0;vertical-align:-1px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips2 button{border:1.5px solid var(--sky2);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--navy)}
.chips2 button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.wa{background:#1E8E5A}
.codebox{font-size:30px;font-weight:700;letter-spacing:.08em;text-align:center;color:var(--navy);background:var(--sky);border-radius:14px;padding:14px;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.tot{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px;font-variant-numeric:tabular-nums}
.tot th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px;text-transform:uppercase;letter-spacing:.04em}
.tot.sy td,.tot.sy th{padding:4px 5px;font-size:13px}
.tot td{text-align:right;padding:6px;border-top:1px solid var(--line)}.tot td:first-child,.tot th:first-child{text-align:left;padding-left:0}
.it.rep{cursor:pointer}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font-size:12px}
.sndrow{display:grid;grid-template-columns:1fr 48px;gap:6px}
.sndrow .btn{height:40px;padding:0;display:flex;align-items:center;justify-content:center}
.f2[hidden],.f[hidden],.jentry[hidden]{display:none}
.timer .clock{font-size:46px;font-weight:700;text-align:center;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:4px 0}
.timer.on{border:2px solid var(--blue)}
.timer.on .chip{background:#E3F4EB;color:#1E7F52}
#lock{position:fixed;inset:0;z-index:50;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
.lockbox{background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lockbox img{border-radius:14px}
.lockbox h2{margin:0;color:var(--navy);font-size:20px}
.lockbox input{width:100%;max-width:100%;text-align:center;font-size:22px;letter-spacing:.3em}
.lockbox input::placeholder{letter-spacing:normal;font-size:16px}
.people{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.people button{border:1.5px solid var(--sky2);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--navy)}
.people button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--sky);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.st-chip{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600}
.st-chip.steady{background:#E3F4EB;color:#1E7F52}.st-chip.irregular{background:#FFF3DC;color:#8A5A00}.st-chip.paused{background:var(--sky);color:var(--muted)}.st-chip.stopped{background:#F3F3F3;color:#777}
.student.stopped{opacity:.65}
.student.steady{border-left:4px solid #1E7F52}
.down{color:var(--warn);font-size:12.5px}
.seg.six{overflow-x:auto}.seg.six button{font-size:12.5px;padding:8px 6px;flex:none}
.pickrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}.pickrow select{flex:1}
.ptype{display:flex;flex-direction:column;gap:8px}.ptype button{text-align:left;border:1.5px solid var(--sky2);background:#fff;border-radius:12px;padding:12px 14px;color:var(--ink)}
.ptype button b{display:block;color:var(--navy);font-size:16px}.ptype button small{color:var(--muted);font-size:13px}
.ptype button.on{border-color:var(--navy);background:var(--sky)}
.glance .big{font-size:26px;font-weight:700;color:var(--navy)}
</style>
</head>
<body>
<header>
  <img src="icon.svg" alt="">
  <h1 id="title">Life Compass</h1>
  <button data-a="gonotes" aria-label="My notes" title="My notes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg></button>
  <button data-a="settings" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="lock" hidden></div>
<div id="alarm" hidden></div>
<div id="photoView" hidden></div>

<script>
/* ---------- storage ---------- */
const APP_VERSION = 22;
const PKEY = 'lifecompass.profiles';
function loadProfiles(){ try{ const p=JSON.parse(localStorage.getItem(PKEY)); if(p&&p.list&&p.list.length) return p; }catch(e){} return {list:[{id:'main',name:'',pin:null}], current:'main'}; }
let P = loadProfiles();
function saveProfiles(){ try{ localStorage.setItem(PKEY, JSON.stringify(P)); }catch(e){} }
const keyFor = id => id==='main' ? 'lifecompass.v1' : 'lifecompass.v1.'+id;

/* ---------- helpers ---------- */
function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d||1); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
const TODAY = () => ymd(new Date());
const MONTH = (s=TODAY()) => s.slice(0,7);
const YEAR = (s=TODAY()) => s.slice(0,4);
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function n(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  let t=String(v??'').replace(/[\s₵]/g,'').replace(/^GH[S¢C]?/i,'');
  if(t.includes(',') && t.includes('.')) t=t.replace(/,/g,'');            // 1,250.50
  else if(/^-?\d{1,3}(,\d{3})+$/.test(t)) t=t.replace(/,/g,'');          // 1,250 or 12,500,000
  else t=t.replace(',','.');                                              // 7,5 means 7.5
  const x=parseFloat(t); return isFinite(x)?x:0;
}
function r1(x){ return Math.round(x*10)/10; }
function money(x){ return S.settings.currency+' '+(Math.round(x*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function day(s=TODAY()){ return S.days[s] || (S.days[s]={}); }
function nice(s){ return parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function monthName(m){ return parse(m+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function pct(a,b){ return b>0?Math.max(0,Math.min(100,Math.round(a/b*100))):0; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }
function streak(test){
  let s=TODAY(), c=0;
  if(!test(S.days[s]||{})) s=addDays(s,-1);
  while(test(S.days[s]||{})){ c++; s=addDays(s,-1); }
  return c;
}

/* ---------- weekly summary (weeks run Monday to Sunday) ---------- */
function weekStart(s=TODAY()){ return addDays(s, -((parse(s).getDay()+6)%7)); }
function weekStats(ws, maxDays=7){
  const we = addDays(ws,6); let end = we<TODAY()?we:TODAY(); const cap=addDays(ws,maxDays-1); if(cap<end) end=cap; const days=[];
  for(let s=ws; s<=end; s=addDays(s,1)) days.push(s);
  const D = s=>S.days[s]||{};
  const inW = d=>d>=ws && d<=end;
  const sleeps = days.map(s=>n(D(s).sleep)).filter(x=>x>0);
  const weights = days.filter(s=>n(D(s).weight)>0);
  return {
    ws, we, count:days.length,
    bible: days.filter(s=>D(s).bible).length,
    study: days.filter(s=>D(s).study).length,
    prayer: days.filter(s=>D(s).prayer).length,
    meeting: days.filter(s=>D(s).meeting).length,
    chapters: S.bible.log.filter(x=>inW(x.date)).length,
    answers: days.filter(s=>(S.answers[s]||'').trim()).length,
    minHours: r1(ministryHours(ws,end)),
    studies: S.students.reduce((a,x)=>a+(x.sessions||[]).filter(z=>inW(z.date)).length,0),
    sleepAvg: sleeps.length? r1(sleeps.reduce((a,b)=>a+b,0)/sleeps.length) : null,
    waterDays: days.filter(s=>n(D(s).water)>=S.settings.waterTarget).length,
    exDays: days.filter(s=>n(D(s).exercise)>0).length,
    exMin: days.reduce((a,s)=>a+n(D(s).exercise),0),
    wStart: weights.length? n(D(weights[0]).weight):null, wEnd: weights.length? n(D(weights[weights.length-1]).weight):null,
    paid: S.money.filter(e=>e.type==='pay'&&inW(e.date)).reduce((a,e)=>a+n(e.amount),0),
    spent: S.money.filter(e=>e.type==='spend'&&inW(e.date)).reduce((a,e)=>a+n(e.amount),0),
    saved: S.money.filter(e=>(e.type==='save'||e.type==='withdraw')&&inW(e.date)).reduce((a,e)=>a+(e.type==='save'?1:-1)*n(e.amount),0),
    topCat: (()=>{ const c={}; S.money.filter(e=>e.type==='spend'&&inW(e.date)).forEach(e=>c[catOf(e)]=(c[catOf(e)]||0)+n(e.amount)); const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return k?[k,c[k]]:null; })(),
    helped: S.helps.filter(x=>inW(x.date)).length,
    contacted: S.contacts.reduce((a,c)=>a+(c.log||[]).filter(l=>inW(l.date)).length,0),
    studyMins: S.study.journal.filter(j=>inW(j.date)).reduce((a,j)=>a+n(j.mins),0),
    routinePct: (()=>{ let due=0,dn=0; days.forEach(s=>routinesOn(s).forEach(r=>{ due++; if(routineDone(s,r.id)) dn++; })); return due?Math.round(dn/due*100):null; })(),
    todosDone: S.todos.filter(x=>x.done && x.doneDate && inW(x.doneDate)).length,
    todosLeft: S.todos.filter(x=>!x.done && x.date<=end).length,
    diaryDays: days.filter(s=>(S.diary[s]||'').trim()).length,
    ateWell: days.filter(s=>D(s).ateWell).length,
    medPct: (()=>{ let due=0,tk=0; days.forEach(s=>medDoses(s).forEach(d=>{ due++; if(d.taken) tk++; })); return due?Math.round(tk/due*100):null; })(),
    goalsDone: S.goals.filter(g=>g.done && g.doneDate && inW(g.doneDate)).map(g=>g.title)
  };
}
function weekLabel(ws){ const a=parse(ws), b=parse(addDays(ws,6)); const o={day:'numeric',month:'short'}; return a.toLocaleDateString(undefined,o)+' – '+b.toLocaleDateString(undefined,o); }
function weekCard(t){
  const w = weekStats(weekStart(t)), sunday = parse(t).getDay()===0;
  return `<div class="card"><h2>${sunday?'Your week is ending':'This week so far'}<span class="sp"></span><span class="chip">${weekLabel(w.ws)}</span></h2>
    <div class="wkmini">${secOn('faith')?`<span><b>${w.bible}/${w.count}</b> Bible days</span>`:''}${secOn('ministry')?`<span><b>${w.minHours} h</b> ministry</span>`:''}${secOn('health')?`<span><b>${w.exDays}</b> exercise days</span>`:''}${secOn('people')?`<span><b>${w.helped+w.contacted}</b> people reached</span>`:''}<span><b>${w.todosDone}</b> to-dos done</span></div>
    <button class="btn ghost" data-a="weeksheet" style="margin-top:10px">${sunday?'Review my week and back up':'See weekly summary'}</button></div>`;
}
function delta(a,b,unit='',lessIsBetter=false){ if(b===null||b===undefined) return ''; const d=r1(a-b); const good=(d>0)!==lessIsBetter; if(!d) return '<small class="muted"> same as '+(delta.vs||'last week')+'</small>'; return `<small class="${good?'up':'down'}"> ${d>0?'▲ +':'▼ '}${d}${unit} vs ${delta.vs||'last week'}</small>`; }
function weekSheet(ws){

    <div class="area">Faith</div>

    <div class="area">Money</div>

    ${line('Saved', money(w.saved))}

    ${w.routinePct!==null?line('Routine kept', w.routinePct+'%'):''}
    ${line('To-do items done', w.todosDone, w.todosLeft?'<small class="muted">'+w.todosLeft+' still open</small>':'')}
    ${line('Diary entries', wk(w.diaryDays))}
    ${w.goalsDone.length?`<div class="muted" style="padding:0 0 8px">${w.goalsDone.map(esc).join(' · ')}</div>`:''}

    <div class="btns"><button class="btn" style="flex:1" data-a="backup">Back up now</button><button class="btn ghost" style="flex:1" data-a="close">Close</button></div>`, null);
  weekSheet.open = ws;

/* ================= PLANNER: to-do, alarms, medicine, food, diary ================= */
const WD = [[1,'M'],[2,'T'],[3,'W'],[4,'T'],[5,'F'],[6,'S'],[0,'S']];
const WDN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const RTYPES = [['bible','Daily Bible reading'],['study','Personal study'],['prayer','Prayer'],['meeting','Meeting preparation'],['family','Family worship'],['service','Field service'],['exercise','Exercise'],['task','Task'],['other','Other']];
const RFLAG = {bible:'bible', study:'study', prayer:'prayer', meeting:'meeting'};   // ticking these also ticks the matching box under "Faith today"
function routinesOn(date){ const wd=parse(date).getDay(); return S.reminders.filter(r=>r.on!==false && (r.days||[]).includes(wd)).sort((a,b)=>mins(a.time)-mins(b.time)); }
function routineDone(date, id){ return !!((S.routineDone||{})[date]||{})[id]; }
function setRoutineDone(date, r, on){
  S.routineDone = S.routineDone || {}; const m = S.routineDone[date] || (S.routineDone[date]={});
  if(on) m[r.id]=true; else delete m[r.id];
  if(RFLAG[r.type]) day(date)[RFLAG[r.type]] = on || undefined;
  if(on){ const fm=firedMap(date); if(!fm['rem:'+r.id]) fm['rem:'+r.id]='seen'; }   // done early: no need to ring
}
const mins = hhmm => { const [h,m]=String(hhmm||'0:0').split(':').map(Number); return h*60+m; };
const nowMins = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
function fmtTime(hhmm){ const [h,m]=String(hhmm).split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
function daysText(days){ if(!days||days.length===7) return 'Every day'; const set=new Set(days); if(days.length===5&&[1,2,3,4,5].every(x=>set.has(x))) return 'Weekdays'; if(days.length===2&&set.has(0)&&set.has(6)) return 'Weekends'; return WD.filter(([v])=>set.has(v)).map(([v])=>WDN[v]).join(', '); }
const AL = () => { const a = S.settings.alarm || (S.settings.alarm={beep:30,diaryTime:'21:00',diaryOn:true}); if(!a.sound) a.sound='marimba'; return a; };

/* everything that should ring on a given date */
function dueOn(date){
  const wd=parse(date).getDay(), out=[];
  S.reminders.filter(r=>r.on!==false && r.ring!==false && (r.days||[]).includes(wd) && !routineDone(date,r.id)).forEach(r=>out.push({key:'rem:'+r.id, time:r.time, title:r.title, kind:r.type||'other', id:r.id, beep:r.beep, sound:r.sound||'', created:r.created||0}));
  S.meds.filter(m=>m.on!==false && (!m.until || date<=m.until)).forEach(m=>(m.times||[]).forEach(tm=>out.push({key:'med:'+m.id+':'+tm, time:tm, title:'Take '+m.name+(m.dose?' ('+m.dose+')':''), kind:'med', id:m.id, slot:tm, sound:m.sound||AL().medSound||'', created:m.created||0})));
  S.todos.filter(x=>x.time && x.alarm!==false && !x.done && (x.date===date || (x.date<date && date===TODAY()))).forEach(x=>out.push({key:'todo:'+x.id, time:x.time, title:x.text, kind:'todo', id:x.id, sound:x.sound||'', created:x.date<date?0:(x.createdAt||0), quietMiss:x.date<date}));
  if(secOn('people')){ const fu=S.contacts.filter(c=>warmth(c)!=='off' && c.follow && (c.follow===date || (date===TODAY() && c.follow<date))); if(fu.length) out.push({key:'fu:'+fu.map(c=>c.id).sort().join(','), time:AL().followTime||'10:00', title:'Follow up: '+fu.slice(0,3).map(c=>firstName(c.name)).join(', ')+(fu.length>3?' and '+(fu.length-3)+' more':''), kind:'followup', created:Date.now(), quietMiss:true}); }
  if(secOn('secretary') && S.sec) (S.sec.duties||[]).filter(x=>x.due && (x.due===date || (date===TODAY() && x.due<date))).forEach(x=>out.push({key:'duty:'+x.id+':'+x.due, time:'09:00', title:(x.due<date?'Overdue: ':'Due today: ')+x.name, kind:'duty', id:x.id, created:Date.now(), quietMiss:true}));
  if(AL().diaryOn) out.push({key:'diary', time:AL().diaryTime, title:'Write about your day', kind:'diary', sound:AL().diarySound||'', created:Date.now(), quietMiss:true});
  return out.sort((a,b)=>mins(a.time)-mins(b.time));
}
function firedMap(date=TODAY()){ return S.fired[date] || (S.fired[date]={}); }

/* ---- sound (works offline; generated by the phone, no internet) ---- */
let AC=null;
function audio(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC && AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
document.addEventListener('pointerdown', ()=>audio(), {passive:true});
let beepTimer=null, beepStop=0;
/* ---- alarm sounds: made by the phone itself, so they work offline ---- */
const m2f = m => 440*Math.pow(2,(m-69)/12);
function tone(ac, f, t, dur, kind, vol){
  const g=ac.createGain(); g.connect(ac.destination);
  const parts = kind==='bell' ? [[1,1],[2.01,.35],[3.01,.18],[4.2,.08]]
              : kind==='marimba' ? [[1,1],[4,.12],[10,.03]]
              : kind==='box' ? [[1,1],[2,.25],[3,.06]]
              : kind==='piano' ? [[1,1],[2,.4],[3,.18],[4,.08]]
              : [[1,1]];
  const decay = kind==='bell'?dur:kind==='marimba'?0.45:kind==='box'?0.9:kind==='piano'?1.2:dur;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol, t+(kind==='flat'?0.005:0.01));
  if(kind==='flat'){ g.gain.setValueAtTime(vol,t+dur-0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); }
  else g.gain.exponentialRampToValueAtTime(0.0001, t+decay);
  parts.forEach(([mult,amp])=>{ const o=ac.createOscillator(), og=ac.createGain(); o.type= kind==='flat'?'square': kind==='box'?'triangle':'sine'; o.frequency.value=f*mult; og.gain.value=amp; o.connect(og); og.connect(g); o.start(t); o.stop(t+Math.max(dur,decay)+0.05); });
}
function chirp(ac, t, f1, f2, dur, vol){
  const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
const SOUNDS = {

const SOUND_KEYS = Object.keys(SOUNDS);
let beepLoop=null, beepEnd=null, playsndKey=null;
function startBeep(seconds, key){
  stopBeep();
  const snd = SOUNDS[key] || SOUNDS[AL().sound] || SOUNDS.marimba;
  const started = Date.now(); beepStop = started + seconds*1000;
  const once=()=>{
    if(Date.now()>beepStop){ stopBeep(); return; }
    const ac=audio(); if(!ac) return;
    const grow = Math.min(1, 0.55 + (Date.now()-started)/20000);   // starts softer, gets louder
    try{ snd.play(ac, ac.currentTime+0.03, grow); }catch(e){}
    try{ navigator.vibrate && navigator.vibrate([350,150,350]); }catch(e){}
  };
  once(); beepTimer=setInterval(once, snd.loop*1000);
}
function stopBeep(){ if(beepTimer) clearInterval(beepTimer); beepTimer=null; try{ navigator.vibrate && navigator.vibrate(0); }catch(e){} }
function soundSelect(id, cur, withDefault){
  return `<div class="sndrow"><select id="${id}">${withDefault?`<option value="" ${!cur?'selected':''}>Default (${esc(SOUNDS[AL().sound||'marimba'].name)})</option>`:''}${SOUND_KEYS.map(k=>`<option value="${k}" ${k===cur?'selected':''}>${esc(SOUNDS[k].name)}</option>`).join('')}</select><button class="btn ghost" data-a="playsnd" data-for="${id}" aria-label="Play sound">${svg('play',18)}</button></div>`;

/* ---- the clock that checks every 10 seconds ---- */
function checkAlarms(){
  if(NATIVE) return;   // the Android app hands every alarm to Android itself
  if(!S || !document.getElementById('alarm') || ringing || !document.getElementById('lock').hidden) return;
  const t=TODAY(), now=nowMins(), fm=firedMap(t);
  const sz=S.snooze.find(z=>z.at<=Date.now());
  if(sz){ S.snooze=S.snooze.filter(z=>z!==sz); save(); ring({...sz.item, key:sz.key}); return; }
  for(const it of dueOn(t)){
    if(fm[it.key]) continue;
    const diff=now-mins(it.time);
    if(diff>=0 && diff<=2){ ring(it); return; }
    if(diff>2){
      const due=new Date(); due.setHours(Math.floor(mins(it.time)/60), mins(it.time)%60, 0, 0);
      fm[it.key] = (!it.quietMiss && it.created && it.created < due.getTime()) ? 'missed' : 'seen'; save();
    }
  }
}
setInterval(checkAlarms, 10000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(checkAlarms,400); });

function gcalLink(time,title,days,date){

function SA(){ return S.study.active; }

function startStudy(preset){

  else { const t=val('stTitle').trim(); if(!t){ fail('stTitle','Write what you are studying'); return; } a.title=t; }

}

function finishStudy(){
  const a=SA(); if(!a) return;
  const ms=studyMs(a), minsDone=Math.max(1,Math.round(ms/60000));
  S.study.journal.push({id:uid(), ts:Date.now(), date:a.date||TODAY(), mins:minsDone, material:a.material, title:studyTitle(a), book:a.book||null, chapter:a.chapter||null, learned:a.learned.trim(), apply:a.apply.trim(), verse:a.verse.trim(), questions:a.questions.trim(), photos:a.photos||[]});
  day(a.date||TODAY()).study=true;
  if(a.material==='Bible chapter'){ const set=new Set(S.bible.read[a.book]||[]); if(!set.has(a.chapter)){ set.add(a.chapter); S.bible.read[a.book]=[...set].sort((x,y)=>x-y); S.bible.log.push({date:TODAY(), book:a.book, chapter:a.chapter, note:''}); } day().bible=true; }
  if(a.material==='Bible chapter'){ S.study.next = a.chapter<BOOKS[a.book-1][1] ? {book:a.book, chapter:a.chapter+1} : {book:a.book%66+1, chapter:1}; }
  S.study.active=null; save(); render(); toast('Saved: '+hoursText(minsDone/60)+' of personal study');
}

const ARTICLE_INTRO = ['I came across this and thought of you:','Here\'s something I think you\'ll find interesting:','You might like this short article:','This helped me, maybe it\'ll help you too:'];
const timeOfDay = () => { const h=new Date().getHours(); return h<12?'morning':h<17?'afternoon':'evening'; };
const firstName = s => String(s||'').trim().split(/\s+/)[0]||'';
function seededOrder(len, seed){ const a=[...Array(len).keys()]; let x=(seed>>>0)||1; for(let i=len-1;i>0;i--){ x=(Math.imul(x,1103515245)+12345)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function strHash(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h; }
function fillVals(p){ return {name:firstName(p.name), me:firstName(S.settings.name), place:p.place||'', topic:p.topic||'', ask:p.ask||'', lesson:p.lesson?String(p.lesson):'', day:p.day?'on '+p.day:''}; }
function canFill(t, v){ return (t.match(/\{(\w+)\}/g)||[]).every(k=>v[k.slice(1,-1)]); }
function fillT(t, v){ return t.replace(/\{(\w+)\}/g,(m,k)=>v[k]??''); }
/* who: {kind:'contact'|'student', p:person}; style: 'friendly'|'scripture'|'encourage'|'mine' */
function pickMessage(who, style, situation, time, offset){
  const p=who.p, v=fillVals(p), aud = who.kind==='student'?'student':(p.type==='met'?'met':'friend');
  let pool, key;
  if(style==='encourage'){ pool=SHEPHERD[situation||'discouraged']; key='sh-'+(situation||'discouraged'); }
  else if(style==='mine'){ pool=(S.settings.myTemplates||[]).map(t=>({t})); key='mine'; }
  else { pool=TPL[aud][style]||TPL[aud].friendly; key=aud+'-'+style; }
  const ok=pool.map((x,i)=>({...x,i})).filter(x=>canFill(x.t,v));
  if(!ok.length) return {text:'', mid:'', ref:''};
  const seed=dayNum()*7 + strHash(p.id||p.name), order=seededOrder(ok.length, seed).map(i=>ok[i]);
  const sent=new Set(p.sent||[]), fresh=order.filter(x=>!sent.has(key+':'+x.i)), list=fresh.length?fresh:order;
  const pick=list[offset % list.length];
  const g=GREET[time][(seed+offset)%GREET[time].length], c=CLOSE[time][(seed+offset*3+1)%CLOSE[time].length];
  const body=fillT(pick.t, v);
  const text = style==='mine' ? body : fillT(g, v)+' '+body+' '+c;
  return {text, mid:key+':'+pick.i, ref:pick.ref||''};
}

const SECTIONS = [['goals','Goals'],['faith','Bible and personal study'],['ministry','Ministry and Bible students'],['health','Health'],['money','Money'],['people','People I meet and helping others']];
function secOn(k){ const sc=((S.settings||{}).sections||{}); return k==='secretary' ? sc.secretary===true && S.settings.sectionLock==null : sc[k]!==false; }
const B32='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
function pin16(pin){ return strHash('lc:'+pin) & 0xffff; }
function makeCode(secs, pin){
  let v=0; SECTIONS.forEach(([k],i)=>{ if(secs[k]) v|=1<<i; });
  if(pin){ v|=1<<6; v|=pin16(pin)<<7; }
  v += (v % 31) * 2**23;
  let s=''; for(let i=0;i<6;i++){ s=B32[v%32]+s; v=Math.floor(v/32); }
  return 'LC-'+s.slice(0,3)+'-'+s.slice(3);
}
function readCode(code){
  let c=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length===8 && c.startsWith('LC')) c=c.slice(2);
  if(c.length!==6 || [...c].some(ch=>!B32.includes(ch))) return null;
  let v=0; for(const ch of c) v=v*32+B32.indexOf(ch);
  const body=v % 2**23, chk=Math.floor(v/2**23);
  if(chk!==body%31) return null;
  const secs={}; SECTIONS.forEach(([k],i)=>secs[k]=!!(body&(1<<i)));
  if(!Object.values(secs).some(Boolean)) return null;
  return {secs, lock: body&(1<<6) ? (body>>7)&0xffff : null};
}
function applyCode(r){
  S.settings.sections = {...r.secs, secretary:false}; S.settings.sectionLock = r.lock; S.settings.setupAsked=true; save();
  tab='today'; closeSheet(); render(); window.scrollTo(0,0);

}

const nextMonth = m => { const d=parse(m+'-01'); d.setMonth(d.getMonth()+1); return ymd(d).slice(0,7); };
function lastNMonths(endM,k){ const out=[]; let m=endM; for(let i=0;i<k;i++){ out.unshift(m); m=prevMonth(m); } return out; }
const monthHasData = m => Object.keys(SEC().reports[m]||{}).length>0;
function lastReported(p){ const ks=Object.keys(SEC().reports).filter(m=>repState(rep(m,p.id))==='in').sort(); return ks[ks.length-1]||null; }
/* inactive: no report for six months in a row (counted only over months where reports were entered) */
function inactivePubs(){
  const ms=lastNMonths(secMonthDefault(),6), full=ms.every(monthHasData);
  return SEC().pubs.filter(p=>p.status!=='moved' && (p.status==='inactive' || (full && (p.since||'0000')<=ms[0] && ms.every(m=>repState(rep(m,p.id))!=='in'))));
}
function irregularPubs(){
  const ms=lastNMonths(secMonthDefault(),6).filter(monthHasData), ina=new Set(inactivePubs().map(p=>p.id));
  return activePubs().filter(p=>!ina.has(p.id)).map(p=>({p, missed:ms.filter(m=>(p.since||'0000')<=m && repState(rep(m,p.id))!=='in').length})).filter(x=>x.missed>0).sort((a,b)=>b.missed-a.missed);
}

/* ---------- circuit overseer summary PDF (made on the phone) ---------- */
async function makeCOSummary(){
  const L=await loadPdfLib(), doc=await L.PDFDocument.create();
  const font=await doc.embedFont(L.StandardFonts.Helvetica), bold=await doc.embedFont(L.StandardFonts.HelveticaBold);
  const ink=L.rgb(0.05,0.13,0.3), grey=L.rgb(0.4,0.45,0.52), line=L.rgb(0.85,0.88,0.92), W=595, H=842, M=40;
  const clean=x=>String(x??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/✓/g,'Yes').replace(/[^\x20-\x7E\xA0-\xFF]/g,'');
  const fit=(x,w,size,f)=>{ x=clean(x); while(x && f.widthOfTextAtSize(x,size)>w) x=x.slice(0,-1); return x; };
  let page, y;
  const newPage=()=>{ page=doc.addPage(); page.setSize(W,H); y=H-M; };
  const need=h=>{ if(y-h<M+20) newPage(); };
  const text=(x,xp,size=9.5,f=font,c=ink)=>page.drawText(clean(x),{x:xp,y,size,font:f,color:c});
  const heading=x=>{ need(44); y-=10; text(x,M,12.5,bold); y-=6; page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:1,color:ink}); y-=14; };
  const row=(cells,xs,f=font,size=9.5)=>{ need(14); cells.forEach((c,i)=>text(fit(c,((xs[i+1]||W-M)-xs[i])-6,size,f),xs[i],size,f)); y-=5; page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:0.4,color:line}); y-=10; };
  const note=x=>{ need(14); text(x,M,9,font,grey); y-=14; };
  const end=secMonthDefault(), ms=lastNMonths(end,6), mn=m=>monthName(m).split(' ')[0].slice(0,3)+' '+m.slice(2,4);
  newPage();
  text('Congregation summary for the circuit overseer',M,16,bold); y-=18;
  text(monthName(ms[0])+' to '+monthName(end)+'   ·   Prepared '+parse(TODAY()).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+(SEC().co.date?'   ·   Visit '+parse(SEC().co.date).toLocaleDateString('en-GB',{day:'numeric',month:'long'}):''),M,9.5,font,grey); y-=10;

  heading('1. Field service reports');
  let xs=[M,120,200,290,390,490];
  row(['Month','Reports in','Publishers (studies)','Aux. pioneers (hours)','Reg. pioneers (hours)','All studies'],xs,bold,8.5);
  ms.forEach(m=>{ const t=monthTotals(m); if(!monthHasData(m)) return row([mn(m),'not entered','','','',''],xs);
    row([mn(m),(t.in+t.none)+' of '+t.total,t.pub.n+' ('+t.pub.st+')',t.aux.n+' ('+r1(t.aux.h)+')',t.rp.n+' ('+r1(t.rp.h)+')',t.pub.st+t.aux.st+t.rp.st],xs); });

  heading('2. Meeting attendance (average)');
  xs=[M,200,360];
  row(['Month','Midweek','Weekend'],xs,bold,8.5);
  ms.forEach(m=>{ const a=attMonth(m,'mid'), b=attMonth(m,'wk'); row([monthName(m),a.n?a.avg+'  ('+a.n+' meeting'+(a.n===1?'':'s')+')':'-',b.n?b.avg+'  ('+b.n+' meeting'+(b.n===1?'':'s')+')':'-'],xs); });

  heading('3. Pioneers: hours each month');
  const pios=activePubs().filter(isPioneer).sort((a,b)=>a.name.localeCompare(b.name));
  xs=[M,190,240,290,340,390,440,490];
  row(['Name',...ms.map(mn),'Total'],xs,bold,8.5);
  if(!pios.length) note('No pioneers marked.');
  pios.forEach(p=>{ let tot=0; const cells=ms.map(m=>{ const r=rep(m,p.id); if(!r||r.shared===false) return '-'; tot+=n(r.hours); return r.hours!=null?r1(n(r.hours)):'-'; }); row([p.name,...cells,r1(tot)],xs); });

  heading('4. Inactive publishers (no report for 6 months)');
  const ina=inactivePubs();
  xs=[M,230,360];
  if(ina.length){ row(['Name','Group','Last report'],xs,bold,8.5); ina.forEach(p=>{ const lr=lastReported(p); row([p.name,p.group||'-',lr?monthName(lr):'none recorded'],xs); }); } else note('None.');

  heading('5. Irregular publishers (missed at least one of the 6 months)');
  const irr=irregularPubs();
  if(irr.length){ row(['Name','Group','Months missed'],xs,bold,8.5); irr.forEach(x=>row([x.p.name,x.p.group||'-',x.missed],xs)); } else note('None.');

  heading('6. Field service groups');
  xs=[M,200,300,420];
  const groups=groupsList();
  if(groups.length){ row(['Group','Active publishers','Reports in (6 months)','Missing for '+mn(end)],xs,bold,8.5);
    groups.forEach(g=>{ const ps=activePubs().filter(p=>(p.group||'')===g); let due=0, got=0; ms.filter(monthHasData).forEach(m=>ps.forEach(p=>{ due++; if(repState(rep(m,p.id))!=='missing') got++; }));
      row([g,ps.length,due?pct(got,due)+'%':'-',ps.filter(p=>repState(rep(end,p.id))==='missing').length],xs); }); }
  else note('No groups set.');

  heading('7. Newly baptized (first year)');
  const nb=newlyBaptized();
  xs=[M,220,330,400];
  if(nb.length){ row(['Name','Baptized','Visits','Last visit'],xs,bold,8.5); nb.forEach(p=>{ const lv=lastVisit(p); const fd=x=>parse(x).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); row([p.name,fd(p.baptized),(p.visits||[]).length,lv?fd(lv):'not visited'],xs); }); } else note('None in the last year.');

  const od=SEC().duties.filter(x=>x.due && daysSince(x.due)>0);
  if(od.length){ heading('8. Overdue duties'); od.forEach(x=>note(x.name+' - due '+nice(x.due))); }
  need(30); y-=10; note('Confidential congregation record. Made with Life Compass.');
  return doc.save();
}

/* ---------- paste a group's report ---------- */
function matchPub(name, pool){
  const k=name.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim(); if(k.length<2) return null;
  const words=k.split(' ');
  return pool.find(p=>p.name.toLowerCase()===k)
    || pool.find(p=>{ const pn=p.name.toLowerCase(); return words.every(w=>pn.includes(w)); })
    || (words.length===1 ? (pool.filter(p=>p.name.toLowerCase().split(/\s+/).includes(k)).length===1 ? pool.find(p=>p.name.toLowerCase().split(/\s+/).includes(k)) : null) : null);
}
function parseReportLine(line, pool){
  const raw=line.replace(/^[\s\d]+[.)]\s+/,'').trim(); if(!raw) return null;
  const nm=(raw.match(/^[^\d:,\-–(|✓✔✗×]+/)||[''])[0].replace(/\b(yes|no|shared|did|not|none|nil)\b.*$/i,'').trim();
  const rest=raw.slice(nm.length).toLowerCase();
  const p=matchPub(nm, pool);
  const hrs=(rest.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/)||[])[1];
  let st=(rest.match(/(\d+)\s*(?:bs|st|stud|studies|study|b\.s)\b/)||[])[1];
  const nums=(rest.replace(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/,'').match(/\d+/g)||[]);
  if(st==null && nums.length) st=nums[nums.length-1];
  const no=/\b(no|not|didn'?t|did not|none|nil)\b|✗|×|\bx\b/.test(rest) && !hrs && !(st>0);
  const yes=!no && (/\b(yes|y|shared|did|✓|✔|ok)\b|✓|✔/.test(rest) || hrs!=null || st!=null);
  return {line:raw, name:nm, p, shared: yes?true: no?false: null, hours:hrs!=null?n(hrs):null, studies:st!=null?n(st):0, aux:/\baux/.test(rest)};
}

/* ---------- field service timer (uses the phone's clock; works offline) ---------- */
function T(){ return S.timer || (S.timer={running:false, startedAt:null, sessionMs:0, segments:0}); }
function hm(ms){ const m=Math.round(ms/60000); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'; }
function clock(ms){ const s=Math.floor(ms/1000); return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function hoursText(h){ const m=Math.round(n(h)*60); return m<60? m+' min' : Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''); }
function timerNow(){ const t=T(); return t.sessionMs + (t.running ? Date.now()-t.startedAt : 0); }
function addMinistryMs(ms, date){
  if(ms<30000) return 0;                             // ignore taps under 30 seconds
  let en=S.ministry.find(x=>x.date===date && !x.manual);
  if(!en){ en={id:uid(), date, hours:0, studies:0, notes:'Field service timer'}; S.ministry.push(en); }
  en.hours = Math.round((n(en.hours)+ms/3.6e6)*100)/100;
  return ms;
}
function timerStart(){ const t=T(); t.running=true; t.startedAt=Date.now(); if(!t.sessionMs) t.segments=0; save(); render(); toast('Field service started'); }
function timerPause(){
  const t=T(); if(!t.running) return;
  const ms=Date.now()-t.startedAt, date=ymd(new Date(t.startedAt));
  const added=addMinistryMs(ms, date);
  t.sessionMs+=ms; t.segments++; t.running=false; t.startedAt=null; save(); render();
  toast(added? hm(ms)+' added to your hours' : 'Paused');
}
function timerEnd(){
  const t=T(); if(t.running) timerPause();
  const total=t.sessionMs; t.sessionMs=0; t.segments=0; save(); render();
  if(total>=30000) toast('Session saved: '+hm(total));
}
function timerCard(){
  const t=T(), now=timerNow(), today=S.ministry.filter(e=>e.date===TODAY()).reduce((a,e)=>a+n(e.hours),0), long=t.running && Date.now()-t.startedAt>8*3.6e6;
  return `<div class="card timer ${t.running?'on':''}"><h2>${svg('faith',18)} Field service timer<span class="sp"></span><span class="chip">${t.running?'Running':t.sessionMs?'Paused':'Ready'}</span></h2>

const SY_MONTHS = ['09','10','11','12','01','02','03','04','05','06','07','08'];
const MONTH_NAMES = ['September','October','November','December','January','February','March','April','May','June','July','August'];
function syOf(m){ const [y,mm]=m.split('-').map(Number); return mm>=9 ? y+1 : y; }           // service year named by the year it ends
function syMonthList(sy){ return SY_MONTHS.map(mm=>(n(mm)>=9?sy-1:sy)+'-'+mm); }
function syLabel(sy){ return 'Sept '+(sy-1)+' – Aug '+sy; }
const curSY = () => syOf(MONTH());

/* one publisher's year, the way the S-21 card shows it */
function pubYear(p, sy){
  const rows=syMonthList(sy).map(m=>{ const r=rep(m,p.id); return {m, r, shared:r&&r.shared!==false, studies:r&&r.shared!==false?n(r.studies):'', aux:!!(r&&r.aux), hours:r&&r.hours!=null&&(isPioneer(p)||r.aux||p.type==='fm')?n(r.hours):'', remarks:r?(r.remarks||''):''}; });
  return {rows, hours:rows.reduce((a,x)=>a+(x.hours===''?0:x.hours),0), studies:rows.reduce((a,x)=>a+(x.studies===''?0:x.studies),0), months:rows.filter(x=>x.shared).length};
}
/* the congregation's totals for each month of the year (for the total cards) */
function catYear(cat, sy){

}

/* ---------- meeting attendance ---------- */
function meetingsIn(m, kind){ return (SEC().meetings||[]).filter(x=>x.date.slice(0,7)===m && x.kind===kind); }
function attMonth(m, kind){ const l=meetingsIn(m,kind), tot=l.reduce((a,x)=>a+n(x.count),0); return {n:l.length, total:tot, avg:l.length?Math.round(tot/l.length):''}; }
function attYearAvg(sy, kind){ const a=syMonthList(sy).map(m=>attMonth(m,kind)).filter(x=>x.n); return a.length?Math.round(a.reduce((s,x)=>s+x.avg,0)/a.length):''; }
function guessKind(d){ const wd=parse(d).getDay(), st=SEC().meetDays||{}; if(st.wk!=null) return wd===n(st.wk)?'wk':'mid'; return wd===0||wd===6?'wk':'mid'; }

/* ---------- loading the PDF tool (downloaded once, then kept on the phone) ---------- */
const PDFLIB_URL='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
async function loadPdfLib(){
  if(window.PDFLib) return window.PDFLib;
  let code=null; try{ code=await photoGet('lib:pdf-lib'); }catch(e){}
  if(!code){
    if(!navigator.onLine) throw new Error('Connect to the internet once so the app can get its printing tool. After that, printing works offline.');
    const r=await fetch(PDFLIB_URL); if(!r.ok) throw new Error('Could not download the printing tool. Try again with data on.');
    code=await r.text(); try{ await photoPut('lib:pdf-lib', code); }catch(e){}
  }
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=URL.createObjectURL(new Blob([code],{type:'text/javascript'})); s.onload=res; s.onerror=()=>rej(new Error('The printing tool did not load.')); document.head.appendChild(s); });
  return window.PDFLib;
}
const FORM_KEY={s21:'form:S-21', s88:'form:S-88'};
function b64ToBytes(b64){ const s=atob(b64.split(',').pop()); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function bytesToB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function savePdfFile(bytes, name){
  if(NATIVE){
    const F=window.Capacitor.Plugins.Filesystem, Sh=window.Capacitor.Plugins.Share;
    const r=await F.writeFile({path:name, data:bytesToB64(bytes), directory:'CACHE'});
    await Sh.share({title:name, files:[r.uri], dialogTitle:'Open or send the PDF'});
    return;
  }
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
}

const S21 = { rows:[628,608,588,568,549,529,509,489,469,450,430,410], shareX:130, auxX:271, studiesX:207, hoursX:348, remarksX:388, totalY:387,

function tick(page, x, y, rgb, s=1){ page.drawLine({start:{x:x+2*s,y:y+5*s}, end:{x:x+5*s,y:y+1.5*s}, thickness:1.5, color:rgb}); page.drawLine({start:{x:x+5*s,y:y+1.5*s}, end:{x:x+11.5*s,y:y+10*s}, thickness:1.5, color:rgb}); }
const htick=(pg,x,y,ink)=>tick(pg,x+0.5,y+2.5,ink,0.75);
async function makeS21(people, sy, totals){
  const L=await loadPdfLib(), blank=await photoGet(FORM_KEY.s21); if(!blank) throw new Error('Add your blank S-21 card first.');
  const src=await L.PDFDocument.load(b64ToBytes(blank)), out=await L.PDFDocument.create();
  const font=await out.embedFont(L.StandardFonts.Helvetica), bold=await out.embedFont(L.StandardFonts.HelveticaBold), ink=L.rgb(0.05,0.13,0.35);
  const fit=(t,max,size)=>{ t=String(t||''); while(t && font.widthOfTextAtSize(t,size)>max) t=t.slice(0,-1); return t; };
  const centre=(page,t,cx,y,size=10,f=font)=>{ t=String(t); page.drawText(t,{x:cx-f.widthOfTextAtSize(t,size)/2, y, size, font:f, color:ink}); };
  const add = async (fillFn) => { const [pg]=await out.copyPages(src,[0]); out.addPage(pg); fillFn(pg); };
  for(const p of people){
    const y=pubYear(p, sy);
    await add(pg=>{
      pg.drawText(fit(p.name,300,11),{x:S21.name[0],y:S21.name[1],size:11,font:bold,color:ink});
      if(p.dob) pg.drawText(nice(p.dob).replace(/^\w+, /,'')+' '+p.dob.slice(0,4),{x:S21.dob[0],y:S21.dob[1],size:10,font,color:ink});
      if(p.baptized) pg.drawText(nice(p.baptized).replace(/^\w+, /,'')+' '+p.baptized.slice(0,4),{x:S21.bap[0],y:S21.bap[1],size:10,font,color:ink});
      if(p.gender==='m') htick(pg,S21.male,S21.sexY,ink); if(p.gender==='f') htick(pg,S21.female,S21.sexY,ink);
      if(p.hope==='os') htick(pg,S21.os,S21.hopeY,ink); if(p.hope==='an') htick(pg,S21.an,S21.hopeY,ink);
      if(p.elder) htick(pg,S21.roles.elder,S21.roleY,ink); if(p.ms) htick(pg,S21.roles.ms,S21.roleY,ink);
      if(p.type==='rp') htick(pg,S21.roles.rp,S21.roleY,ink); if(p.type==='sp') htick(pg,S21.roles.sp,S21.roleY,ink); if(p.type==='fm') htick(pg,S21.roles.fm,S21.roleY,ink);
      pg.drawText(String(sy),{x:22,y:650,size:10,font:bold,color:ink});
      y.rows.forEach((r,i)=>{ const yy=S21.rows[i];
        if(r.shared) tick(pg,S21.shareX,yy,ink);
        if(r.aux) tick(pg,S21.auxX,yy,ink);
        if(r.studies!=='' && r.shared) centre(pg,r.studies,S21.studiesX,yy+1);
        if(r.hours!=='') centre(pg,r1(r.hours),S21.hoursX,yy+1);
        if(r.remarks) pg.drawText(fit(r.remarks,186,8),{x:S21.remarksX,y:yy+2,size:8,font,color:ink});
      });
      if(y.hours) centre(pg,r1(y.hours),S21.hoursX,S21.totalY,10,bold);
    });
  }
  for(const [cat,label] of totals){
    const rows=catYear(cat, sy);
    await add(pg=>{
      pg.drawText(label,{x:S21.name[0],y:S21.name[1],size:11,font:bold,color:ink});
      pg.drawText(String(sy),{x:22,y:650,size:10,font:bold,color:ink});
      rows.forEach((r,i)=>{ const yy=S21.rows[i]; if(!r.n) return;
        centre(pg,r.studies,S21.studiesX,yy+1);
        if(r.hours!=='' ) centre(pg,r.hours,S21.hoursX,yy+1);
        pg.drawText(r.n+' report'+(r.n===1?'':'s'),{x:S21.remarksX,y:yy+2,size:8,font,color:ink}); });
      const th=rows.reduce((a,r)=>a+(r.hours===''?0:n(r.hours)),0); if(cat!=='pub' && th) centre(pg,r1(th),S21.hoursX,S21.totalY,10,bold);
    });
  }
  return out.save();
}

/* ================= GOALS: suggested steps for this month ================= */
function monthsLeft(g){ if(g.horizon==='1m') return 1; if(g.horizon==='1y') return 12-parse(TODAY()).getMonth(); const end=n(S.settings.started.slice(0,4))+5; return Math.max(1,(end-n(YEAR()))*12+12-parse(TODAY()).getMonth()); }
function sundaysLeft(){ const out=[]; let d=TODAY(); const m=MONTH(); while(d.slice(0,7)===m){ if(parse(d).getDay()===0) out.push(d); d=addDays(d,1); } return out; }
function monthlyIncome(){
  const from=addDays(TODAY(),-90), pays=S.money.filter(e=>e.type==='pay'&&e.date>=from);
  if(!pays.length) return 0;
  const months=new Set(pays.map(e=>e.date.slice(0,7))).size;
  return sum(pays)/Math.max(1,Math.min(3,months));
}
function moneyNum(t){
  const m=t.match(/(?:gh₵|ghs?|₵|cedis?)\s*(\d[\d,.]*)/) || t.match(/(\d[\d,.]*)\s*(?:gh₵|ghs?\b|₵|cedis?\b)/);
  return m?n(m[1]):0;
}
function goalThing(title){
  const m=String(title).match(/\b(?:buy|get|purchase|afford|save for|save up for)\s+(?:a |an |the |my |some )?(.+?)(?=\s+(?:which|that|for|costing|worth|at|by|before|this|next|in)\b|[,.(]|\s*\d|$)/i);
  const x=(m?m[1]:title).trim();
  return x.length>36?x.slice(0,34)+'…':x;
}
function goalEnd(g){
  if(g.horizon==='1m') return ymd(new Date(parse(MONTH()+'-01').getFullYear(), parse(MONTH()+'-01').getMonth()+1, 0));
  if(g.horizon==='1y') return (g.period||YEAR())+'-12-31';
  return (n(S.settings.started.slice(0,4))+5)+S.settings.started.slice(4);
}
function suggestSteps(g){
  const t=(g.title||'').toLowerCase(), num=n((t.match(/(\d[\d,.]*)/)||[])[1])||n(g.target), left=monthsLeft(g), monthNeed=num?Math.ceil(num/left):0;
  const m=MONTH(), d=k=>{ const x=parse(m+'-01'); x.setDate(k); return ymd(x)<TODAY()?TODAY():ymd(x); };
  const last=ymd(new Date(parse(m+'-01').getFullYear(), parse(m+'-01').getMonth()+1, 0));
  const sundays=sundaysLeft(), steps=[];
  const add=(text,date,kind='todo',extra={})=>steps.push({text,date,kind,...extra});
  const weekly=(text)=>sundays.forEach(s=>add(text,s));
  const isMoney = /₵/.test(t) || /\b(save|saving|savings|money|cedis?|ghs|debt|budget|buy|purchase|afford|costs?|price|pay for)\b/.test(t);
  if(/bethel/.test(t)){
    if(/\b(visit|tour|go to|see)\b/.test(t) && !/\b(serve|service|apply|application|work)\b/.test(t)){
      add('Check the tour days and book your visit on jw.org (About Us → Offices and Tours)', d(1));
      add('Choose the date and ask who would like to come with you', d(3));
      add('Plan the transport: how you will get there and what it will cost', d(5));
      add('Set aside money for transport and food', d(7));
      add('Get ready: dress neatly, leave early, take water', last);
      add('After the visit, write what you saw and learned in My notes', last);
    } else {
      add('Read about Bethel service on jw.org (search "Bethel service")', d(1));
      add('Tell the elders that you would like to apply for Bethel service', d(3));
      add('Plan to attend the meeting for those interested in Bethel at the next regional convention', d(10));
      add('Personal study', '', 'routine', {type:'study', days:[1,3], time:'19:00', title:'Personal study'});
      weekly('Weekly check: did I keep up Bible reading, meetings and ministry this week?');
      add('Look after your health: sleep well and exercise', d(7));
    }
  } else if(isMoney){
    const amt=moneyNum(t)||n(g.target)||num, thing=goalThing(g.title), end=goalEnd(g);
    const weeks=Math.max(1, Math.ceil((parse(end)-parse(TODAY()))/(7*864e5)));
    const inc=monthlyIncome();
    if(!amt){
      add('Find out the price, then edit this goal and put the amount as its target', d(1));
      add('Look at your income on Money → Overview and decide how much you can set aside each week', d(2));
      weekly('Put this week\'s amount into savings');
    } else {
      const perWeek=Math.ceil(amt/weeks), perMonth=Math.round(perWeek*4.33), share=inc?Math.round(perMonth/inc*100):0;
      add(`Open a savings goal "${thing}" for ${money(amt)}`, d(1), 'savegoal', {name:thing, amount:amt, deadline:end});
      add(inc
        ? `Save ${money(perWeek)} every week for ${weeks} week${weeks===1?'':'s'}. That is about ${share}% of the ${money(inc)} you pay yourself each month.`
        : `Save ${money(perWeek)} every week for ${weeks} week${weeks===1?'':'s'}. (Record "I paid myself" on the Money page, and next time the app will compare this with your income.)`, d(1));
      if(inc && share>50) add(`Check: this needs more than half of what you earn. Think about a later date or a cheaper ${thing}.`, d(1));
      sundays.forEach(s=>add(`Put ${money(perWeek)} into savings for ${thing}`, s));
      if(/\b(buy|purchase|get|afford)\b/.test(t)) add(`Compare prices in two or three shops for ${thing}`, d(10));
      add(`Buy ${thing} when your savings reach ${money(amt)}`, end<=last?end:last);
    }
  } else if(/pioneer|hours|ministry|field service|preach/.test(t)){
    const h=monthNeed || (/aux/.test(t)?30:/regular/.test(t)?50:15), perWeek=r1(h/4.3);
    if(/aux/.test(t)) add('Hand in the auxiliary pioneer application', d(3));
    add(`Aim for about ${perWeek} hours each week, so you reach ${h} hours this month`, d(1));
    add('Field service', '', 'routine', {type:'service', days:[6], time:'08:30', title:'Field service'});
    add(`Halfway check: you should have about ${Math.round(h/2)} hours by today`, d(15));
    add('Invite someone to work with you in service this week', d(5));
    weekly('Check your hours on Faith → Ministry');
  } else if(/bible|chapter|read the|scripture/.test(t) && !/study with|student|bible stud/.test(t)){
    const ch = /whole bible|entire bible|1189/.test(t) ? Math.ceil(1189/(left*30)) : monthNeed ? Math.ceil(monthNeed/30) : 1;
    add('Daily Bible reading', '', 'routine', {type:'bible', days:[0,1,2,3,4,5,6], time:'05:30', title:'Daily Bible reading'});
    add(`Read about ${ch} chapter${ch===1?'':'s'} each day`, d(1));
    weekly('Write one thought from this week\'s reading in My notes');
    add('Look back: how many chapters did you read this month?', last);
  } else if(/student|bible stud|study with/.test(t)){
    add('Offer a free Bible study to 3 people you meet in service', d(7));
    add('Follow up everyone marked red on the People tab', d(3));
    add('Ask an experienced publisher to come with you to a study', d(10));
    weekly('Send each Bible student a friendly message');
  } else if(/personal study|watchtower|meeting|prepare|comment/.test(t)){
    add('Personal study', '', 'routine', {type:'study', days:[1,3], time:'19:00', title:'Personal study'});
    add('Meeting preparation', '', 'routine', {type:'meeting', days:[2,5], time:'19:30', title:'Meeting preparation'});
    weekly('Prepare one comment for the weekend meeting');
  } else if(/\b(weight|kg|lose|fit|fitness|exercise|walk|run|gym|health)\b/.test(t)){
    const kg=/\b(kg|weight|lose)\b/.test(t)&&num?Math.min(num/left, 2):0;
    add('Exercise', '', 'routine', {type:'exercise', days:[1,3,5], time:'06:00', title:'Exercise (30 minutes)'});
    if(kg) add(`Aim to lose about ${r1(kg)} kg this month (about 0.5 kg a week is healthy)`, d(1));
    add('Swap sugary drinks for water this week', d(2));
    weekly('Weigh yourself and write it on the Today page');
    add('If you have a health condition, see a doctor before starting hard exercise', d(1));
  } else if(/business|shop|customer|sales|farm|egg|bread/.test(t)){
    add('Write the 3 things that would help this most this month', d(1));
    add('Do the first one', d(7));
    weekly('Check progress and write the numbers down');
    add('Talk to one person who has done this before', d(14));
  } else {
    add('Write one sentence: why does this goal matter to you?', d(1));
    add('Decide the first small thing you can do this week', d(2));
    add('Do that first small thing', d(7));
    weekly('Weekly check: what did you do this week for this goal?');
    add('Tell one person who can encourage you', d(4));
  }
  return steps;
}
function suggestSheet(id){
  const g=S.goals.find(x=>x.id===id), steps=suggestSteps(g);
  const exists=st=> st.kind==='routine' ? S.reminders.some(r=>r.type===st.type) : st.kind==='savegoal' ? S.savings.some(x=>x.name.toLowerCase()===st.name.toLowerCase()) : S.todos.some(x=>x.text===st.text && x.date===st.date);
  const ask=`Help me plan this goal for ${monthName(MONTH())}: "${g.title}"${g.target?' (target '+g.target+(g.unit?' '+g.unit:'')+')':''}. Give me 5 to 8 practical weekly steps.`;
  openSheet(`<h3>Steps for ${monthName(MONTH())}</h3><p class="muted" style="margin:-6px 0 10px">${esc(g.title)}</p>
    <p class="muted" style="font-size:12.5px;margin:0 0 8px">A simple plan for this month. Each ticked step goes into Today's plan on its date. Untick anything that doesn't fit.</p>
    ${steps.map((st,i)=>`<label class="row" style="cursor:pointer;align-items:flex-start"><input type="checkbox" class="sgStep" value="${i}" ${exists(st)?'':'checked'} style="width:22px;height:22px;margin-top:2px"><span class="lbl">${esc(st.text)}<small>${st.kind==='routine'?'Repeats: '+esc(daysText(st.days))+' at '+fmtTime(st.time)+(exists(st)?' · you already have one':''):st.kind==='savegoal'?'Creates it on Money → Savings'+(exists(st)?' · already there':''):'On your plan for '+nice(st.date)+(exists(st)?' · already there':'')}</small></span></label>`).join('')}
    <div class="btns" style="flex-direction:column;margin-top:10px"><button class="btn" data-a="sgadd" data-id="${id}">Add ticked steps to my plan</button>
      <a class="btn ghost" href="https://claude.ai/new?q=${encodeURIComponent(ask)}" target="_blank" rel="noopener">Ask Claude for a more detailed plan ↗</a>
      <button class="btn ghost" data-a="close">Close</button></div>`, null);
  suggestSheet.steps=steps;
}
function addSuggested(id){
  const g=S.goals.find(x=>x.id===id), steps=suggestSheet.steps||[]; let n1=0, n2=0;
  g.steps=g.steps||[];
  document.querySelectorAll('.sgStep:checked').forEach(c=>{ const st=steps[n(c.value)];
    if(st.kind==='savegoal'){ let sg=S.savings.find(x=>x.name.toLowerCase()===st.name.toLowerCase()); if(!sg){ sg={id:uid(), name:st.name, target:st.amount, deadline:st.deadline}; S.savings.push(sg); n1++; } g.saveId=sg.id; }
    else if(st.kind==='routine'){ if(!S.reminders.some(r=>r.type===st.type)){ S.reminders.push({id:uid(), type:st.type, title:st.title, time:st.time, days:st.days, ring:true, on:true, beep:AL().beep, created:Date.now()}); n2++; } }
    else { const td={id:uid(), text:st.text, date:st.date, time:'', alarm:true, done:false, created:TODAY(), createdAt:Date.now(), goal:id}; S.todos.push(td); g.steps.push(td.id); n1++; }
  });
  save(); closeSheet(); render(); toast((n1?n1+' to-do'+(n1===1?'':'s'):'')+(n1&&n2?' and ':'')+(n2?n2+' routine'+(n2===1?'':'s'):'')+(n1||n2?' added':'Nothing new added'));
}
function goalStepsText(g){ const ids=g.steps||[]; if(!ids.length) return ''; const l=S.todos.filter(t=>ids.includes(t.id)); const dn=l.filter(t=>t.done).length; return dn+' of '+l.length+' steps done'; }

/* ================= HISTORY: look back at any month ================= */
let histMonth=null;
function monthStats(m){
  const days=Object.keys(S.days).filter(k=>k.slice(0,7)===m), D=k=>S.days[k]||{};
  const inM=x=>x&&x.slice(0,7)===m;
  const sleeps=days.map(k=>n(D(k).sleep)).filter(x=>x>0), weights=days.filter(k=>n(D(k).weight)>0).sort();
  const spends=S.money.filter(e=>e.type==='spend'&&inM(e.date)), pays=S.money.filter(e=>e.type==='pay'&&inM(e.date));
  return {
    bible: days.filter(k=>D(k).bible).length, chapters: S.bible.log.filter(x=>inM(x.date)).length,
    study: S.study.journal.filter(j=>inM(j.date)).reduce((a,j)=>a+n(j.mins),0),
    hours: ministryMonth(m), studies: studiesInMonth(m).length, people: S.contacts.reduce((a,c)=>a+(c.log||[]).filter(l=>inM(l.date)).length,0),
    sleep: sleeps.length?r1(sleeps.reduce((a,b)=>a+b,0)/sleeps.length):null, exercise: days.reduce((a,k)=>a+n(D(k).exercise),0), exDays: days.filter(k=>n(D(k).exercise)>0).length,
    wFirst: weights.length?n(D(weights[0]).weight):null, wLast: weights.length?n(D(weights[weights.length-1]).weight):null,
    paid: pays.reduce((a,e)=>a+n(e.amount),0), spent: spends.reduce((a,e)=>a+n(e.amount),0),
    saved: S.money.filter(e=>(e.type==='save'||e.type==='withdraw')&&inM(e.date)).reduce((a,e)=>a+(e.type==='save'?1:-1)*n(e.amount),0),
    goals: S.goals.filter(g=>g.horizon==='1m'&&g.period===m), todos: S.todos.filter(t=>t.done&&inM(t.doneDate)).length,
    diary: Object.keys(S.diary||{}).filter(k=>inM(k)&&(S.diary[k]||'').trim()).length, review: S.reviews[m]||null
  };
}
function historyView(){
  if(!histMonth) histMonth=prevMonth(MONTH());
  const m=histMonth, s=monthStats(m), first=[S.settings.started.slice(0,7), ...Object.keys(S.days).map(k=>k.slice(0,7))].sort()[0]||MONTH();
  const line=(l,v)=>`<div class="row"><div class="lbl">${l}</div><b>${v}</b></div>`;
  let html=`<div class="card"><div style="display:flex;align-items:center;gap:8px"><button class="btn sm ghost" data-a="histnav" data-m="${prevMonth(m)}" ${m<=first?'disabled style="opacity:.35"':''} aria-label="Previous month">‹</button>
    <select id="histPick" style="flex:1">${(()=>{ const out=[]; let x=MONTH(); for(let i=0;i<36 && x>=first;i++){ out.push(x); x=prevMonth(x); } return out; })().map(x=>`<option value="${x}" ${x===m?'selected':''}>${monthName(x)}</option>`).join('')}</select>
    <button class="btn sm ghost" data-a="histnav" data-m="${(()=>{ const d=parse(m+'-01'); d.setMonth(d.getMonth()+1); return ymd(d).slice(0,7); })()}" ${m>=MONTH()?'disabled style="opacity:.35"':''} aria-label="Next month">›</button></div></div>`;
  if(secOn('faith')||secOn('ministry')) html+=`<div class="card"><h2>${svg('faith',18)} Faith</h2>${secOn('faith')?line('Bible reading days',s.bible)+line('Chapters read',s.chapters)+line('Personal study',hoursText(s.study/60)):''}${secOn('ministry')?line('Ministry',hoursText(s.hours))+line('Bible studies',s.studies):''}${secOn('faith')?calendar(m):''}</div>`;
  if(secOn('health')) html+=`<div class="card"><h2>${svg('health',18)} Health</h2>${line('Average sleep',s.sleep!=null?s.sleep+' h':'—')}${line('Exercise',s.exDays+' day'+(s.exDays===1?'':'s')+' · '+s.exercise+' min')}${s.wLast!=null?line('Weight',s.wLast+' kg'+(s.wFirst!==s.wLast?' ('+(s.wLast-s.wFirst>0?'+':'')+r1(s.wLast-s.wFirst)+')':'')):''}</div>`;
  if(secOn('money')) html+=`<div class="card"><h2>${svg('money',18)} Money</h2>${line('Paid to myself',money(s.paid))}${line('Spent',money(s.spent))}${line('Saved',money(s.saved))}</div>`;
  html+=`<div class="card"><h2>${svg('goals',18)} Goals and plan</h2>${s.goals.length?s.goals.map(g=>`<div class="row"><div class="lbl">${esc(g.title)}${g.target?`<small>${r1(g.progress||0)} / ${g.target} ${esc(g.unit||'')}</small>`:''}</div><b style="color:${g.done?'var(--ok)':'var(--muted)'}">${g.done?'Done ✓':'Not done'}</b></div>`).join(''):'<div class="empty">No monthly goals were set.</div>'}
    ${line('To-dos completed',s.todos)}${line('Diary entries',s.diary)}${secOn('people')?line('Messages and visits to people I met',s.people):''}</div>`;
  if(s.review && (s.review.well||s.review.improve||s.review.focus)) html+=`<div class="card"><h2>My review of ${monthName(m).split(' ')[0]}</h2>${s.review.well?`<div class="area">What went well</div><div class="vision">${esc(s.review.well)}</div>`:''}${s.review.improve?`<div class="area">What to improve</div><div class="vision">${esc(s.review.improve)}</div>`:''}${s.review.focus?`<div class="area">Focus for next month</div><div class="vision">${esc(s.review.focus)}</div>`:''}</div>`;
  html+=`<button class="btn ghost" data-a="gonotes">See my notes from ${monthName(m).split(' ')[0]} in My notes</button>`;
  return html;
}

V.goals = () => {
  const list = goalH==='hist'?[]:currentGoals(goalH);
  const label = goalH==='1m'?monthName(MONTH()):goalH==='1y'?YEAR():'Your 5-year plan (to '+(n(S.settings.started.slice(0,4))+5)+')';
  let html = `<div class="seg">${[...Object.entries(HORIZONS),['hist','History']].map(([k,l])=>`<button class="${k===goalH?'on':''}" data-a="horizon" data-h="${k}">${l}</button>`).join('')}</div>`;
  if(goalH==='hist') return html+historyView();
  if(goalH==='5y'){
    html += `<div class="card"><h2>My vision<span class="sp"></span><button class="btn sm ghost" data-a="visionsheet">Edit</button></h2>
      ${Object.entries(AREAS).map(([k,a])=>`<div class="area">${a.label}</div><div class="vision">${S.vision[k]?esc(S.vision[k]):'<span class="muted">Where do you want to be in 5 years?</span>'}</div>`).join('')}</div>`;
  }
  const done = list.filter(g=>g.done).length;
  html += `<div class="card"><h2>${esc(label)}<span class="sp"></span><span class="chip">${done}/${list.length} done</span></h2>`;
  if(!list.length) html += `<div class="empty">No goals here yet.</div>`;
  Object.keys(AREAS).forEach(a=>{
    const gs = list.filter(g=>g.area===a);
    if(gs.length) html += `<div class="area">${AREAS[a].label}</div>`+gs.map(goalRow).join('');
  });
  html += `<button class="btn" data-a="goalsheet" data-h="${goalH}" style="margin-top:12px">Add a goal</button></div>`;
  if(goalH==='1m'){
    const rv = S.reviews[MONTH()]||{};
    html += `<div class="card"><h2>Monthly review</h2>
      <div class="f"><label>What went well this month?</label><textarea data-rv="well">${esc(rv.well)}</textarea></div>
      <div class="f"><label>What do I want to improve?</label><textarea data-rv="improve">${esc(rv.improve)}</textarea></div>
      <div class="f"><label>My main focus for next month</label><textarea data-rv="focus">${esc(rv.focus)}</textarea></div>
      <div class="muted">Saves as you type.</div></div>`;
    const prev = Object.keys(S.reviews).filter(m=>m<MONTH()).sort().reverse().slice(0,3);
    if(prev.length) html += `<div class="card"><h2>Past reviews</h2>${prev.map(m=>`<div class="area">${monthName(m)}</div><div class="vision">${['well','improve','focus'].map(k=>S.reviews[m][k]?'• '+esc(S.reviews[m][k]):'').filter(Boolean).join('\n')||'<span class="muted">Empty</span>'}</div>`).join('')}</div>`;
  }
  return html;
};

/* reads "Psalm 83:18", "Ps 83:18", "1 Pet 5:7", "Rev 21:3, 4" and gives the book, chapter and verse */
function parseRef(txt){
  const m=String(txt||'').toLowerCase().replace(/\./g,' ').match(/^\s*((?:[123]\s*)?[a-z]+(?:\s+of\s+[a-z]+)?)\s*(\d{1,3})(?:\s*:\s*(\d{1,3}))?/);
  if(!m) return null;
  const want=m[1].replace(/\s+/g,''); if(want.replace(/^[123]/,'').length<2) return null;
  const names=BOOKS.map((b,i)=>[b[0].toLowerCase().replace(/\s+/g,''),i]);
  const hit = names.find(([nm])=>nm===want) || names.find(([nm])=>nm===want+'s') || names.find(([nm])=>nm.startsWith(want));
  if(!hit) return null;
  const b=hit[1]+1, c=n(m[2]), v=m[3]?n(m[3]):1;
  if(c<1 || c>BOOKS[b-1][1]) return null;
  return {book:b, chapter:c, verse:v, link:jworg(bcode(b,c,v))};
}

function saveStudy(id){
  const x=S.students.find(s=>s.id===id);
  const les=n(val('ssLesson'))||n(x.lesson)||1, from=n(val('ssFrom'))||null, to=n(val('ssTo'))||null, done=document.getElementById('ssDone').checked;
  if(from && to && to<from){ fail('ssTo','"To" should be the same or higher than "From"'); return null; }
  const sess={id:uid(), unit:x.unit||autoUnit(x.pub), date:val('ssDate')||TODAY(), lesson:les, from, to, finished:done, summary:val('ssSum').trim(), ref:val('ssRef').trim(), prep:val('ssPrep').trim(), note:val('ssNote').trim()};

function pickFor(items, b){
  const ok = items.filter(x=>x && x.file && x.file.url);
  let m = ok.filter(x=>n(x.booknum)===b);
  if(!m.length){ const nm=BOOKS[b-1][0].toLowerCase(); m = ok.filter(x=>(x.title||'').toLowerCase().includes(nm)); }
  if(!m.length && new Set(ok.map(x=>x.title)).size===1) m = ok;
  if(!m.length && ok.length>=66) m = ok.filter(x=>n(x.track)===b);
  m.sort((x,y)=>Math.abs((x.frameHeight||360)-480)-Math.abs((y.frameHeight||360)-480));
  return m[0] ? {url:m[0].file.url, title:m[0].title||''} : null;
}
async function loadVideo(){
  const box = document.getElementById('vidBox'); if(!box) return;
  const b = S.bible.book, L = vidLang(), key = L+'_'+b;

/* ask JW.org for the real language codes once a month and correct the list */
let langCheckRunning=false;
async function discoverLangs(force){
  const st=S.settings;
  if(langCheckRunning || !navigator.onLine) return;
  if(!force && st.langsChecked && (Date.now()-st.langsChecked)<30*864e5) return;
  langCheckRunning=true;
  try{
    const j = await getJSON(API('E',1,1));
    const langs = j.languages || {};
    const api = Object.entries(langs).map(([c,o])=>[c, String((o&&(o.name||o.vernacular))||'').toLowerCase()]).filter(a=>a[1]);
    if(api.length<5) throw 0;
    let changed=0;
    st.langs = st.langs.map(([code,name])=>{
      const full=name.toLowerCase(), base=full.split(' (')[0].trim(), variant=(full.match(/\(([^)]+)\)/)||[])[1];
      const hit = api.find(a=>a[1]===full)
        || (variant && api.find(a=>a[1].includes(base) && a[1].includes(variant)))
        || ((!variant || variant==='asante') && api.find(a=>a[1]===base));
      if(hit && hit[0]!==code){ changed++; if(st.bibleLang===code) st.bibleLang=hit[0]; return [hit[0],name]; }
      return [code,name];
    });
    st.langsChecked = Date.now(); st.langsFound = api.length;
    save();
    if(changed){ Object.keys(vidCache).forEach(k=>delete vidCache[k]); toast('Bible language codes corrected from JW.org'); if(tab==='faith') render(); }
  }catch(e){}
  langCheckRunning=false;
}

function calendar(m){
  const first = parse(m+'-01'), days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const offset = (first.getDay()+6)%7;
  let c = ['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<offset;i++) c+='<div></div>';
  for(let i=1;i<=days;i++){
    const s = m+'-'+String(i).padStart(2,'0'), d=S.days[s]||{};
    const min = S.ministry.some(e=>e.date===s && n(e.hours)>0);
    c += `<div class="d ${d.bible?'on':''} ${min?'m':''} ${s===TODAY()?'today':''}">${i}</div>`;
  }
  return `<div class="cal">${c}</div>`;
}

function bars(vals, labels, target, color){
  const W=320,H=120,pad=18, bw=(W-pad)/vals.length;
  const max = Math.max(target||0, ...vals, 1)*1.1;
  let g = '';
  if(target){ const y=H-pad-(target/max)*(H-pad-6); g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#9DB6D6" stroke-dasharray="4 4"/>`; }
  vals.forEach((v,i)=>{
    const h=(v/max)*(H-pad-6), x=pad/2+i*bw+bw*0.18;
    g+=`<rect x="${x}" y="${H-pad-h}" width="${bw*0.64}" height="${Math.max(h,v?2:0)}" rx="3" fill="${color}"/>`;
    if(labels[i]) g+=`<text x="${x+bw*0.32}" y="${H-4}" font-size="10" fill="#5F7A99" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
