  let html=`<div class="card"><h2>Regular pioneers · ${sy} service year<span class="sp"></span><button class="btn sm ghost" data-a="x36pioset">Settings</button></h2>
    <p class="muted" style="margin:0 0 8px;font-size:13px">Goal ${pioGoal()} hours for the year. "On track" means at or above where they should be by ${monthName(m)}.</p>`;
  html+= rows.length ? `<div class="list">${rows.map(r=>`<div class="it" data-a="pubsheet" data-id="${r.p.id}" style="cursor:pointer"><span class="wdot ${r.st}" style="margin-top:6px"></span><div class="x"><b>${esc(r.p.name)}</b><small>${r1(r.h)} h so far · ${r.st==='green'?'on track':r.st==='orange'?'a little behind':'behind'} · ${r1(r.left)} h left${r.monthsLeft?' in '+r.monthsLeft+' month'+(r.monthsLeft===1?'':'s')+' (about '+r1(r.left/r.monthsLeft)+' a month)':''}</small></div></div>`).join('')}</div>
    <p class="muted" style="margin:6px 0 0;font-size:12.5px">Someone a little behind may only need a kind word or a partner. Tap a name to see the card.</p>` : '<div class="empty">No regular pioneers marked yet. Set Type to Regular pioneer on a publisher\'s page.</div>';
  html+=`<div class="area">Auxiliary pioneers · ${monthName(m)} (${auxNeed(m)} hours this month)</div>`;
  html+= aux.length ? `<div class="list">${aux.map(p=>{ const r=rep(m,p.id), h=n(r.hours), ok=h>=auxNeed(m); return `<div class="it"><span class="wdot ${ok?'green':'orange'}" style="margin-top:6px"></span><div class="x"><b>${esc(p.name)}</b><small>${r1(h)} h · ${ok?'reached '+auxNeed(m)+' ✓':'below '+auxNeed(m)+' hours'}</small></div></div>`; }).join('')}</div>` : '<div class="empty">No auxiliary pioneers this month.</div>';
  return html+'</div>';
}
function pioSetSheet(){
  const d=SEC(), sy=curSY(), months=syMonthList(sy);
  openSheet(`<h3>Pioneer settings</h3>
    <div class="f"><label>Regular pioneer goal for the service year (hours)</label><input type="text" inputmode="numeric" id="psGoal" value="${pioGoal()}"></div>
    <div class="area">Auxiliary pioneer: 15-hour months</div><p class="muted" style="margin:0 0 8px;font-size:13px">Ticked months need 15 hours; other months need 30. March, April and the circuit overseer's visit month are ticked to start with.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${months.map(m=>`<label class="row" style="cursor:pointer;padding:6px 8px;border:1px solid var(--line);border-radius:10px"><span class="lbl" style="font-size:13.5px">${monthName(m).split(' ')[0].slice(0,3)} ${m.slice(2,4)}</span><input type="checkbox" class="psAux" value="${m}" ${auxLow(m)?'checked':''} style="width:20px;height:20px"></label>`).join('')}</div>
    ${actions}`, ()=>{ const g=n(val('psGoal')); if(!(g>0)) return fail('psGoal','Enter the number of hours'); d.pioGoal=g; d.aux15=d.aux15||{}; document.querySelectorAll('.psAux').forEach(c=>d.aux15[c.value]=c.checked); return true; });
}

/* ================= v36: shepherding calls due (one year after baptism, or a year since the last visit) ================= */
function lastVisit(p){ return (p.visits||[]).map(v=>v.date).sort().pop()||''; }
function shepDue(){
  const t=TODAY(), yAgo=addDays(t,-365), out=[], none=[];
  activePubs().forEach(p=>{
    const lv=lastVisit(p), plan=p.shepPlan||null;
    if(p.baptized && p.baptized<=yAgo && p.baptized>addDays(t,-730)){ const ann=addDays(p.baptized,365); if(!lv || lv<addDays(ann,-45)){ out.push({p, why:'One year since baptism ('+longDate(ann)+')', plan}); return; } }
    if(lv && lv<=yAgo) out.push({p, why:'Last visit '+longDate(lv), plan});
    else if(!lv) none.push(p);
  });
  return {due:out, none};
}
function shepCard(){
  const {due,none}=shepDue(); if(!due.length && !none.length) return '';
  const all=SEC()._shepAll;
  return `<div class="card"><h2>Shepherding calls due<span class="sp"></span>${due.length?`<span class="chip">${due.length}</span>`:''}</h2>
    ${due.length?`<div class="list">${due.slice(0,all?999:6).map(x=>`<div class="it" style="flex-wrap:wrap"><span class="wdot ${x.plan?'green':'orange'}" style="margin-top:6px"></span><div class="x" data-a="pubsheet" data-id="${x.p.id}" style="cursor:pointer"><b>${esc(x.p.name)}</b><small>${esc(x.why)}${x.plan?' · '+esc(x.plan.elder)+(x.plan.date?' on '+nice(x.plan.date):''):''}</small></div>
      <div class="btns" style="width:100%;margin-top:6px"><button class="btn sm ghost" style="flex:1" data-a="x36shepplan" data-id="${x.p.id}">${x.plan?'Change':'Assign an elder'}</button>${x.plan&&x.plan.phone?`<a class="btn sm wa" style="flex:1" target="_blank" rel="noopener" href="https://wa.me/${phoneIntl(x.plan.phone)}?text=${encodeURIComponent(shepPlanMsg(x))}">Remind</a>`:''}<button class="btn sm" style="flex:1" data-a="x36shepdone" data-id="${x.p.id}">Done ✓</button></div></div>`).join('')}</div>${due.length>6&&!all?`<button class="btn sm ghost" data-a="x36shepall" style="margin-top:8px;width:100%">Show all ${due.length}</button>`:''}`:'<p class="muted" style="margin:0">No calls are due.</p>'}
    ${none.length?`<p class="muted" style="margin:8px 0 0;font-size:12.5px">${none.length} publisher${none.length===1?' has':'s have'} no visit recorded yet. When a visit is made, tap the name and <b>Log a visit</b>, so the app can remind you a year later.</p>`:''}</div>`;
}
function shepPlanMsg(x){ const f=x.p.gender==='f'; return `Good ${timeOfDay()} ${firstName(nameOnly(x.plan.elder))}! A kind reminder about the shepherding call to ${titleOf(x.p)}${x.p.name}${x.plan.date?' on '+dayDate(x.plan.date):''}. ${x.why}. Thank you for caring for ${f?'her':x.p.gender==='m'?'him':'them'} 🙏`; }
function shepPlanSheet(id){
  const p=SEC().pubs.find(x=>x.id===id), pl=p.shepPlan||{};
  openSheet(`<h3>Shepherding call: ${esc(p.name)}</h3>
    <div class="f2"><div class="f"><label>Elder</label><input type="text" id="spElder" value="${esc(pl.elder||'')}" list="spEld"></div><div class="f"><label>His WhatsApp</label><input type="tel" id="spPhone" value="${esc(pl.phone||'')}"></div></div>
    <datalist id="spEld">${SEC().pubs.filter(x=>x.elder).map(x=>`<option>${esc(x.name)}</option>`).join('')}</datalist>
    <div class="f"><label>Planned date (optional)</label><input type="date" id="spDate" value="${pl.date||''}"></div>
    ${actions}`, ()=>{ const e=val('spElder').trim(); if(!e) return fail('spElder','Choose the elder'); p.shepPlan={elder:e, phone:val('spPhone').trim(), date:val('spDate')}; return true; });
  const el=document.getElementById('spElder'); el.addEventListener('change',()=>{ const q=letterWho(el.value), ph=document.getElementById('spPhone'); if(q&&q.phone&&!ph.value) ph.value=q.phone; });
}

/* ================= v36: inactive and reactivation ================= */
function monthsNoShare(p, upto){ let k=0, m=upto; for(let i=0;i<12;i++){ if((p.since||'0000')>m) break; const r=rep(m,p.id); if(r&&r.shared) break; k++; m=prevMonth(m); } return k; }
function inactiveCard(){
  const d=SEC(), m=secMonthDefault();
  const risk=activePubs().filter(p=>monthsNoShare(p,m)>=3).map(p=>({p,k:monthsNoShare(p,m)})).sort((a,b)=>b.k-a.k);
  const inact=d.pubs.filter(p=>p.status==='inactive');
  const back=inact.filter(p=>{ const r=rep(m,p.id); return r&&r.shared; });
  const reac=d.pubs.filter(p=>p.reactivated && p.reactivated>=addDays(TODAY(),-365) && p.status!=='inactive');
  if(!risk.length && !inact.length && !reac.length) return '';
  return `<div class="card"><h2>Inactive and reactivation</h2>
    ${back.length?`<div class="banner" style="margin:0 0 8px"><span style="flex:1"><b>Reporting again:</b> ${back.map(p=>esc(p.name)).join(', ')}</span></div>${back.map(p=>`<button class="btn sm" style="width:100%;margin-bottom:6px" data-a="x36reac" data-id="${p.id}">Mark ${esc(firstName(p.name))} as active again ✓</button>`).join('')}`:''}
    ${risk.length?`<div class="area">May need help (${risk.length})</div><div class="list">${risk.map(x=>`<div class="it" data-a="pubsheet" data-id="${x.p.id}" style="cursor:pointer"><span class="wdot ${x.k>=5?'red':'orange'}" style="margin-top:6px"></span><div class="x"><b>${esc(x.p.name)}</b><small>${esc(x.p.group||'No group')} · no ministry for ${x.k} month${x.k===1?'':'s'}${x.k>=6?' · now counts as inactive':''}${lastVisit(x.p)?' · last visit '+nice(lastVisit(x.p)):''}</small></div></div>`).join('')}</div>`:''}
    ${inact.length?`<div class="area">Inactive (${inact.length})</div><div class="list">${inact.map(p=>`<div class="it"><div class="x" data-a="pubsheet" data-id="${p.id}" style="cursor:pointer"><b>${esc(p.name)}</b><small>${lastVisit(p)?'Last visit '+nice(lastVisit(p)):'No visit recorded'}</small></div><button class="btn sm ghost" data-a="pubvisit" data-id="${p.id}">Log a visit</button></div>`).join('')}</div>`:''}
    ${reac.length?`<div class="area">Reactivated this year 🎉</div><div class="list">${reac.map(p=>`<div class="it"><div class="x"><b>${esc(p.name)}</b><small>Active again since ${nice(p.reactivated)}</small></div></div>`).join('')}</div>`:''}
    <p class="muted" style="margin:8px 0 0;font-size:12.5px">Six months in a row with no ministry counts as inactive. Change a publisher's Status on their page when the elders agree.</p></div>`;
}

/* ================= v36: group summaries for the group overseers ================= */
function groupSigns(g, m){
  const ps=activePubs().filter(p=>(p.group||'')===g), m1=prevMonth(m), yr=addDays(TODAY(),-365);
  const s={n:ps.length, in:0, shared:0, st:0, notIn:[], none:[], twoPlus:[], near6:[], newBap:[]};
  ps.forEach(p=>{ const r=rep(m,p.id);
    if(!r||!r.got){ s.notIn.push(p); } else { s.in++; if(r.shared){ s.shared++; s.st+=n(r.studies); } }
    const k=monthsNoShare(p,m);
    if(k>=4 && k<6) s.near6.push(p); else if(k>=2) s.twoPlus.push(p); else if(r&&r.got&&!r.shared) s.none.push(p);
    if(p.baptized && p.baptized>=yr) s.newBap.push(p);
  });
  return s;
}
function groupSummaryMsg(g, m){
  const d=SEC(), s=groupSigns(g,m), gi=groupInfo(g), nm=firstName(nameOnly(gi.overseer||'')), names=a=>a.map(p=>p.name).join(', ');
  const prev=((d.grpFlags||{})[prevMonth(m)]||{})[g]||[], better=prev.map(id=>d.pubs.find(p=>p.id===id)).filter(p=>p && rep(m,p.id) && rep(m,p.id).shared);
  let t=`Good ${timeOfDay()}${nm?' '+nm:''}! Here is ${g}'s report summary for ${monthName(m)}.\n\n${s.in} of ${s.n} reported. ${s.shared} shared in the ministry, with ${s.st} Bible stud${s.st===1?'y':'ies'}. Thank you for your hard work with the group.`;
  if(better.length) t+=`\n\nGood news: ${names(better)} shared in the ministry this month after we spoke about them last month. Please commend them warmly.`;
  const lines=[];
  if(s.notIn.length) lines.push(`Report not in yet: ${names(s.notIn)}`);
  if(s.none.length) lines.push(`Did not share this month: ${names(s.none)}`);
  if(s.twoPlus.length) lines.push(`No ministry for 2 or more months: ${names(s.twoPlus)}`);
  if(s.near6.length) lines.push(`Close to 6 months with no ministry: ${names(s.near6)}`);
  if(s.newBap.length) lines.push(`Newly baptized (first year): ${names(s.newBap)}`);
  if(lines.length) t+=`\n\nPublishers who may need your loving help:\n${lines.map(l=>'• '+l).join('\n')}\n\nCould you kindly visit them, or invite them to work along with you in the ministry? A warm word can mean a lot.`;
  else t+=`\n\nEveryone in the group reported and shared. Please thank them for their good work.`;
  return t+'\n\nWith Christian love 🙏';
}
function groupSumSheet(){
  const d=SEC(), m=secMonth||secMonthDefault(), groups=groupsList(), sent=((d.grpSent||{})[m])||{};
  openSheet(`<h3>Group summaries · ${monthName(m)}</h3>
    <p class="muted" style="margin:0 0 10px">Each group overseer gets only his own group's summary, with names of those who may need help. Send it after the month's reports are in.</p>
    <div class="list">${groups.map(g=>{ const gi=groupInfo(g), op=letterWho(gi.overseer||''), ph=(op&&op.phone)||'', s=groupSigns(g,m), need=s.notIn.length+s.none.length+s.twoPlus.length+s.near6.length+s.newBap.length;
      return `<div class="it" style="flex-wrap:wrap"><div class="x"><b>${esc(g)}</b><small>${esc(gi.overseer||'No overseer set')} · ${s.in}/${s.n} reported · ${need} to help${sent[g]?' · sent '+nice(sent[g])+' ✓':''}</small></div>
        <div class="btns" style="width:100%;margin-top:6px"><a class="btn sm wa" style="flex:1" target="_blank" rel="noopener" data-a="x36gsent" data-k="${esc(g)}" href="https://wa.me/${phoneIntl(ph)}?text=${encodeURIComponent(groupSummaryMsg(g,m))}">${sent[g]?'Send again':'Send to '+esc(firstName(nameOnly(gi.overseer||'overseer')))}</a><button class="btn sm ghost" style="flex:1" data-a="x36gview" data-k="${esc(g)}">See message</button></div></div>`; }).join('')}</div>
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">Set each group's overseer under Publishers → Field service groups so the message goes straight to him.</p>
    <button class="btn ghost" data-a="close" style="margin-top:10px">Close</button>`, null);
}

/* ================= v36: end of service year checklist ================= */
const SYC_ITEMS=[['s21','Print or save last year\'s S-21 cards for everyone','printsheet','s21'],['s88','Print or save last year\'s S-88 attendance record','printsheet','s88'],['pio','Check each regular pioneer\'s hours for the year','sectab','reports'],['inact','Review the inactive list and plan visits','sectab','pubs'],['groups','Check field service groups for the new year','sectab','pubs'],['moved','Mark anyone who moved away, and send their cards','sectab','pubs'],['branch','Check letters from the branch about the new service year','sectab','letters'],['backup','Make a backup after everything is done','backup','']];
function sycShow(){ const t=TODAY(), mm=t.slice(5,7), dd=n(t.slice(8)); return mm==='09'||(mm==='08'&&dd>=20)||(mm==='10'&&dd<=31); }
function sycCard(force){
  if(!force && !sycShow()) return '';
  const d=SEC(), sy=n(TODAY().slice(5,7))>=9?curSY()-1:curSY(), done=((d.syc||{})[sy])||{}, nd=SYC_ITEMS.filter(([k])=>done[k]).length;
  if(!force && nd===SYC_ITEMS.length) return '';
  return `<div class="card"><h2>End of the ${sy} service year<span class="sp"></span><span class="chip">${nd}/${SYC_ITEMS.length}</span></h2>
    <div class="list">${SYC_ITEMS.map(([k,l,a,ak])=>`<div class="it"><input type="checkbox" data-a="x36syc" data-k="${k}" data-y="${sy}" ${done[k]?'checked':''} style="width:22px;height:22px;margin-top:2px"><div class="x"><b style="${done[k]?'text-decoration:line-through;opacity:.6':''}">${esc(l)}</b></div><button class="btn sm ghost" data-a="${a}" ${ak?`data-k="${ak}"`:''}>Open</button></div>`).join('')}</div>
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">Shows from late August to October. Also on Duties &amp; tasks all year.</p></div>`;
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-a]'); if(!t || !/^x36/.test(t.dataset.a)) return;
  const a=t.dataset.a, id=t.dataset.id, d=SEC();
  if(a==='x36pioset') pioSetSheet();
  if(a==='x36shepplan') shepPlanSheet(id);
  if(a==='x36shepall'){ d._shepAll=1; render(); }
  if(a==='x36shepdone'){ const p=d.pubs.find(x=>x.id===id); if(!p) return; p.visits=p.visits||[]; p.visits.push({id:uid(), date:TODAY(), by:(p.shepPlan&&p.shepPlan.elder)||'', note:'Shepherding call'}); delete p.shepPlan; save(); render(); toast('Visit saved. Next reminder in a year'); }
  if(a==='x36reac'){ const p=d.pubs.find(x=>x.id===id); if(!p) return; p.status='active'; p.reactivated=TODAY(); save(); render(); toast(firstName(p.name)+' is active again 🎉'); }
  if(a==='x36gview'){ const g=t.dataset.k, m=secMonth||secMonthDefault(); openSheet(`<h3>${esc(g)}</h3><div style="white-space:pre-wrap;font-size:14.5px">${esc(groupSummaryMsg(g,m))}</div><div class="btns" style="margin-top:12px"><button class="btn ghost" style="flex:1" data-a="x36gback">Back</button></div>`, null); }
  if(a==='x36gback') groupSumSheet();
  if(a==='x36gsent'){ const g=t.dataset.k, m=secMonth||secMonthDefault(); d.grpSent=d.grpSent||{}; (d.grpSent[m]=d.grpSent[m]||{})[g]=TODAY();
    const s=groupSigns(g,m); d.grpFlags=d.grpFlags||{}; (d.grpFlags[m]=d.grpFlags[m]||{})[g]=[...s.none,...s.twoPlus,...s.near6].map(p=>p.id); save(); setTimeout(groupSumSheet,500); }
  if(a==='x36syc'){ const y=t.dataset.y; d.syc=d.syc||{}; (d.syc[y]=d.syc[y]||{})[t.dataset.k]=t.checked; save(); setTimeout(render,50); }
  if(a==='x36gsum') groupSumSheet();
});
</script>
