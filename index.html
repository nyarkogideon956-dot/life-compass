      ${cats.length?cats.map(c=>`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:14.5px"><span>${esc(c)}</span><span class="amt">${money(byCat[c])} <small class="muted">${pct(byCat[c],mTotal)}%</small></span></div>${barPlain(Math.round(byCat[c]/maxC*100),'#B26A00')}</div>`).join(''):'<div class="empty">No expenses this month.</div>'}</div>`;
    html += `<div class="card"><h2>Day by day</h2>${Object.keys(byDay).sort().reverse().map(d=>`<div class="area" style="display:flex;justify-content:space-between"><span>${nice(d)}</span><span>${money(sum(byDay[d]))}</span></div><div class="list">${byDay[d].map(moneyEntryRow).join('')}</div>`).join('')||'<div class="empty">No expenses this month.</div>'}</div>`;
  }
  if(moneyTab==='savings'){
    html += `<div class="card"><div class="stat" style="grid-template-columns:1fr 1fr"><div><small>Total savings</small><b>${money(savedIn())}</b></div><div><small>Saved this month</small><b>${money(savedBetween(MONTH()+'-01',t))}</b></div></div>
      <div class="btns" style="margin-top:10px"><button class="btn" style="flex:1" data-a="savesheet">Add to savings</button><button class="btn ghost" style="flex:1" data-a="savegoalsheet">New savings goal</button></div></div>`;
    html += `<div class="card"><h2>Savings goals</h2>${S.savings.length?S.savings.map(g=>{
        const have=savedIn(g.id), p=pct(have,g.target);
        let pace='';
        if(g.deadline && have<g.target){ const months=Math.max(1,(parse(g.deadline).getFullYear()-parse(t).getFullYear())*12+parse(g.deadline).getMonth()-parse(t).getMonth()); pace=`Save about ${money((g.target-have)/months)} a month to reach it by ${parse(g.deadline).toLocaleDateString(undefined,{month:'short',year:'numeric'})}.`; }
        if(!g.target) return `<div class="goal"><div class="t"><span data-a="savegoalsheet" data-id="${g.id}"><b>${esc(g.name)}</b><br><small class="muted">${money(have)} saved · tap to set a target</small></span></div>
          <div class="btns" style="margin-top:8px"><button class="btn sm ghost" data-a="savesheet" data-goal="${g.id}">+ Add</button><button class="btn sm ghost" data-a="withdrawsheet" data-goal="${g.id}">Take out</button></div></div>`;
        return `<div class="goal"><div class="t"><span data-a="savegoalsheet" data-id="${g.id}"><b>${esc(g.name)}</b><br><small class="muted">${money(have)} of ${money(g.target)} · ${p}%</small></span></div>${bar(p)}
          ${pace?`<p class="muted" style="margin:6px 0 0">${pace}</p>`:have>=g.target?'<p class="muted" style="margin:6px 0 0">Goal reached. Well done!</p>':''}
          <div class="btns" style="margin-top:8px"><button class="btn sm ghost" data-a="savesheet" data-goal="${g.id}">+ Add</button><button class="btn sm ghost" data-a="withdrawsheet" data-goal="${g.id}">Take out</button></div></div>`;}).join(''):'<div class="empty">Create a goal like "Emergency fund", "New phone" or "Convention trip".</div>'}</div>`;
    const hist=S.money.filter(e=>e.type==='save'||e.type==='withdraw').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
    html += `<div class="card"><h2>Savings history</h2><div class="list">${hist.length?hist.map(moneyEntryRow).join(''):'<div class="empty">No savings recorded yet.</div>'}</div></div>`;
  }
  return html;
};

function startFresh(withBackup){
  const keep = document.getElementById('keepSet').checked;
  if(withBackup) backup();
  const old = S.settings, f = fresh();
  if(keep){ f.settings = {...old, started:TODAY()}; }
  S = f; save(); photoClear(); closeSheet(); tab='today'; render(); window.scrollTo(0,0);

}

/* ---------- backup ---------- */
async function backup(){
  S.settings.lastBackup = Date.now(); save();
  let photos={}; try{ photos=await photoAll(); delete photos['lib:pdf-lib']; }catch(e){}
  const out = JSON.stringify(Object.keys(photos).length ? {...S, __photos:photos} : S, null, 1);
  if(NATIVE){
    const F=window.Capacitor.Plugins.Filesystem, Sh=window.Capacitor.Plugins.Share, name='life-compass-backup-'+TODAY()+'.json';
    try{
      const r=await F.writeFile({path:name, data:out, directory:'CACHE', encoding:'utf8'});
      await Sh.share({title:'Life Compass backup', text:'My Life Compass backup '+TODAY(), files:[r.uri], dialogTitle:'Keep your backup safe'});
      toast('Choose Google Drive or WhatsApp to keep it');
    }catch(e){ if(!/cancel/i.test(String(e&&e.message||e))) alert('The backup could not be shared: '+(e&&e.message||e)); }
    render(); return;
  }
  const blob = new Blob([out],{type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='life-compass-backup-'+TODAY()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  toast('Backup downloaded'); render();
}
function restore(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !d.settings || !d.days) throw 0;
      if(!confirm('Replace everything on this phone with this backup?')) return;
      const ph=d.__photos||{}; delete d.__photos;
      localStorage.setItem(KEY, JSON.stringify(d)); S = load();
      Promise.all(Object.entries(ph).map(([k,v])=>photoPut(k,v).catch(()=>{}))).then(()=>{ closeSheet(); render(); toast('Backup restored'+(Object.keys(ph).length?' with '+Object.keys(ph).length+' pictures':'')); });
    }catch(e){ alert('That file is not a Life Compass backup.'); }
  };
  r.readAsText(file);
}

/* ---------- Android app: real alarms through Android itself ---------- */
var NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
var nativeReady = false, nativeTimer = null;
function LN(){ return NATIVE && window.Capacitor.Plugins ? window.Capacitor.Plugins.LocalNotifications : null; }
function hashId(str){ let h=7; for(let i=0;i<str.length;i++) h=(h*31 + str.charCodeAt(i))|0; return (Math.abs(h) % 2000000000) + 1; }
function scheduleNativeSoon(){ if(!NATIVE || !nativeReady) return; clearTimeout(nativeTimer); nativeTimer=setTimeout(scheduleNative, 1200); }
async function nativeInit(){
  const L=LN(); if(!L) return;
  try{
    let p=await L.checkPermissions(); if(p.display!=='granted') p=await L.requestPermissions();
    for(const k of SOUND_KEYS){ await L.createChannel({id:'lc_'+k, name:'Alarm: '+SOUNDS[k].name, description:'Life Compass alarms', importance:5, visibility:1, sound:k+'.wav', vibration:true, lights:true, lightColor:'#1565C0'}); }
    await L.registerActionTypes({types:[{id:'LC_ALARM', actions:[{id:'done', title:'Mark as done'},{id:'snooze', title:'Snooze 10 min'}]}]});
    await L.addListener('localNotificationActionPerformed', a=>handleNativeAction(a));
    nativeReady=true; await scheduleNative();
  }catch(e){ console.log('Alarm setup:', e); }
}
function nativeNote(it, d, at){
  const snd = SOUNDS[it.sound] ? it.sound : (AL().sound||'marimba');
  return {id:hashId(it.key+'|'+d), title:it.title, body:'Life Compass · '+fmtTime(it.time), schedule:{at, allowWhileIdle:true}, channelId:'lc_'+snd, actionTypeId:'LC_ALARM', smallIcon:'ic_stat_lc', iconColor:'#0C3C78', autoCancel:true,
    extra:{key:it.key, date:d, kind:it.kind||'', id:it.id||'', slot:it.slot||'', time:it.time}};
}
async function scheduleNative(){
  const L=LN(); if(!L || !nativeReady) return;
  try{
    const pend=await L.getPending();
    if(pend.notifications && pend.notifications.length) await L.cancel({notifications:pend.notifications.map(x=>({id:x.id}))});
    const list=[], now=Date.now();
    for(let i=0; i<8 && list.length<180; i++){
      const d=addDays(TODAY(), i), fm=(S.fired||{})[d]||{};
      for(const it of dueOn(d)){
        if(fm[it.key]==='rang' || fm[it.key]==='seen') continue;
        const [h,m]=it.time.split(':').map(Number), at=parse(d); at.setHours(h,m,0,0);
        if(at.getTime() > now+3000) list.push(nativeNote(it, d, at));
      }
    }
    (S.snooze||[]).forEach(z=>{ if(z.at>now) list.push(nativeNote({...z.item, key:z.key}, TODAY(), new Date(z.at))); });
    if(list.length) await L.schedule({notifications:list});
  }catch(e){ console.log('Alarm schedule:', e); }
}
function handleNativeAction(a){
  const nt=a.notification||{}, ex=nt.extra||{}, d=ex.date||TODAY();
  firedMap(d)[ex.key]='rang';
  if(a.actionId==='done'){
    if(ex.kind==='med'){ const m=S.medTaken[d]||(S.medTaken[d]={}); m[ex.id+':'+ex.slot]=true; toast('Marked as taken'); }
    else if(ex.kind==='todo'){ const x=S.todos.find(t=>t.id===ex.id); if(x){ x.done=true; x.doneDate=TODAY(); } toast('Done ✓'); }
    else if(String(ex.key).startsWith('rem:')){ const r=S.reminders.find(z=>z.id===ex.id); if(r) setRoutineDone(d, r, true); toast('Done ✓'); }
  } else if(a.actionId==='snooze'){
    S.snooze.push({key:String(ex.key).split(':s')[0]+':s'+Date.now(), at:Date.now()+10*60000, item:{title:nt.title, time:ex.time||'00:00', kind:ex.kind, id:ex.id, slot:ex.slot}});
    toast('Snoozed for 10 minutes');
  } else if(ex.kind==='diary'){ tab='today'; setTimeout(()=>{ const b=document.getElementById('diaryBox'); if(b){ b.scrollIntoView({block:'center'}); b.focus(); } }, 300); }
  else if(ex.kind==='study'){ tab='faith'; faithTab='study'; }
  else if(ex.kind==='duty'){ tab='sec'; secTab='duties'; }
  else if(ex.kind==='followup'){ tab='others'; peopleTab='met'; peopleFilter='due'; }
  save(); render();
}
async function nativeTest(){
  const L=LN(); if(!L) return;
  const at=new Date(Date.now()+60000), snd=AL().sound||'marimba';
  await L.schedule({notifications:[{id:999001, title:'Test alarm', body:'Life Compass · lock your phone now to check it rings', schedule:{at, allowWhileIdle:true}, channelId:'lc_'+snd, smallIcon:'ic_stat_lc', iconColor:'#0C3C78'}]});
  toast('Test alarm in 1 minute — lock your phone now');
}
async function nativePerm(){
  const L=LN(); if(!L) return;
  try{
    const p=await L.checkPermissions();
    if(p.display!=='granted'){ const q=await L.requestPermissions(); if(q.display!=='granted'){ alert('Notifications are off for Life Compass. Turn them on in phone Settings → Apps → Life Compass → Notifications.'); return; } }
    if(L.checkExactNotificationSetting){ const ex=await L.checkExactNotificationSetting(); if(ex.exact_alarm!=='granted'){ toast('Turn on "Alarms and reminders" for Life Compass'); await L.changeExactNotificationSetting(); return; } }
    toast('All set: alarms are allowed ✓');

}

/* ================= MY NOTES: everything you wrote, in one place, with pictures ================= */
/* pictures live in the phone's IndexedDB (more room than normal storage); text notes stay with the rest of your data */
const PHOTO_DB = () => 'lc-photos-' + KEY;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(PHOTO_DB(),1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function photoPut(id, data){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(data,id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function photoGet(id){ if(photoCache[id]) return photoCache[id]; const db=await idb(); return new Promise(res=>{ const r=db.transaction('p').objectStore('p').get(id); r.onsuccess=()=>{ if(r.result) photoCache[id]=r.result; res(r.result||null); }; r.onerror=()=>res(null); }); }
async function photoDel(id){ delete photoCache[id]; try{ const db=await idb(); db.transaction('p','readwrite').objectStore('p').delete(id); }catch(e){} }
async function photoAll(){ const db=await idb(); return new Promise(res=>{ const out={}, r=db.transaction('p').objectStore('p').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>res(out); }); }
async function photoClear(){ try{ const db=await idb(); db.transaction('p','readwrite').objectStore('p').clear(); }catch(e){} for(const k in photoCache) delete photoCache[k]; }
const photoCache = {};
let sheetPhotos = [];   // pictures in the note being edited
let sheetAdded = [];    // pictures added in this edit but not saved yet
function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const max=1280, sc=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('That file is not a picture')); };
    img.src=url;
  });
}
async function addPhotoFiles(files, target){
  const ids=[];
  for(const f of files){ try{ const data=await shrinkPhoto(f); const id='ph'+uid(); await photoPut(id,data); photoCache[id]=data; ids.push(id); }catch(e){ toast(e.message||'Could not add that picture'); } }
  if(!ids.length) return;
  if(target==='study' && SA()){ SA().photos=[...(SA().photos||[]), ...ids]; save(); render(); }
  else { sheetPhotos.push(...ids); sheetAdded.push(...ids); const box=document.getElementById('sheetPhotos'); if(box) box.outerHTML=photoStrip(sheetPhotos,'sheet'); hydratePhotos(); }
  toast(ids.length>1? ids.length+' pictures added' : 'Picture added');
}
function photoStrip(ids, target){
  return `<div class="pstrip" ${target==='sheet'?'id="sheetPhotos"':''}>${ids.map(id=>`<div class="pthumb"><img data-photo="${id}" alt="Picture" data-a="viewphoto" data-id="${id}"><button type="button" class="pdel" data-a="delphoto" data-id="${id}" data-target="${target}" aria-label="Remove picture">×</button></div>`).join('')}
    <label class="padd">${svg('plus',20)}<span>Add picture</span><input type="file" accept="image/*" multiple hidden data-addphoto="${target}"></label></div>`;
}
function photoRow(ids){ return ids&&ids.length?`<div class="pstrip view">${ids.map(id=>`<div class="pthumb"><img data-photo="${id}" alt="Picture" data-a="viewphoto" data-id="${id}"></div>`).join('')}</div>`:''; }
async function hydratePhotos(){ for(const img of document.querySelectorAll('img[data-photo]:not([src])')){ const d=await photoGet(img.dataset.photo); if(d) img.src=d; else img.closest('.pthumb')?.classList.add('missing'); } }
async function viewPhoto(id){
  const d=await photoGet(id); if(!d) return;
  const el=document.getElementById('photoView'); el.innerHTML=`<img src="${d}" alt="Picture"><button class="btn" data-a="closephoto">Close</button>`; el.hidden=false;
}

  S.students.forEach(x=>(x.sessions||[]).filter(s=>s.summary||s.ref||s.note).forEach(s=>out.push({kind:'lesson', label:'Bible study', date:s.date, ts:0, title:x.name+(sessionLine(s)?' · '+sessionLine(s):''), text:[s.summary, s.ref&&('Scripture: '+s.ref), s.prep&&('Before next time: '+s.prep), s.note&&('Private note: '+s.note)].filter(Boolean).join('\n')})));
  S.study.journal.forEach(j=>out.push({kind:'study', label:'Personal study', id:j.id, date:j.date, ts:j.ts||0, title:j.title, text:[j.learned, j.apply&&('Apply: '+j.apply), j.verse&&('Verse: '+j.verse), j.questions&&('To research: '+j.questions)].filter(Boolean).join('\n'), photos:j.photos||[]}));
  Object.entries(S.answers||{}).filter(([,v])=>(v||'').trim()).forEach(([d,v])=>{ const q=VERSES[dayNum(d)%VERSES.length]; out.push({kind:'question', label:'Question of the day', date:d, ts:0, title:q[3], text:v, ref:q[0]}); });
  Object.entries(S.diary||{}).filter(([,v])=>(v||'').trim()).forEach(([d,v])=>out.push({kind:'diary', label:'Diary', date:d, ts:0, title:'My day', text:v}));
  return out.sort((a,b)=>b.date.localeCompare(a.date)||(b.ts-a.ts));
}
let notesFilter='all', notesQuery='', notesSearchT=null;
const NOTE_KINDS=[['all','All'],['note','My notes'],['bible','Bible'],['lesson','Bible studies'],['study','Study'],['question','Questions'],['diary','Diary']];
V.notes = () => {
  const all=allNotes(), q=notesQuery.trim().toLowerCase();
  const list=all.filter(x=>(notesFilter==='all'||x.kind===notesFilter) && (!q || (x.title+' '+x.text+' '+(x.ref||'')).toLowerCase().includes(q)));
  const count=k=>k==='all'?all.length:all.filter(x=>x.kind===k).length;
  let html=`<div class="card"><button class="btn" data-a="notesheet">${svg('plus',18)}&nbsp; New note</button>
    <input type="search" id="notesSearch" value="${esc(notesQuery)}" placeholder="Search everything you wrote…" style="margin-top:10px">
    <div class="nfilter">${NOTE_KINDS.map(([k,l])=>`<button class="${k===notesFilter?'on':''}" data-a="nfilter" data-k="${k}">${l} <span>${count(k)}</span></button>`).join('')}</div></div>`;
  if(!list.length) return html+`<div class="card"><div class="empty">${all.length?'Nothing matches your search.':'Notes you write anywhere in the app appear here: Bible reading notes, study notes, answers to the question of the day and your diary. Tap New note to write one with pictures.'}</div></div>`;
  let last='';
  list.slice(0,150).forEach(x=>{
    if(x.date!==last){ html+=`<div class="area" style="margin:16px 4px 6px">${parse(x.date).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>`; last=x.date; }
    const open = x.kind==='note'?`data-a="notesheet" data-id="${x.id}"`: x.kind==='study'?`data-a="jopen" data-id="${x.id}"`:'';
    html+=`<div class="card note ${x.kind}" ${open} style="${open?'cursor:pointer':''}"><div class="nk">${x.label}${x.ref?' · '+esc(x.ref):''}</div>
      ${x.title?`<div class="nt">${esc(x.title)}</div>`:''}<div class="nx">${esc(x.text)}</div>${photoRow(x.photos)}
      ${x.kind==='bible'?`<a class="btn sm ghost" href="${jwlib(bcode(x.book,x.chapter))}" style="margin-top:8px">Open in JW Library</a>`:''}</div>`;
  });
  if(list.length>150) html+=`<p class="muted" style="text-align:center">Showing the newest 150. Search to find older notes.</p>`;
  return html;
};
function noteSheet(id){
  const x = id ? S.notes.find(n=>n.id===id) : {title:'', text:'', date:TODAY(), photos:[]};
  sheetPhotos = (x.photos||[]).slice();
  openSheet(`<h3>${id?'Edit note':'New note'}</h3>
    <div class="f"><label>Title</label><input type="text" id="nTitle" value="${esc(x.title)}" placeholder="What I learned at the meeting"></div>
    <div class="f"><label>Note</label><textarea id="nText" style="min-height:150px" placeholder="Write anything you want to keep…">${esc(x.text)}</textarea></div>
    <div class="f"><label>Pictures</label>${photoStrip(sheetPhotos,'sheet')}</div>
    <div class="f"><label>Date</label><input type="date" id="nDate" value="${x.date}"></div>
    ${actions}${id?`<button class="btn danger" data-a="delnote" data-id="${id}" style="margin-top:8px">Delete note</button>`:''}`, ()=>{
      const tx=val('nText').trim(), ti=val('nTitle').trim();
      if(!tx && !ti && !sheetPhotos.length) return fail('nText','Write something or add a picture');
      const rec = id ? x : {id:uid(), ts:Date.now()};
      (x.photos||[]).filter(p=>!sheetPhotos.includes(p)).forEach(photoDel);
      Object.assign(rec,{title:ti, text:tx, date:val('nDate')||TODAY(), photos:sheetPhotos.slice()});
      if(!id) S.notes.push(rec); sheetAdded=[]; return true;
    });
  sheetAdded=[];
  hydratePhotos();
}
document.addEventListener('change', e=>{ const t=e.target; if(t.dataset.addphoto && t.files && t.files.length){ addPhotoFiles([...t.files], t.dataset.addphoto); t.value=''; } });

/* ---------- updates ---------- */
const APK_URL = 'https://github.com/nyarkogideon956-dot/life-compass/releases/latest/download/life-compass.apk';
const WEB_URL = 'https://nyarkogideon956-dot.github.io/life-compass/';
async function forceUpdate(){
  if(!navigator.onLine){ toast('Connect to the internet, then try again'); return; }
  if(NATIVE){ toast('Downloading the newest app… open it when it finishes to install'); location.href = APK_URL; return; }
  toast('Getting the newest version…');
  try{ save(); }catch(e){}
  try{ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }catch(e){}
  try{ const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
}
async function checkNewVersion(){
  if(!navigator.onLine) return;
  try{
    const r = await fetch((NATIVE?WEB_URL:'') + 'version.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const j = await r.json();
    if(n(j.version) > APP_VERSION && !document.getElementById('updBanner')){
      document.getElementById('main').insertAdjacentHTML('afterbegin', `<div class="banner" id="updBanner" style="background:#E3F4EB;border-color:#B9E2CB;color:#1E5E3E"><span style="flex:1"><b>A new version is ready.</b> ${esc(j.note||'')}</span><button class="btn sm" data-a="forceupdate">Update now</button></div>`);
    }
  }catch(e){}
}
setTimeout(checkNewVersion, 2500);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkNewVersion(); });

/* ---------- show problems instead of failing silently ---------- */
function showProblem(msg){
  if(document.getElementById('errBanner')) return;
  const m=document.getElementById('main'); if(!m) return;
  m.insertAdjacentHTML('afterbegin', `<div class="banner" id="errBanner" style="background:#FBEAEA;border-color:#F2C4C4;color:#7A1F1F"><span style="flex:1"><b>Something went wrong.</b> Your entries are safe. Tell Claude this message: <code style="font-size:12px">${esc(String(msg).slice(0,160))}</code></span><button class="btn sm" data-a="reloadapp">Reload</button></div>`);
}
window.addEventListener('error', e=>{ if(e && e.message && !/ResizeObserver|Script error/i.test(e.message)) showProblem(e.message + (e.lineno?' (line '+e.lineno+')':'')); });
window.addEventListener('unhandledrejection', e=>{ const r=e && e.reason; if(r && r.name!=='AbortError' && !/fetch|network/i.test(String(r.message||r))) showProblem(r.message||r); });

/* ---------- lock screen ---------- */
function needsLock(){ if(P.list.length<2 && !curProfile().pin) return false; try{ return sessionStorage.getItem('lc.unlocked')!==P.current; }catch(e){ return true; } }
function showLock(sel){
  const pick = sel || P.current;
  const el=document.getElementById('lock'); el.hidden=false;
  const prof=P.list.find(x=>x.id===pick)||P.list[0];
  el.innerHTML=`<div class="lockbox"><img src="icon.svg" alt="" width="64" height="64"><h2>Life Compass</h2>
    ${P.list.length>1?`<p class="muted" style="margin:0 0 8px">Who is using the app?</p><div class="people">${P.list.map(x=>`<button class="${x.id===prof.id?'on':''}" data-lock-pick="${x.id}">${esc(x.name||'Me')}</button>`).join('')}</div>`:''}
    ${prof.pin?`<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" id="lockPin" placeholder="Enter passcode" autocomplete="off"><div class="err" id="lockErr" hidden>Wrong passcode. Try again.</div>`:''}
    <button class="btn" id="lockGo" data-lock-go="${prof.id}">${prof.pin?'Unlock':'Open'}</button></div>`;
  const inp=document.getElementById('lockPin'); if(inp){ setTimeout(()=>inp.focus(),80); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lockGo').click(); }); }
}
async function tryUnlock(id){
  const prof=P.list.find(x=>x.id===id);
  if(prof.pin){ const v=(document.getElementById('lockPin')||{}).value||''; if(await hashPin(v)!==prof.pin){ document.getElementById('lockErr').hidden=false; document.getElementById('lockPin').value=''; return; } }
  P.current=id; saveProfiles(); KEY=keyFor(id); S=load();
  if(!S.settings.name && prof.name) { S.settings.name=prof.name; save(); }
  try{ sessionStorage.setItem('lc.unlocked',id); }catch(e){}
  document.getElementById('lock').hidden=true; tab='today'; closeSheet(); render(); window.scrollTo(0,0);
}
function lockNow(){ try{ sessionStorage.removeItem('lc.unlocked'); }catch(e){} closeSheet(); showLock(); }
document.addEventListener('click', e=>{
  const pk=e.target.closest('[data-lock-pick]'); if(pk){ showLock(pk.dataset.lockPick); return; }
  const go=e.target.closest('[data-lock-go]'); if(go){ tryUnlock(go.dataset.lockGo); }
});
function pinSheet(){
  const prof=curProfile();
  openSheet(`<h3>${prof.pin?'Change passcode':'Set a passcode'}</h3>
    <p class="muted" style="margin:0 0 10px">The app will ask for this passcode each time it is opened. Use 4 to 8 numbers.</p>
    <div class="f"><label>New passcode</label><input type="password" inputmode="numeric" maxlength="8" id="pin1" autocomplete="off"></div>
    <div class="f"><label>Type it again</label><input type="password" inputmode="numeric" maxlength="8" id="pin2" autocomplete="off"></div>
    ${actions}${prof.pin?`<button class="btn danger" data-a="removepin" style="margin-top:8px">Remove passcode</button>`:''}`, ()=>{
      const a=val('pin1'), b=val('pin2');
      if(!/^\d{4,8}$/.test(a)) return fail('pin1','Use 4 to 8 numbers');
      if(a!==b) return fail('pin2','The two passcodes are different');
      hashPin(a).then(h=>{ prof.pin=h; saveProfiles(); try{ sessionStorage.setItem('lc.unlocked',prof.id); }catch(e){} toast('Passcode set'); });
      return true;
    });
}
function personSheet(){
  openSheet(`<h3>Add a person</h3>
    <p class="muted" style="margin:0 0 10px">They get their own empty Life Compass on this phone. They can't see your entries, and you can't see theirs.</p>
    <div class="f"><label>Their name</label><input type="text" id="psName" placeholder="Esther"></div>
    <div class="f"><label>Their passcode (4–8 numbers, they can change it later)</label><input type="password" inputmode="numeric" maxlength="8" id="psPin" autocomplete="off"></div>
    ${actions}`, ()=>{
      const nm=val('psName').trim(); if(!nm) return fail('psName','Enter their name');
      const pin=val('psPin'); if(pin && !/^\d{4,8}$/.test(pin)) return fail('psPin','Use 4 to 8 numbers, or leave it empty');
      const me=curProfile(); if(!me.name) me.name=S.settings.name||'Me';
      const id=uid(); P.list.push({id, name:nm, pin:null}); saveProfiles();
      if(pin) hashPin(pin).then(h=>{ P.list.find(x=>x.id===id).pin=h; saveProfiles(); });
      toast(nm+' added. Switch person to use their space.');
      return true;
    });
}

if(needsLock()) showLock(); else render();
try{ const sc=new URLSearchParams(location.search).get('setup'); if(sc){ history.replaceState(null,'',location.pathname); setTimeout(()=>setupCodeSheet(sc), 400); } }catch(e){}
setTimeout(checkAlarms, 1500);
if(!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(NATIVE) setTimeout(nativeInit, 300);
