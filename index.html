/* one dated log of every letter, in and out */
let logFilter='all';
function letterLogCard(){
  const d=SEC(), rows=[...d.letters.map(l=>({k:'out', date:l.date, title:(LETTERS.find(x=>x[0]===l.type)||['','Letter'])[1], sub:[l.name, l.cong&&'to '+l.cong, l.how&&({hub:'JW Hub',whatsapp:'WhatsApp',email:'email',pdf:'PDF',copy:'copied'}[l.how]||l.how)].filter(Boolean).join(' · ')})),
    ...d.branch.map(x=>({k:'in', date:x.received||x.created||'', title:x.subject, sub:'from '+fromOf(x)+(x.ref?' · '+x.ref:''), id:x.id}))].filter(r=>logFilter==='all'||r.k===logFilter).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!d.letters.length && !d.branch.length) return '';
  return `<div class="card"><h2>Letter log</h2><div class="chips2">${[['all','All'],['in','Received'],['out','Sent']].map(([k,l])=>`<button class="${k===logFilter?'on':''}" data-a="x32log" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="list">${rows.slice(0,40).map(r=>`<div class="it" ${r.id?`data-a="x31branch" data-id="${r.id}" style="cursor:pointer"`:''}><div style="min-width:54px;font-weight:700;font-size:13px;color:${r.k==='in'?'var(--navy)':'var(--ok)'}">${r.k==='in'?'IN':'OUT'}<br><span class="muted" style="font-weight:400">${r.date?nice(r.date).replace(/^\w+, /,''):''}</span></div><div class="x"><b>${esc(r.title)}</b><small>${esc(r.sub||'')}</small></div></div>`).join('')}</div>
    ${rows.length>40?`<p class="muted" style="font-size:12.5px;margin:6px 0 0">Showing the newest 40 of ${rows.length}.</p>`:''}</div>`;
}

/* ================= MEETING MINUTES with action points ================= */
const MN_KINDS=['Elders\' meeting','Operating committee meeting','Service committee meeting','Meeting with ministerial servants','Other meeting'];
let MN=null;
function minutesCard(){
  const d=SEC(), list=[...d.minutes].sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="card"><h2>Meeting minutes<span class="sp"></span><button class="btn sm ghost" data-a="x31min">${svg('plus',15)} New</button></h2>
    ${list.length?`<div class="list">${list.slice(0,12).map(m=>{ const ap=m.actions||[], open=ap.filter(a=>{ const t=d.tasks.find(z=>z.id===a.taskId); return !(t&&t.done); }).length;
      return `<div class="it" data-a="x31minview" data-id="${m.id}" style="cursor:pointer"><div class="x"><b>${esc(m.title)}</b><small>${nice(m.date)} · ${ap.length} action point${ap.length===1?'':'s'}${ap.length?' · '+(open?open+' open':'all done ✓'):''}</small></div><span class="muted">›</span></div>`; }).join('')}</div>`
      :'<div class="empty">Write the minutes of each meeting with the action points: what, who and by when. Each action point becomes a task with a reminder, and you can send each brother his part on WhatsApp.</div>'}</div>`;
}
function minutesSheet(id){
  const d=SEC(), src = id ? d.minutes.find(z=>z.id===id) : null;
  if(!MN || MN.id!==(id||null)) MN = src ? JSON.parse(JSON.stringify(src)) : {id:null, title:MN_KINDS[0], date:TODAY(), present:'', notes:'', actions:[{id:uid(), what:'', who:'', phone:'', due:''}]};
  const men=d.pubs.filter(p=>p.status!=='moved' && p.gender!=='f');
  openSheet(`<h3>${id?'Edit minutes':'New minutes'}</h3>
    <div class="f2"><div class="f"><label>Meeting</label><input type="text" id="mnTitle" value="${esc(MN.title)}" list="mnKinds"><datalist id="mnKinds">${MN_KINDS.map(k=>`<option>${esc(k)}</option>`).join('')}</datalist></div><div class="f"><label>Date</label><input type="date" id="mnDate" value="${MN.date}"></div></div>
    <div class="f"><label>Present</label><input type="text" id="mnPresent" value="${esc(MN.present||'')}" placeholder="Bro. Annobil (chairman), Bro. Brown, Bro. Sreku…"></div>
    <div class="f"><label>What was discussed and decided</label><textarea id="mnNotes" style="min-height:140px">${esc(MN.notes||'')}</textarea></div>
    <div class="area">Action points</div>
    ${MN.actions.map((a,i)=>`<div class="card" style="padding:10px;margin-bottom:8px;box-shadow:none;border:1px solid var(--line)">
      <div class="f"><label>Action ${i+1}</label><input type="text" class="mnA" data-i="${i}" data-k="what" value="${esc(a.what)}" placeholder="Arrange the cleaning rota for December"></div>
      <div class="f2"><div class="f"><label>Who</label><input type="text" class="mnA" data-i="${i}" data-k="who" value="${esc(a.who)}" list="mnMen"></div><div class="f"><label>Deadline</label><input type="date" class="mnA" data-i="${i}" data-k="due" value="${a.due||''}"></div></div>
      <div class="sndrow"><input type="tel" class="mnA" data-i="${i}" data-k="phone" value="${esc(a.phone||'')}" placeholder="His WhatsApp number"><button class="btn ghost" data-a="x31mndel" data-k="${i}" aria-label="Remove">${svg('trash',16)}</button></div></div>`).join('')}
    <datalist id="mnMen">${men.map(p=>`<option>${esc(p.name)}</option>`).join('')}</datalist>
    <button class="btn ghost" data-a="x31mnadd">${svg('plus',16)} Add an action point</button>
    ${actions}
    ${id?`<button class="btn danger" data-a="x31mindel" data-id="${id}" style="margin-top:8px">Delete these minutes</button>`:''}`, ()=>{
      mnRead(); if(!MN.title.trim()) return fail('mnTitle','Name the meeting');
      const rec = src || {id:uid()};
      Object.assign(rec,{title:MN.title.trim(), date:MN.date||TODAY(), present:MN.present.trim(), notes:MN.notes.trim(), actions:MN.actions.filter(a=>a.what.trim()).map(a=>({...a, what:a.what.trim(), who:a.who.trim(), phone:a.phone.trim()}))});
      rec.actions.forEach(a=>{ let t=a.taskId&&d.tasks.find(z=>z.id===a.taskId);
        if(!t){ t={id:uid(), created:TODAY(), nudges:[], remind:2, role:'other', fromMin:rec.id}; d.tasks.push(t); a.taskId=t.id; }
        Object.assign(t,{title:a.what, toName:a.who, toPhone:a.phone, due:a.due, notes:'From the '+rec.title.toLowerCase()+' on '+longDate(rec.date)+'.'}); });
      const keepIds=new Set(rec.actions.map(a=>a.taskId)); d.tasks=d.tasks.filter(t=>t.fromMin!==rec.id || keepIds.has(t.id) || t.done);
      if(!src) d.minutes.push(rec); MN=null; setTimeout(()=>minView(rec.id),120); return true; });
  document.querySelectorAll('.mnA').forEach(el=>{ if(el.dataset.k==='who') el.addEventListener('change',()=>{ const p=letterWho(el.value), ph=document.querySelector(`.mnA[data-i="${el.dataset.i}"][data-k="phone"]`); if(p&&p.phone&&ph&&!ph.value) ph.value=p.phone; }); });
}
function mnRead(){ if(!MN) return; MN.title=val('mnTitle'); MN.date=val('mnDate'); MN.present=val('mnPresent'); MN.notes=val('mnNotes'); document.querySelectorAll('.mnA').forEach(el=>{ const a=MN.actions[n(el.dataset.i)]; if(a) a[el.dataset.k]=el.value; }); }
function minText(m){ return `*${m.title}*\n${longDate(m.date)}${m.present?'\nPresent: '+m.present:''}\n\n${m.notes||''}${(m.actions||[]).length?'\n\n*Action points*\n'+m.actions.map((a,i)=>`${i+1}. ${a.what}${a.who?' — '+a.who:''}${a.due?' (by '+longDate(a.due)+')':''}`).join('\n'):''}`; }
function minPersonMsg(m, who){ const mine=m.actions.filter(a=>nameKey(a.who)===nameKey(who));
  return `Good ${timeOfDay()} ${firstName(nameOnly(who))}! From our ${m.title.toLowerCase()} on ${longDate(m.date)}, here ${mine.length===1?'is the action point':'are the action points'} for you:\n\n${mine.map((a,i)=>(mine.length>1?(i+1)+'. ':'')+a.what+(a.due?' (by '+dayDate(a.due)+')':'')).join('\n')}\n\nThank you very much for your help 🙏`; }
function minView(id){
  const d=SEC(), m=d.minutes.find(z=>z.id===id); if(!m) return;
  const people=[...new Map(m.actions.filter(a=>a.who).map(a=>[nameKey(a.who),a])).values()];
  openSheet(`<h3>${esc(m.title)}</h3><p class="muted" style="margin:-4px 0 10px">${longDate(m.date)}${m.present?' · Present: '+esc(m.present):''}</p>
    ${m.notes?`<div style="white-space:pre-wrap;font-size:14.5px;margin-bottom:10px">${esc(m.notes)}</div>`:''}
    ${m.actions.length?`<div class="area">Action points</div><div class="list">${m.actions.map(a=>{ const t=d.tasks.find(z=>z.id===a.taskId), st=t?taskState(t):'green';
      return `<div class="it"><span class="wdot ${st}" style="margin-top:6px"></span><div class="x"><b style="${t&&t.done?'text-decoration:line-through;opacity:.7':''}">${esc(a.what)}</b><small>${esc(a.who||'Nobody named')}${a.due?' · by '+nice(a.due):''}${t&&t.done?' · done ✓':''}</small></div>${t&&!t.done?`<button class="btn sm ghost" data-a="taskdone" data-id="${t.id}">Done</button>`:''}</div>`; }).join('')}</div>`:''}
    ${people.length?`<div class="area">Send each brother his part</div><div class="btns" style="flex-direction:column">${people.map(a=>`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${phoneIntl(a.phone)}?text=${encodeURIComponent(minPersonMsg(m,a.who))}" data-a="x31minsent" data-id="${m.id}" data-k="${esc(a.who)}">Send to ${esc(nameOnly(a.who))}${(m.sent||{})[nameKey(a.who)]?' again ✓':''}</a>`).join('')}</div>`:''}
    <div class="btns" style="margin-top:10px;flex-direction:column"><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(minText(m))}">Share the full minutes on WhatsApp</a>
      <button class="btn ghost" data-a="x31minpdf" data-id="${m.id}">PDF of the minutes</button>
      <div class="btns"><button class="btn ghost" style="flex:1" data-a="x31min" data-id="${m.id}">Edit</button><button class="btn ghost" style="flex:1" data-a="close">Close</button></div></div>
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">Each action point is also in Duties &amp; tasks, with a reminder at 9 am 2 days before the deadline.</p>`, null);
}
async function minPdf(m){
  const K=await pdfKit(); K.letterhead(m.title+'  ·  '+longDate(m.date));
  if(m.present) K.text('Present: '+m.present,{size:10}); K.gap(6);
  if(m.notes){ K.h('Discussion',12); K.text(m.notes,{size:10.5}); }
  if(m.actions.length){ K.h('Action points',12); K.table([['#',0.5],['Action',5],['Who',2.2],['Deadline',1.8]], m.actions.map((a,i)=>[i+1,a.what,a.who,a.due?longDate(a.due):''])); }
  K.footer('Minutes · '+(congInfo().name||'')+' Congregation · confidential'); return K.save();
}

/* ================= CIRCUIT OVERSEER'S VISIT: programme, partners and lunch, shepherding, recommendations ================= */
const CO_DAYS=['Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const REC_FOR=[['ms','Ministerial servant'],['elder','Elder'],['rp','Regular pioneer'],['other','Other']];
function COV(){ const co=SEC().co; co.prog=co.prog||[]; co.lunch=co.lunch||{}; co.shep=co.shep||[]; co.recs=co.recs||[]; return co; }
const shortD = x => x ? parse(x).toLocaleDateString('en-GB',{day:'numeric',month:'long'}) : '';
function coDayDate(day){ const co=COV(); if(!co.date) return ''; const st=parse(co.date), target=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].indexOf(day); let x=co.date; for(let i=0;i<7;i++){ if(parse(x).getDay()===target) return x; x=addDays(x,1); } return ''; }
function secCO(){
  const co=COV(), cd=co.date?-daysSince(co.date):null, byDay=CO_DAYS.map(dy=>[dy, co.prog.filter(p=>p.day===dy).sort((a,b)=>(a.time||'').localeCompare(b.time||''))]);
  let html=`<div class="card"><h2>Circuit overseer's visit</h2>
    ${co.date?`<div class="codebox" style="font-size:24px;margin-top:4px">${cd>0?cd+' day'+(cd===1?'':'s')+' to go':cd===0?'Starts today':cd>-7?'Visit this week':'Last visit '+nice(co.date)}</div>`:''}
    <div class="f2"><div class="f"><label>Visit starts (Tuesday)</label><input type="date" id="coDate" value="${co.date||''}"></div><div class="f"><label>Circuit overseer</label><input type="text" id="coName" value="${esc(co.name||'')}" placeholder="Bro. and Sis. …"></div></div>
    <div class="f"><label>Hosting elder</label><input type="text" id="coHost" value="${esc(co.host||'')}" list="coElders"></div>
    <datalist id="coElders">${SEC().pubs.filter(p=>p.elder||p.ms).map(p=>`<option>${esc(p.name)}</option>`).join('')}</datalist>
    <div class="f"><label>To prepare</label><textarea id="coNotes" placeholder="Reports up to date&#10;Accounts audited&#10;Hospitality arranged">${esc(co.notes||'')}</textarea></div>
    <div class="btns" style="flex-direction:column"><button class="btn" data-a="coprint">Print circuit overseer summary</button><button class="btn ghost" data-a="x31conew">Start a new visit (keeps this one in the history)</button></div></div>`;
  html+=`<div class="card"><h2>Programme for the week<span class="sp"></span><button class="btn sm ghost" data-a="x31coprog">${svg('plus',15)} Add</button></h2>
    ${co.prog.length?byDay.filter(x=>x[1].length).map(([dy,l])=>`<div class="area">${dy}${coDayDate(dy)?' · '+shortD(coDayDate(dy)):''}</div><div class="list">${l.map(p=>`<div class="it" data-a="x31coprog" data-id="${p.id}" style="cursor:pointer"><div class="x"><b>${p.time?fmtTime(p.time)+' · ':''}${esc(p.what)}</b><small>${esc([p.place, p.prayer&&'Prayer: '+p.prayer].filter(Boolean).join(' · '))}</small></div></div>`).join('')}</div>`).join('')
      :`<div class="empty">Add each activity: day, time, place and who prays.</div><button class="btn ghost" data-a="x31cousual" style="margin-top:8px">Start with the usual week</button>`}</div>`;
  html+=`<div class="card"><h2>Field service partners and lunch</h2><div class="list">${CO_DAYS.map(dy=>{ const l=co.lunch[dy]||{}; return `<div class="it" data-a="x31colunch" data-k="${dy}" style="cursor:pointer"><div class="x"><b>${dy}</b><small>${esc([l.am&&'Morning: '+l.am, l.pm&&'Afternoon: '+l.pm, l.food&&'Lunch: '+l.food+(l.cook?' ('+l.cook+')':'')].filter(Boolean).join(' · ')||'Tap to add partners and lunch')}</small></div><span class="muted">›</span></div>`; }).join('')}</div>
    <div class="btns" style="margin-top:10px;flex-direction:column"><button class="btn" data-a="x31copdf" data-k="prog">Programme for the notice board (PDF)</button><button class="btn ghost" data-a="x31copdf" data-k="lunch">Partners and lunch (PDF)</button><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(coProgText())}">Share the programme on WhatsApp</a></div></div>`;
  html+=`<div class="card"><h2>Shepherding calls<span class="sp"></span><button class="btn sm ghost" data-a="x31coshep">${svg('plus',15)} Add</button></h2>
    ${co.shep.length?`<div class="list">${co.shep.map((s,i)=>`<div class="it"><span class="wdot ${s.done?'green':'orange'}" style="margin-top:6px"></span><div class="x" data-a="x31coshep" data-id="${s.id}" style="cursor:pointer"><b>${i+1}. ${esc(s.name)}</b><small>${esc([s.when, s.elder&&s.elder+' with the C.O.'].filter(Boolean).join(' · '))}</small>${s.notes?`<div style="font-size:13.5px;margin-top:2px">${esc(s.notes.slice(0,110))}${s.notes.length>110?'…':''}</div>`:''}</div>${s.elder?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/${phoneIntl((letterWho(s.elder)||{}).phone)}?text=${encodeURIComponent(shepMsg(s))}">Remind</a>`:''}</div>`).join('')}</div>`:'<div class="empty">Who to visit with the circuit overseer, when, which elder goes, and why.</div>'}</div>`;
  html+=`<div class="card"><h2>Recommendations<span class="sp"></span><button class="btn sm ghost" data-a="x31corec">${svg('plus',15)} Add</button></h2>
    ${co.recs.length?`<div class="list">${co.recs.map(r=>`<div class="it" data-a="x31corec" data-id="${r.id}" style="cursor:pointer"><div class="x"><b>${esc(r.name)}</b><small>To serve as ${esc((REC_FOR.find(x=>x[0]===r.for)||REC_FOR[3])[1].toLowerCase())}</small>${r.notes?`<div style="font-size:13.5px;margin-top:2px">${esc(r.notes.slice(0,110))}${r.notes.length>110?'…':''}</div>`:''}</div></div>`).join('')}</div>`:'<div class="empty">Brothers you will recommend, with their good qualities and the scriptures (for example 1 Timothy 3:7, 10).</div>'}</div>`;
  html+=`<div class="card"><h2>Major problems in the congregation</h2><div class="f"><textarea id="coProb" style="min-height:100px" placeholder="For example: secular work clashes with field service days…">${esc(co.problems||'')}</textarea></div>
    <button class="btn" data-a="x31copdf" data-k="agenda">Agenda for the elders (PDF)</button><p class="muted" style="font-size:12.5px;margin:6px 0 0">Hosting elder, recommendations, shepherding calls and problems. Confidential: for the elders and the circuit overseer only.</p></div>`;
  if((SEC().coHist||[]).length) html+=`<div class="card"><h2>Past visits</h2><div class="list">${SEC().coHist.slice().reverse().map(h=>`<div class="it"><div class="x"><b>${h.date?nice(h.date):'Visit'}</b><small>${(h.prog||[]).length} activities · ${(h.shep||[]).length} shepherding calls · ${(h.recs||[]).length} recommendations</small></div></div>`).join('')}</div></div>`;
  return html;
}
function shepMsg(s){ return `Good ${timeOfDay()} ${firstName(nameOnly(s.elder))}! A reminder: shepherding call with the circuit overseer to ${s.name}${s.when?', '+s.when:''}. Thank you 🙏`; }
function coProgText(){ const co=COV(); const c=congInfo();
  return `*Circuit overseer's visit${co.date?' · week of '+longDate(co.date):''}*${c.name?'\n'+c.name+' Congregation':''}\n`+CO_DAYS.map(dy=>{ const l=co.prog.filter(p=>p.day===dy).sort((a,b)=>(a.time||'').localeCompare(b.time||'')), lu=co.lunch[dy]||{}; if(!l.length&&!lu.am&&!lu.pm&&!lu.food) return '';
    return `\n*${dy}${coDayDate(dy)?' '+shortD(coDayDate(dy)):''}*\n`+l.map(p=>`${p.time?fmtTime(p.time)+' ':''}${p.what}${p.place?' — '+p.place:''}${p.prayer?' (prayer: '+p.prayer+')':''}`).join('\n')+(lu.am?`\nMorning partners: ${lu.am}`:'')+(lu.pm?`\nAfternoon partners: ${lu.pm}`:'')+(lu.food?`\nLunch: ${lu.food}${lu.cook?' ('+lu.cook+')':''}`:''); }).join(''); }
function coProgSheet(id){
  const co=COV(), x = id ? co.prog.find(z=>z.id===id) : {day:'Tuesday', time:'', what:'', place:'Kingdom Hall', prayer:''};
  openSheet(`<h3>${id?'Edit activity':'Add an activity'}</h3>
    <div class="f2"><div class="f"><label>Day</label><select id="cpDay">${CO_DAYS.map(dy=>`<option ${dy===x.day?'selected':''}>${dy}</option>`).join('')}</select></div><div class="f"><label>Time</label><input type="time" id="cpTime" value="${x.time||''}"></div></div>
    <div class="f"><label>Activity</label><input type="text" id="cpWhat" value="${esc(x.what)}" list="cpActs" placeholder="Field service meeting"><datalist id="cpActs">${['Life and Ministry Meeting and first service talk','Field service meeting','Second meeting for field service','Accounts meeting','Meeting with elders and ministerial servants','Pioneer meeting','Public talk','Watchtower Study summary','Last service talk'].map(a=>`<option>${a}</option>`).join('')}</datalist></div>
    <div class="f2"><div class="f"><label>Place</label><input type="text" id="cpPlace" value="${esc(x.place||'')}"></div><div class="f"><label>Prayer</label><input type="text" id="cpPray" value="${esc(x.prayer||'')}" list="coMen" placeholder="Opening / closing"></div></div>
    <datalist id="coMen">${SEC().pubs.filter(p=>p.gender!=='f'&&p.status!=='moved').map(p=>`<option>${esc(p.name)}</option>`).join('')}</datalist>
    ${actions}${id?`<button class="btn danger" data-a="x31codel" data-k="prog" data-id="${id}" style="margin-top:8px">Delete</button>`:''}`, ()=>{
      const w=val('cpWhat').trim(); if(!w) return fail('cpWhat','Write the activity');
      const rec=id?x:{id:uid()}; Object.assign(rec,{day:val('cpDay'), time:val('cpTime'), what:w, place:val('cpPlace').trim(), prayer:val('cpPray').trim()}); if(!id) co.prog.push(rec); return true; });
}
function coUsual(){ const co=COV(), add=(day,time,what,place='Kingdom Hall')=>co.prog.push({id:uid(), day, time, what, place, prayer:''});
  add('Tuesday','18:30','Life and Ministry Meeting and first service talk');
  ['Wednesday','Thursday'].forEach(d=>{ add(d,'08:45','Field service meeting'); add(d,'12:00','Second meeting for field service'); });
  add('Thursday','17:00','Accounts meeting'); add('Friday','08:45','Field service meeting'); add('Friday','18:00','Meeting with elders and ministerial servants');
  add('Saturday','08:45','Field service meeting'); add('Saturday','12:30','Pioneer meeting'); add('Sunday','08:45','Field service meeting'); add('Sunday','16:00','Public talk, Watchtower Study summary and last service talk'); }
function coLunchSheet(day){
  const co=COV(), l=co.lunch[day]||{};

    <div class="f"><label>Morning field service partners</label><textarea id="clAm" style="min-height:60px" placeholder="Names, separated by commas">${esc(l.am||'')}</textarea></div>
    <div class="f"><label>Afternoon partners</label><textarea id="clPm" style="min-height:60px">${esc(l.pm||'')}</textarea></div>
    <div class="f2"><div class="f"><label>Lunch</label><input type="text" id="clFood" value="${esc(l.food||'')}" placeholder="Jollof"></div><div class="f"><label>Prepared by</label><input type="text" id="clCook" value="${esc(l.cook||'')}" placeholder="Sis. Vida"></div></div>
    ${actions}`, ()=>{ co.lunch[day]={am:val('clAm').trim(), pm:val('clPm').trim(), food:val('clFood').trim(), cook:val('clCook').trim()}; return true; });
}
function coShepSheet(id){
  const co=COV(), x = id ? co.shep.find(z=>z.id===id) : {name:'', when:'', elder:'', notes:'', done:false};

const titleCase = s => /[a-z]/.test(s) ? s : s.toLowerCase().replace(/(^|[\s\-'])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function applyBulk(){
  const d=SEC(); let added=0, updated=0, group='';
  val('pbText').split(/\n+/).forEach(l=>{
    const raw=l.trim(); if(!raw) return;
    const gh=raw.match(/^(?:field service\s+)?group\s*(\d+|[A-Za-z]+)\s*[:\-]?\s*$/i); if(gh){ group='Group '+gh[1].toUpperCase(); return; }
    if(/^name of publisher|^name\b.*phone/i.test(raw)) return;
    const parts=raw.split(/[,;\t|]/).map(x=>x.trim()).filter(Boolean); if(!parts.length) return;
    const nm=titleCase(parts[0].replace(/^\d+[.)]\s*/,'').replace(/\s+/g,' ')); if(nm.length<2 || /\d{5}/.test(nm)) return;
    const rest=parts.slice(1), isPh=x=>/^[+\d][\d\s\/\\\-]{7,}$/.test(x);
    const phones=rest.filter(isPh).join('/').split(/[\/\\]/).map(x=>x.replace(/[^\d+]/g,'')).filter(x=>x.length>=9);
    const words=rest.filter(x=>!isPh(x)), tp=words.find(x=>/pioneer|unbap|special/i.test(x))||'', grp=words.find(x=>x!==tp && /group|^\d+$/i.test(x));
    const g=grp?(/^\d+$/.test(grp)?'Group '+grp:titleCase(grp)):group;
    const ex=d.pubs.find(p=>nameKey(p.name)===nameKey(nm));
    if(ex){ let ch=false; if(phones[0] && !ex.phone){ ex.phone=phones[0]; ch=true; } if(phones[1] && !(ex.notes||'').includes(phones[1])){ ex.notes=((ex.notes||'')+'\nOther number: '+phones[1]).trim(); ch=true; } if(g && !ex.group){ ex.group=g; ch=true; } if(ch) updated++; return; }
    d.pubs.push({id:uid(), name:nm, group:g, phone:phones[0]||'', notes:phones[1]?'Other number: '+phones[1]:'', type:/special/i.test(tp)?'sp':/pioneer/i.test(tp)?'rp':/unbap/i.test(tp)?'unbap':'pub', status:'active', visits:[], since:MONTH()}); added++;
  });
  save(); closeSheet(); render(); toast(added+' added'+(updated?', '+updated+' updated with phone or group':''));
}

/* ================= MONTHLY CONGREGATION REPORT ================= */
function monthReportText(m){
  const t=monthTotals(m), a=attMonth(m,'mid'), b=attMonth(m,'wk'), c=congInfo();
  return `${c.name?c.name+' Congregation\n':''}Monthly report: ${monthName(m)}\n\nReports in: ${t.in+t.none} of ${t.total}${t.missing?' ('+t.missing+' missing)':''}\nPublishers: ${t.pub.n} · Bible studies ${t.pub.st}\nAuxiliary pioneers: ${t.aux.n} · Hours ${r1(t.aux.h)} · Bible studies ${t.aux.st}\nRegular pioneers: ${t.rp.n} · Hours ${r1(t.rp.h)} · Bible studies ${t.rp.st}\nAll Bible studies: ${t.pub.st+t.aux.st+t.rp.st}\n\nMeeting attendance (average)\nMidweek: ${a.n?a.avg+' ('+a.n+' meeting'+(a.n===1?'':'s')+')':'not entered'}\nWeekend: ${b.n?b.avg+' ('+b.n+' meeting'+(b.n===1?'':'s')+')':'not entered'}`;
}
async function makeMonthReport(m){
  const L=await loadPdfLib(), doc=await L.PDFDocument.create();
  const font=await doc.embedFont(L.StandardFonts.Helvetica), bold=await doc.embedFont(L.StandardFonts.HelveticaBold);
  const ink=printRgb(L), grey=L.rgb(0.4,0.45,0.52), line=L.rgb(0.85,0.88,0.92), W=595, H=842, M=40;
  const clean=x=>String(x??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/₵/g,'C').replace(/[^\x20-\x7E\xA0-\xFF]/g,'');
  const fit=(x,w,size,f)=>{ x=clean(x); while(x && f.widthOfTextAtSize(x,size)>w) x=x.slice(0,-1); return x; };
  let page, y;
  const newPage=()=>{ page=doc.addPage(); page.setSize(W,H); y=H-M; };
  const need=h=>{ if(y-h<M+20) newPage(); };
  const text=(x,xp,size=9.5,f=font,c=ink)=>page.drawText(clean(x),{x:xp,y,size,font:f,color:c});
  const heading=x=>{ need(44); y-=10; text(x,M,12.5,bold); y-=6; page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:1,color:ink}); y-=14; };
  const row=(cells,xs,f=font,size=9.5)=>{ need(14); cells.forEach((c,i)=>text(fit(c,((xs[i+1]||W-M)-xs[i])-6,size,f),xs[i],size,f)); y-=5; page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:0.4,color:line}); y-=10; };
  const note=x=>{ need(14); text(x,M,9.5,font,grey); y-=14; };
  const para=x=>{ const words=clean(x).split(' '); let ln=''; words.forEach(w=>{ if(font.widthOfTextAtSize(ln+' '+w,9.5)>W-2*M){ need(14); text(ln.trim(),M); y-=13; ln=''; } ln+=' '+w; }); if(ln.trim()){ need(14); text(ln.trim(),M); y-=13; } };
  const t=monthTotals(m), c=congInfo(), d=SEC();
  newPage();
  text((c.name?c.name+' Congregation - ':'')+'Monthly report',M,16,bold); y-=18;
  text(monthName(m)+'   ·   Prepared '+parse(TODAY()).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+(c.secName?'   ·   '+c.secName+', Secretary':''),M,9.5,font,grey); y-=10;

  heading('1. Field service');
  let xs=[M,220,320,420];
  row(['','Number','Hours','Bible studies'],xs,bold,8.5);
  row(['Publishers',t.pub.n,'',t.pub.st],xs);
  row(['Auxiliary pioneers',t.aux.n,r1(t.aux.h),t.aux.st],xs);
  row(['Regular pioneers',t.rp.n,r1(t.rp.h),t.rp.st],xs);
  row(['Total',t.pub.n+t.aux.n+t.rp.n,r1(t.aux.h+t.rp.h),t.pub.st+t.aux.st+t.rp.st],xs,bold);
  note('Reports in: '+(t.in+t.none)+' of '+t.total+' active publishers'+(t.none?' ('+t.none+' did not share)':'')+(t.missing?'. Still missing: '+t.missing+'.':'.'));

  heading('2. Meeting attendance');
  xs=[M,200,330,450];
  row(['','Meetings','Average','Total'],xs,bold,8.5);
  [['Midweek','mid'],['Weekend','wk']].forEach(([l,k])=>{ const a=attMonth(m,k); row([l,a.n||'-',a.n?a.avg:'-',a.n?a.total:'-'],xs); });
  const pm=prevMonth(m), pa=attMonth(pm,'wk'), ca=attMonth(m,'wk');
  if(pa.n&&ca.n) note('Weekend average last month: '+pa.avg+(ca.avg>=pa.avg?' (up)':' (down)'));

  heading('3. Reports still missing');
  const miss=activePubs().filter(p=>repState(rep(m,p.id))==='missing').sort((a,b)=>(a.group||'').localeCompare(b.group||'')||a.name.localeCompare(b.name));
  if(miss.length){ xs=[M,260,400]; row(['Name','Group','Phone'],xs,bold,8.5); miss.forEach(p=>row([p.name,p.group||'-',p.phone||'-'],xs)); } else note('None. Every active publisher has reported.');

  heading('4. Pioneers');
  const pios=activePubs().filter(p=>isPioneer(p) || (rep(m,p.id)||{}).aux).sort((a,b)=>a.name.localeCompare(b.name));
  if(pios.length){ xs=[M,230,340,430]; row(['Name','Type','Hours','Bible studies'],xs,bold,8.5);
    pios.forEach(p=>{ const r=rep(m,p.id); row([p.name,isPioneer(p)?'Regular pioneer':'Auxiliary pioneer',r&&r.shared!==false?r1(n(r.hours)):'not in',r?n(r.studies):'-'],xs); }); }
  else note('No pioneers this month.');

  heading('5. Field service groups');
  const groups=groupsList();
  if(groups.length){ xs=[M,220,330,440]; row(['Group','Publishers','Reported','Missing'],xs,bold,8.5);
    groups.forEach(g=>{ const ps=activePubs().filter(p=>(p.group||'')===g), inn=ps.filter(p=>repState(rep(m,p.id))!=='missing').length; row([g,ps.length,inn,ps.length-inn],xs); }); }
  else note('No groups set.');

  heading('6. Changes and care');
  const newP=d.pubs.filter(p=>p.since===m), bap=d.pubs.filter(p=>p.baptized&&p.baptized.slice(0,7)===m), ina=inactivePubs(), att=needsAttention(m);
  note('New publishers added: '+(newP.length?newP.map(p=>p.name).join(', '):'none'));
  note('Baptized this month: '+(bap.length?bap.map(p=>p.name).join(', '):'none'));
  note('Inactive publishers: '+ina.length+'   ·   Missed two months in a row: '+(att.length?att.map(p=>p.name).join(', '):'none'));

  const remM=d.remits.filter(r=>r.date.slice(0,7)===m), openT=d.tasks.filter(x=>!x.done);
  if(remM.length||openT.length){ heading('7. Operating committee');
    if(remM.length) note('Remittance sent: '+money(remM.reduce((a,r)=>a+n(r.amount),0))+' ('+remM.map(r=>nice(r.date)+(r.ref?' ref '+r.ref:'')).join(', ')+')');
    if(openT.length){ xs=[M,280,430]; row(['Task still open','Given to','Due'],xs,bold,8.5); openT.forEach(x=>row([x.title,taskWho(x),x.due?nice(x.due):'-'],xs)); } }
  need(30); y-=10; note('Confidential congregation record. Made with Life Compass.');
  return doc.save();
}
async function monthReport(btn, m){
  const was=btn.textContent; btn.textContent='Making the report…'; btn.disabled=true;
  try{ await savePdfFile(await makeMonthReport(m), 'Monthly report '+m+'.pdf', monthReportText(m)); toast('Report ready'); }
  catch(e){ toast(e.message||'Could not make the report'); }
  btn.textContent=was; btn.disabled=false;
}

function simpleSheet(listKey, id, title, fields, defaults){
  const d=SEC(), x = id ? d[listKey].find(z=>z.id===id) : {...defaults};
  const inp=f=> f.type==='select' ? `<select id="sf_${f.k}">${f.opts.map(([v,l])=>`<option value="${v}" ${v===x[f.k]?'selected':''}>${l}</option>`).join('')}</select>`
    : f.type==='textarea' ? `<textarea id="sf_${f.k}" style="min-height:${f.h||90}px">${esc(x[f.k]||'')}</textarea>`
    : `<input type="${f.type||'text'}" ${f.num?'inputmode="decimal"':''} id="sf_${f.k}" value="${esc(x[f.k]??'')}" placeholder="${esc(f.ph||'')}">`;
  openSheet(`<h3>${id?'Edit':'Add'}: ${title}</h3>${fields.map(f=>`<div class="f"><label>${f.l}</label>${inp(f)}</div>`).join('')}${actions}
    ${id?`<button class="btn danger" data-a="sfdel" data-list="${listKey}" data-id="${id}" style="margin-top:8px">Delete</button>`:''}`, ()=>{
      const req=fields.find(f=>f.req && !val('sf_'+f.k).trim()); if(req) return fail('sf_'+req.k,'Fill this in');
      const rec = id ? x : {id:uid()}; fields.forEach(f=>{ const v=val('sf_'+f.k); rec[f.k]= f.num ? n(v) : v.trim(); });
      if(!id) d[listKey].push(rec); return true;
    });
}

/* ---------- field service timer (uses the phone's clock; works offline) ---------- */
function T(){ return S.timer || (S.timer={running:false, startedAt:null, sessionMs:0, segments:0}); }
function hm(ms){ const m=Math.round(ms/60000); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'; }
function clock(ms){ const s=Math.floor(ms/1000); return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function hoursText(h){ const m=Math.round(n(h)*60); return m<60? m+' min' : Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':''); }
function timerNow(){ const t=T(); return t.sessionMs + (t.running ? Date.now()-t.startedAt : 0); }
function addMinistryMs(ms, date){
  if(ms<30000) return 0;                             // ignore taps under 30 seconds
  let en=S.ministry.find(x=>x.date===date && !x.manual);
  if(!en){ en={id:uid(), date, hours:0, studies:0, notes:'Field service timer'}; S.ministry.push(en); }
  en.hours = Math.round((n(en.hours)+ms/3.6e6)*100)/100;
  return ms;
}

/* ---------- loading the PDF tool (downloaded once, then kept on the phone) ---------- */
const PDFLIB_URL='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
async function loadPdfLib(){
  if(window.PDFLib) return window.PDFLib;
  let code=null; try{ code=await photoGet('lib:pdf-lib'); }catch(e){}
  if(!code){
    if(!navigator.onLine) throw new Error('Connect to the internet once so the app can get its printing tool. After that, printing works offline.');
    const r=await fetch(PDFLIB_URL); if(!r.ok) throw new Error('Could not download the printing tool. Try again with data on.');
    code=await r.text(); try{ await photoPut('lib:pdf-lib', code); }catch(e){}
  }
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=URL.createObjectURL(new Blob([code],{type:'text/javascript'})); s.onload=res; s.onerror=()=>rej(new Error('The printing tool did not load.')); document.head.appendChild(s); });
  return window.PDFLib;
}
const FORM_KEY={s21:'form:S-21', s88:'form:S-88'};
function b64ToBytes(b64){ const s=atob(b64.split(',').pop()); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function bytesToB64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function savePdfFile(bytes, name, text, mime){
  if(NATIVE){
    const F=window.Capacitor.Plugins.Filesystem, Sh=window.Capacitor.Plugins.Share;
    const r=await F.writeFile({path:name, data:bytesToB64(bytes), directory:'CACHE'});
    await Sh.share({title:name, text:text||undefined, files:[r.uri], dialogTitle:'Choose WhatsApp to send it'});
    return;
  }
  const url=URL.createObjectURL(new Blob([bytes],{type:mime||'application/pdf'})), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
}

const S21 = { rows:[628,608,588,568,549,529,509,489,469,450,430,410], shareX:130, auxX:271, studiesX:207, hoursX:348, remarksX:388, totalY:387,

function tick(page, x, y, rgb, s=1){ page.drawLine({start:{x:x+2*s,y:y+5*s}, end:{x:x+5*s,y:y+1.5*s}, thickness:1.5, color:rgb}); page.drawLine({start:{x:x+5*s,y:y+1.5*s}, end:{x:x+11.5*s,y:y+10*s}, thickness:1.5, color:rgb}); }
const htick=(pg,x,y,ink)=>tick(pg,x+0.5,y+2.5,ink,0.75);
async function makeS21(people, sy, totals){
  const L=await loadPdfLib(), blank=await photoGet(FORM_KEY.s21); if(!blank) throw new Error('Add your blank S-21 card first.');
  const src=await L.PDFDocument.load(b64ToBytes(blank)), out=await L.PDFDocument.create();
  const font=await out.embedFont(L.StandardFonts.Helvetica), bold=await out.embedFont(L.StandardFonts.HelveticaBold), ink=L.rgb(0.05,0.13,0.35);

  const centre=(page,t,cx,y,size=10,f=font)=>{ t=String(t); page.drawText(t,{x:cx-f.widthOfTextAtSize(t,size)/2, y, size, font:f, color:ink}); };
  const add = async (fillFn) => { const [pg]=await out.copyPages(src,[0]); out.addPage(pg); fillFn(pg); };
  for(const p of people){

    await add(pg=>{

      if(p.dob) pg.drawText(nice(p.dob).replace(/^\w+, /,'')+' '+p.dob.slice(0,4),{x:S21.dob[0],y:S21.dob[1],size:10,font,color:ink});
      if(p.baptized) pg.drawText(nice(p.baptized).replace(/^\w+, /,'')+' '+p.baptized.slice(0,4),{x:S21.bap[0],y:S21.bap[1],size:10,font,color:ink});
      if(p.gender==='m') htick(pg,S21.male,S21.sexY,ink); if(p.gender==='f') htick(pg,S21.female,S21.sexY,ink);
      if(p.hope==='os') htick(pg,S21.os,S21.hopeY,ink); if(p.hope==='an') htick(pg,S21.an,S21.hopeY,ink);
      if(p.elder) htick(pg,S21.roles.elder,S21.roleY,ink); if(p.ms) htick(pg,S21.roles.ms,S21.roleY,ink);
      if(p.type==='rp') htick(pg,S21.roles.rp,S21.roleY,ink); if(p.type==='sp') htick(pg,S21.roles.sp,S21.roleY,ink); if(p.type==='fm') htick(pg,S21.roles.fm,S21.roleY,ink);
      pg.drawText(String(sy),{x:22,y:650,size:10,font:bold,color:ink});
      y.rows.forEach((r,i)=>{ const yy=S21.rows[i];
        if(r.shared) tick(pg,S21.shareX,yy,ink);
        if(r.aux) tick(pg,S21.auxX,yy,ink);
        if(r.studies!=='' && r.shared) centre(pg,r.studies,S21.studiesX,yy+1);
        if(r.hours!=='') centre(pg,r1(r.hours),S21.hoursX,yy+1);
        if(r.remarks) pg.drawText(fit(r.remarks,186,8),{x:S21.remarksX,y:yy+2,size:8,font,color:ink});
      });
      if(y.hours) centre(pg,r1(y.hours),S21.hoursX,S21.totalY,10,bold);
    });
  }
  for(const [cat,label] of totals){
    const rows=catYear(cat, sy);
    await add(pg=>{
      pg.drawText(label,{x:S21.name[0],y:S21.name[1],size:11,font:bold,color:ink});
      pg.drawText(String(sy),{x:22,y:650,size:10,font:bold,color:ink});
      rows.forEach((r,i)=>{ const yy=S21.rows[i]; if(!r.n) return;
        centre(pg,r.studies,S21.studiesX,yy+1);
        if(r.hours!=='' ) centre(pg,r.hours,S21.hoursX,yy+1);
        pg.drawText(r.n+' report'+(r.n===1?'':'s'),{x:S21.remarksX,y:yy+2,size:8,font,color:ink}); });
      const th=rows.reduce((a,r)=>a+(r.hours===''?0:n(r.hours)),0); if(cat!=='pub' && th) centre(pg,r1(th),S21.hoursX,S21.totalY,10,bold);
    });
  }
  return out.save();
}
/* ---------- send one publisher their card, or all cards as a ZIP ---------- */
function crc32(u){ const T=crc32.t||(crc32.t=(()=>{ const t=new Uint32Array(256); for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[i]=c>>>0; } return t; })());
  let crc=0xFFFFFFFF; for(let i=0;i<u.length;i++) crc=T[(crc^u[i])&0xff]^(crc>>>8); return (crc^0xFFFFFFFF)>>>0; }
function makeZip(files){   // simple ZIP (stored): [{name, data:Uint8Array}]
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  files.forEach(f=>{ const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(12,0x21,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer), nm, f.data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(14,0x21,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), nm); off+=30+nm.length+sz; });
  const cs=central.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  const all=[...parts,...central,new Uint8Array(e.buffer)], out=new Uint8Array(all.reduce((a,b)=>a+b.length,0)); let q=0; all.forEach(b=>{ out.set(b,q); q+=b.length; });
  return out;
}
const safeName = x => String(x||'').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim() || 'Publisher';

function monthsLeft(g){ if(g.horizon==='1m') return 1; if(g.horizon==='1y') return 12-parse(TODAY()).getMonth(); const end=n(S.settings.started.slice(0,4))+5; return Math.max(1,(end-n(YEAR()))*12+12-parse(TODAY()).getMonth()); }
function sundaysLeft(){ const out=[]; let d=TODAY(); const m=MONTH(); while(d.slice(0,7)===m){ if(parse(d).getDay()===0) out.push(d); d=addDays(d,1); } return out; }
function monthlyIncome(){
  const from=addDays(TODAY(),-90), pays=S.money.filter(e=>e.type==='pay'&&e.date>=from);
  if(!pays.length) return 0;
  const months=new Set(pays.map(e=>e.date.slice(0,7))).size;
  return sum(pays)/Math.max(1,Math.min(3,months));
}
function moneyNum(t){
  const m=t.match(/(?:gh₵|ghs?|₵|cedis?)\s*(\d[\d,.]*)/) || t.match(/(\d[\d,.]*)\s*(?:gh₵|ghs?\b|₵|cedis?\b)/);
  return m?n(m[1]):0;
}
function goalThing(title){
  const m=String(title).match(/\b(?:buy|get|purchase|afford|save for|save up for)\s+(?:a |an |the |my |some )?(.+?)(?=\s+(?:which|that|for|costing|worth|at|by|before|this|next|in)\b|[,.(]|\s*\d|$)/i);
  const x=(m?m[1]:title).trim();
  return x.length>36?x.slice(0,34)+'…':x;
}
function goalEnd(g){
  if(g.horizon==='1m') return ymd(new Date(parse(MONTH()+'-01').getFullYear(), parse(MONTH()+'-01').getMonth()+1, 0));
  if(g.horizon==='1y') return (g.period||YEAR())+'-12-31';
  return (n(S.settings.started.slice(0,4))+5)+S.settings.started.slice(4);
}
function goalKind(g){
  const t=(g.title||'').toLowerCase();
  if(/bethel/.test(t)) return 'bethel';
  if(/pioneer|hours|field service|preach/.test(t)) return 'pioneer';
  if(/\b(bible|chapters?|scriptures?)\b/.test(t) && /\b(read|reading|finish|whole|entire|through)\b/.test(t) && !/stud(y|ent)/.test(t)) return 'bible';
  if(/\b(house|home|land|plot|building|build|car|motor|wedding|marry|marriage|school fees|university|degree|shop|business|farm)\b/.test(t)) return 'big';
  if(/₵/.test(t) || /\b(save|saving|savings|money|cedis?|ghs|debt|budget|buy|purchase|afford|costs?|price|pay for)\b/.test(t)) return 'money';
  return 'other';
}

function planSteps(g){
  const pl=g.plan, m=MONTH(), d=k=>{ const x=parse(m+'-01'); x.setDate(k); return ymd(x)<TODAY()?TODAY():ymd(x); };

  if(pl.kind==='money'){

function parseRef(txt){
  const m=String(txt||'').toLowerCase().replace(/\./g,' ').match(/^\s*((?:[123]\s*)?[a-z]+(?:\s+of\s+[a-z]+)?)\s*(\d{1,3})(?:\s*:\s*(\d{1,3}))?/);
  if(!m) return null;
  const want=m[1].replace(/\s+/g,''); if(want.replace(/^[123]/,'').length<2) return null;
  const names=BOOKS.map((b,i)=>[b[0].toLowerCase().replace(/\s+/g,''),i]);
  const hit = names.find(([nm])=>nm===want) || names.find(([nm])=>nm===want+'s') || names.find(([nm])=>nm.startsWith(want));
  if(!hit) return null;
  const b=hit[1]+1, c=n(m[2]), v=m[3]?n(m[3]):1;
  if(c<1 || c>BOOKS[b-1][1]) return null;
  return {book:b, chapter:c, verse:v, link:jworg(bcode(b,c,v))};
}

function summaryFromKeys(keys, seed){
  const parts=String(keys||'').split(/[,;\n]+|\band\b/i).map(x=>x.trim()).filter(Boolean);
  const lines=[], used=new Set(); let ref='';
  parts.forEach(k=>{ const hit=SUMKEYS.find(([re])=>new RegExp('\\b('+re+')','i').test(k));
    if(hit){ if(used.has(hit[0])) return; used.add(hit[0]); lines.push('• '+hit[1]); if(!ref) ref=hit[2]; }
    else { const c=k.replace(/\.$/,''); lines.push('• '+c.charAt(0).toUpperCase()+c.slice(1)+'.'); } });
  if(!lines.length) return null;
  return {text: lines.join('\n')+'\n\n'+SUMENC[seed%SUMENC.length], ref};
}

const API = (lang,b,all=0) => `https://b.jw-cdn.org/apis/pub-media/GETPUBMEDIALINKS?output=json&pub=nwtsv&fileformat=MP4&alllangs=${all}&langwritten=${encodeURIComponent(lang)}&booknum=${b}`;

/* pick the introduction video that belongs to book b (the server may send every book) */
function pickFor(items, b){
  const ok = items.filter(x=>x && x.file && x.file.url);
  let m = ok.filter(x=>n(x.booknum)===b);
  if(!m.length){ const nm=BOOKS[b-1][0].toLowerCase(); m = ok.filter(x=>(x.title||'').toLowerCase().includes(nm)); }
  if(!m.length && new Set(ok.map(x=>x.title)).size===1) m = ok;
  if(!m.length && ok.length>=66) m = ok.filter(x=>n(x.track)===b);
  m.sort((x,y)=>Math.abs((x.frameHeight||360)-480)-Math.abs((y.frameHeight||360)-480));
  return m[0] ? {url:m[0].file.url, title:m[0].title||''} : null;
}
async function loadVideo(){
  const box = document.getElementById('vidBox'); if(!box) return;
  const b = S.bible.book, L = vidLang(), key = L+'_'+b;
  if(!navigator.onLine){ box.innerHTML = '<div class="muted">Connect to the internet to watch the video for this book.</div>'; return; }
  box.innerHTML = '<div class="muted">Loading video…</div>';
  discoverLangs();
  if(vidCache[key]===undefined){
    let v=null, used=L;
    try{ const j=await getJSON(API(L,b)); v=pickFor(((j.files||{})[L]||{}).MP4||[], b); }catch(e){}
    if(!v && L!=='E'){ try{ const j=await getJSON(API('E',b)); v=pickFor(((j.files||{}).E||{}).MP4||[], b); used='E'; }catch(e){} }
    vidCache[key] = v ? {...v, used} : null;
  }
  if(S.bible.book!==b || vidLang()!==L || !document.getElementById('vidBox')) return;
  const v = vidCache[key];
  const note = !v ? '' : v.used===L ? (L==='E'?'':`<p class="muted" style="margin:6px 0 0">In ${esc(langName(L))}</p>`) : `<p class="muted" style="margin:6px 0 0">Not available in ${esc(langName(L))} yet — showing the English video.</p>`;
  document.getElementById('vidBox').innerHTML = v
    ? `<video controls playsinline preload="metadata" src="${esc(v.url)}"></video>${v.title?`<p style="margin:8px 0 0;font-weight:600">${esc(v.title)}</p>`:''}${note}`
    : videoFallback(b);
}
/* ask JW.org for the real language codes once a month and correct the list */
let langCheckRunning=false;
async function discoverLangs(force){
  const st=S.settings;
  if(langCheckRunning || !navigator.onLine) return;
  if(!force && st.langsChecked && (Date.now()-st.langsChecked)<30*864e5) return;
  langCheckRunning=true;
  try{
    const j = await getJSON(API('E',1,1));
    const langs = j.languages || {};
    const api = Object.entries(langs).map(([c,o])=>[c, String((o&&(o.name||o.vernacular))||'').toLowerCase()]).filter(a=>a[1]);
    if(api.length<5) throw 0;
    let changed=0;
    st.langs = st.langs.map(([code,name])=>{
      const full=name.toLowerCase(), base=full.split(' (')[0].trim(), variant=(full.match(/\(([^)]+)\)/)||[])[1];
      const hit = api.find(a=>a[1]===full)
        || (variant && api.find(a=>a[1].includes(base) && a[1].includes(variant)))
        || ((!variant || variant==='asante') && api.find(a=>a[1]===base));
      if(hit && hit[0]!==code){ changed++; if(st.bibleLang===code) st.bibleLang=hit[0]; return [hit[0],name]; }
      return [code,name];
    });
    st.langsChecked = Date.now(); st.langsFound = api.length;
    save();
    if(changed){ Object.keys(vidCache).forEach(k=>delete vidCache[k]); toast('Bible language codes corrected from JW.org'); if(tab==='faith') render(); }
  }catch(e){}
  langCheckRunning=false;
}

function calendar(m){
  const first = parse(m+'-01'), days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const offset = (first.getDay()+6)%7;
  let c = ['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<offset;i++) c+='<div></div>';
  for(let i=1;i<=days;i++){
    const s = m+'-'+String(i).padStart(2,'0'), d=S.days[s]||{};
    const min = S.ministry.some(e=>e.date===s && n(e.hours)>0);
    c += `<div class="d ${d.bible?'on':''} ${min?'m':''} ${s===TODAY()?'today':''}">${i}</div>`;
  }
  return `<div class="cal">${c}</div>`;
}

function bars(vals, labels, target, color){
  const W=320,H=120,pad=18, bw=(W-pad)/vals.length;
  const max = Math.max(target||0, ...vals, 1)*1.1;
  let g = '';
  if(target){ const y=H-pad-(target/max)*(H-pad-6); g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#9DB6D6" stroke-dasharray="4 4"/>`; }
  vals.forEach((v,i)=>{
    const h=(v/max)*(H-pad-6), x=pad/2+i*bw+bw*0.18;
    g+=`<rect x="${x}" y="${H-pad-h}" width="${bw*0.64}" height="${Math.max(h,v?2:0)}" rx="3" fill="${color}"/>`;
    if(labels[i]) g+=`<text x="${x+bw*0.32}" y="${H-4}" font-size="10" fill="#5F7A99" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}

    html += `<div class="card"><h2>Day by day</h2>${Object.keys(byDay).sort().reverse().map(d=>`<div class="area" style="display:flex;justify-content:space-between"><span>${nice(d)}</span><span>${money(sum(byDay[d]))}</span></div><div class="list">${byDay[d].map(moneyEntryRow).join('')}</div>`).join('')||'<div class="empty">No expenses this month.</div>'}</div>`;
  }
  if(moneyTab==='savings'){
    html += `<div class="card"><div class="stat" style="grid-template-columns:1fr 1fr"><div><small>Total savings</small><b>${money(savedIn())}</b></div><div><small>Saved this month</small><b>${money(savedBetween(MONTH()+'-01',t))}</b></div></div>
      <div class="btns" style="margin-top:10px"><button class="btn" style="flex:1" data-a="savesheet">Add to savings</button><button class="btn ghost" style="flex:1" data-a="savegoalsheet">New savings goal</button></div></div>`;
    html += `<div class="card"><h2>Savings goals</h2>${S.savings.length?S.savings.map(g=>{
        const have=savedIn(g.id), p=pct(have,g.target);
        let pace='';
        if(g.deadline && have<g.target){ const months=Math.max(1,(parse(g.deadline).getFullYear()-parse(t).getFullYear())*12+parse(g.deadline).getMonth()-parse(t).getMonth()); pace=`Save about ${money((g.target-have)/months)} a month to reach it by ${parse(g.deadline).toLocaleDateString(undefined,{month:'short',year:'numeric'})}.`; }
        if(!g.target) return `<div class="goal"><div class="t"><span data-a="savegoalsheet" data-id="${g.id}"><b>${esc(g.name)}</b><br><small class="muted">${money(have)} saved · tap to set a target</small></span></div>
          <div class="btns" style="margin-top:8px"><button class="btn sm ghost" data-a="savesheet" data-goal="${g.id}">+ Add</button><button class="btn sm ghost" data-a="withdrawsheet" data-goal="${g.id}">Take out</button></div></div>`;
        return `<div class="goal"><div class="t"><span data-a="savegoalsheet" data-id="${g.id}"><b>${esc(g.name)}</b><br><small class="muted">${money(have)} of ${money(g.target)} · ${p}%</small></span></div>${bar(p)}
          ${pace?`<p class="muted" style="margin:6px 0 0">${pace}</p>`:have>=g.target?'<p class="muted" style="margin:6px 0 0">Goal reached. Well done!</p>':''}
          <div class="btns" style="margin-top:8px"><button class="btn sm ghost" data-a="savesheet" data-goal="${g.id}">+ Add</button><button class="btn sm ghost" data-a="withdrawsheet" data-goal="${g.id}">Take out</button></div></div>`;}).join(''):'<div class="empty">Create a goal like "Emergency fund", "New phone" or "Convention trip".</div>'}</div>`;
    const hist=S.money.filter(e=>e.type==='save'||e.type==='withdraw').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
    html += `<div class="card"><h2>Savings history</h2><div class="list">${hist.length?hist.map(moneyEntryRow).join(''):'<div class="empty">No savings recorded yet.</div>'}</div></div>`;
  }
  return html;
};

/* ================= SYNC BETWEEN PHONE AND LAPTOP (through a file, merged, nothing wiped) ================= */
function deviceId(){ try{ let d=localStorage.getItem('lc.device'); if(!d){ d=uid(); localStorage.setItem('lc.device',d); } return d; }catch(e){ return 'x'; } }
function deviceName(){ try{ return localStorage.getItem('lc.deviceName') || (NATIVE?'Android app':/Android|iPhone|iPad/i.test(navigator.userAgent)?'Phone browser':'Laptop'); }catch(e){ return 'This device'; } }
const SYNC_LOCAL = ['timer','fired','snooze'];          // belong to this device only
function allIds(o, out=new Set()){ if(Array.isArray(o)) o.forEach(x=>allIds(x,out)); else if(o && typeof o==='object'){ if(o.id!=null) out.add(String(o.id)); Object.values(o).forEach(x=>allIds(x,out)); } return out; }
const isObj = x => x && typeof x==='object' && !Array.isArray(x);
const idArr = x => Array.isArray(x) && x.every(o=>isObj(o) && o.id!=null);
function mergeVal(a, b, bNewer, ctx, path){
  if(a===undefined) return b; if(b===undefined) return a;
  if(Array.isArray(a) && Array.isArray(b)){
    if(idArr(a) && idArr(b) && (a.length||b.length)){
      const ib=new Map(b.map(o=>[String(o.id),o])), out=[], seen=new Set();
      a.forEach(o=>{ const k=String(o.id); seen.add(k);
        if(ib.has(k)) out.push(mergeVal(o, ib.get(k), bNewer, ctx, path+'[]'));
        else if(ctx.baseB.has(k)){ ctx.removed++; }            // deleted on the other device
        else out.push(o); });
      b.forEach(o=>{ const k=String(o.id); if(seen.has(k)) return;
        if(ctx.baseA.has(k)) return;                          // deleted on this device
        out.push(o); ctx.added++; });
      return out;
    }
    if(/^\.bible\.read\./.test(path)) return [...new Set([...a,...b])].sort((x,y)=>x-y);   // chapters read: keep all
    if(JSON.stringify(a)!==JSON.stringify(b)) ctx.changed++;
    return bNewer ? b : a;
  }
  if(isObj(a) && isObj(b)){
    const out={}; new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{ out[k]=mergeVal(a[k], b[k], bNewer, ctx, path+'.'+k); });
    return out;
  }
  if(a!==b){ ctx.changed++; return bNewer ? b : a; }
  return a;
}
function syncPack(){
  S.settings.lastSyncOut=Date.now(); S.settings.lastBackup=Date.now(); save(true);
  return {...S, __sync:{v:1, at:Date.now(), changed:S.settings.lastChange||0, device:deviceId(), name:deviceName(), base:S.syncBase||[]}};   // base = what both devices last agreed on
}
async function syncSend(){
  const data=syncPack();
  let photos={}; try{ photos=await photoAll(); delete photos['lib:pdf-lib']; }catch(e){}
  if(Object.keys(photos).length) data.__photos=photos;
  let out=JSON.stringify(data); const pin=await myPin(); if(pin) out=await lockText(out, pin);
  const d=new Date(), name='life-compass-sync-'+TODAY()+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.json';
  if(NATIVE){
    const F=window.Capacitor.Plugins.Filesystem, Sh=window.Capacitor.Plugins.Share;
    try{ const r=await F.writeFile({path:name, data:out, directory:'CACHE', encoding:'utf8'});
      await Sh.share({title:'Life Compass sync', text:'Life Compass sync file', files:[r.uri], dialogTitle:'Save it to Google Drive'}); toast('Choose Drive to save it'); }
    catch(e){ if(!/cancel/i.test(String(e&&e.message||e))) toast('Could not share the file'); }
  } else {
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'application/json'})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
    toast('Saved to Downloads. Now put it in Google Drive');
  }
  closeSheet(); render();
}
function syncMerge(d){
  const meta=d.__sync||{}, ph=d.__photos||{}; delete d.__sync; delete d.__photos;
  const keepLocal={}; SYNC_LOCAL.forEach(k=>keepLocal[k]=S[k]);
  const ctx={added:0, removed:0, changed:0, baseA:new Set(S.syncBase||[]), baseB:new Set(meta.base||[])};
  const bNewer=(meta.changed||0) > (S.settings.lastChange||0);
  const activeStudy=S.study&&S.study.active;
  const merged=mergeVal(S, d, bNewer, ctx, '');
  SYNC_LOCAL.forEach(k=>merged[k]=keepLocal[k]);
  delete merged.syncBase;
  if(merged.study) merged.study.active=activeStudy||null;
  S=merged; const f=fresh(); S.settings={...f.settings, ...S.settings};
  S.syncBase=[...allIds(S)]; S.settings.lastSyncIn=Date.now(); S.settings.lastSyncFrom=meta.name||'';
  save();
  return Promise.all(Object.entries(ph).map(([k,v])=>photoGet(k).then(x=>x?null:photoPut(k,v)).catch(()=>{}))).then(()=>ctx);
}
function syncLoad(file){
  const r=new FileReader();
  r.onload=async()=>{
    let d; try{ d=await openDataFile(r.result); if(!d||!d.settings||!d.days) throw 0; }catch(e){ toast('That file is not a Life Compass sync file'); return; }
    if(d.__sync && d.__sync.device===deviceId()){ toast('That file came from this device. Load the one from your other device.'); return; }
    syncMerge(d).then(ctx=>{ closeSheet(); render(); toast('Synced'+(d.__sync&&d.__sync.name?' with '+d.__sync.name:'')+': '+ctx.added+' new, '+ctx.changed+' updated'+(ctx.removed?', '+ctx.removed+' removed':'')); });
  };
  r.readAsText(file);
}

function restore(file){

}

function readCodes(text){ const out=[], re=/LC-(REPORT|ATTEND|CHECK):([A-Za-z0-9.\-+\/]+)/g; let m; while((m=re.exec(String(text||'')))){ try{ let d=b64uDec(m[2]);
    if(Array.isArray(d)){
      if(m[1]==='REPORT') d={t:'r', m:d[1], g:d[2], n:d[4]||'', r:String(d[3]||'').split(';').filter(Boolean).map(x=>{ const [id,s,h,st,a,rm]=x.split(','); let r2=''; try{ r2=rm?decodeURIComponent(rm):''; }catch(e){} return [id, n(s), h===''||h==null?null:n(h), n(st), n(a), r2]; })};
      else if(m[1]==='CHECK'){ const mo=d[1]; d={t:'c', m:mo, c:(d[2]||[]).map(r=>[mo+'-'+String(r[0]).padStart(2,'0'), r[1]==='m'?'mid':'wk', n(r[2]), n(r[3]), String(r[4]||'').split('.').filter(Boolean), String(r[5]||''), n(r[6]), n(r[7])])}; }
      else { const mo=d[1]; d={t:'a', m:mo, a:String(d[2]||'').split(';').map(x=>x.match(/^(\d+)([mw])(\d+)$/)).filter(Boolean).map(x=>[mo+'-'+x[1].padStart(2,'0'), x[2]==='m'?'mid':'wk', n(x[3])])}; }
    }
    if(d && ((d.t==='r'&&Array.isArray(d.r))||(d.t==='a'&&Array.isArray(d.a))||(d.t==='c'&&Array.isArray(d.c)))) out.push(d); }catch(e){} } return out; }
function codePreviewHTML(codes){
  const d=SEC();
  return codes.map(c=>{
    if(c.t==='r'){ const rows=c.r.map(([id,s,h,st,a,rm])=>({p:findPub(id,c.g),s,h,st:n(st),a,rm})), ok=rows.filter(r=>r.p);
      return `<div class="area">${esc(c.g)} · ${monthName(c.m)} · ${ok.length} report${ok.length===1?'':'s'}</div>${c.n?`<p class="muted" style="margin:0 0 6px"><b>Note:</b> ${esc(c.n)}</p>`:''}
        <div class="list">${rows.map(r=>{ const had=r.p&&rep(c.m,r.p.id); return `<div class="it"><span class="wdot ${!r.p?'red':r.s?'green':'orange'}" style="margin-top:6px"></span><div class="x"><b>${r.p?esc(r.p.name):'Not on your list any more (skipped)'}</b><small>${r.s?'Shared'+(r.h!=null?' · '+r.h+' h':'')+' · '+r.st+' stud'+(r.st===1?'y':'ies')+(r.a?' · Aux':''):'Did not share'}${r.rm?' · Remarks: '+esc(r.rm):''}${had?' · replaces the report already entered':''}</small></div></div>`; }).join('')}</div>`; }
    if(c.t==='c') return `<div class="area">Attendance checklist · ${monthName(c.m)}</div><div class="list">${c.c.map(([dt,k,pres,v,abs,note,tot,none])=>none?`<div class="it"><div class="x"><b>${nice(dt)} · ${k==='mid'?'Midweek':'Weekend'}</b><small>No meeting${note?' · '+esc(note):''}</small></div></div>`:`<div class="it"><div class="x"><b>${nice(dt)} · ${k==='mid'?'Midweek':'Weekend'}</b><small>${(d.checks||{})[dt+'|'+k]?'<b style="color:var(--bad)">Already added, will be skipped</b> · ':''}${tot?'Counted '+tot+' · ':''}${pres} publishers present${v?' + '+v+' visitors':''}${abs.length?' · absent: '+abs.map(id=>{ const p=findPub(id,''); return p?esc(p.name):'?'; }).join(', '):''}${note?' · '+esc(note):''}</small></div><span class="amt">${tot||pres+v}</span></div>`).join('')}</div>`;
    const ms=d.meetings||[];
    return `<div class="area">Attendance · ${monthName(c.m)}</div><div class="list">${c.a.map(([dt,k,cnt])=>{ const had=ms.find(x=>x.date===dt&&x.kind===k); return `<div class="it"><div class="x"><b>${nice(dt)} · ${k==='mid'?'Midweek':'Weekend'}</b>${had&&n(had.count)!==n(cnt)?`<small>Replaces ${had.count}</small>`:''}</div><span class="amt">${n(cnt)}</span></div>`; }).join('')}</div>`;
  }).join('');
}
var CK_SKIP=0;
function applyCodes(codes){
  CK_SKIP=0; const d=SEC(); let nr=0, na=0, lastM=null, notes=[];
  codes.forEach(c=>{
    if(c.t==='r'){ d.reports[c.m]=d.reports[c.m]||{};
      c.r.forEach(([id,s,h,st,a,rm])=>{ const p=findPub(id,c.g); if(!p) return; const old=d.reports[c.m][p.id]||{};
        d.reports[c.m][p.id]={got:TODAY(), shared:!!s, aux:!!a&&!isPioneer(p), hours:s&&h!=null?n(h):null, studies:s?n(st):0, remarks:(rm||'').trim()||old.remarks||''}; nr++; });
      const lg=linkLog('r',c.m); lg[c.g]=lg[c.g]||{}; lg[c.g].got=TODAY(); lastM=c.m; if(c.n) notes.push(c.g+': '+c.n); }
    else if(c.t==='c'){ d.meetings=d.meetings||[]; d.checks=d.checks||{};
      c.c.forEach(([dt,k,pres,v,abs,note,tot,none])=>{ if(none) return; if(d.checks[dt+'|'+k]){ CK_SKIP++; return; } d.checks[dt+'|'+k]={present:pres, v, t:tot||0, abs:abs.map(id=>(findPub(id,'')||{}).id).filter(Boolean), note, got:TODAY()};
        const cnt=tot>0?tot:pres+v; if(cnt>0){ const ex=d.meetings.find(x=>x.date===dt&&x.kind===k); if(ex) ex.count=cnt; else d.meetings.push({id:uid(), date:dt, kind:k, count:cnt}); na++; } });
      linkLog('c',c.m).got=TODAY(); }
    else { d.meetings=d.meetings||[];
      c.a.forEach(([dt,k,cnt])=>{ if(!(n(cnt)>0)) return; const ex=d.meetings.find(x=>x.date===dt&&x.kind===k); if(ex) ex.count=n(cnt); else d.meetings.push({id:uid(), date:dt, kind:k, count:n(cnt)}); na++; });
      linkLog('a',c.m).got=TODAY(); }
  });
  if(lastM) secMonth=lastM;
  if(notes.length) d.notes.push({id:uid(), date:TODAY(), title:'Notes from group overseers', text:notes.join('\n')});
  save(); closeSheet(); render();
  if(nr) S.settings.backupNudge=Date.now();
  if(!nr && !na && CK_SKIP) toast(CK_SKIP+' meeting'+(CK_SKIP===1?' was':'s were')+' already added. The first reply is kept.'); else {
  toast([nr?nr+' report'+(nr===1?'':'s'):'', na?na+' attendance number'+(na===1?'':'s'):''].filter(Boolean).join(' and ')+' added'+(notes.length?' · note saved in Committee':''));
  if(CK_SKIP) setTimeout(()=>toast(CK_SKIP+' meeting'+(CK_SKIP===1?' was':'s were')+' already in, kept the first reply'),2200); }
}

/* ---------- printing the notice-board sheets (PDF made on the phone) ---------- */
async function boardPdf(o){
  const L=await loadPdfLib(), doc=await L.PDFDocument.create();
  const font=await doc.embedFont(L.StandardFonts.Helvetica), bold=await doc.embedFont(L.StandardFonts.HelveticaBold);
  const navy=L.rgb(0.047,0.235,0.471), ink=L.rgb(0.06,0.12,0.2), grey=L.rgb(0.42,0.48,0.56), line=L.rgb(0.78,0.83,0.9), white=L.rgb(1,1,1), sky=L.rgb(0.91,0.94,0.98);
  const clean=x=>String(x??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/[^\x20-\x7E\xA0-\xFF]/g,'');
  const W=595, H=842, M=34, G=14, CW=(W-2*M-G)/2, P=9, SZ=10, LH=13.5, HB=24, BOT=M+22;
  const fitW=(t,w,f,size)=>{ while(t && f.widthOfTextAtSize(t,size)>w) t=t.slice(0,-1); return t; };
  const wrap=(t,w,f)=>{ const words=clean(t).split(/\s+/).filter(Boolean), out=[]; let cur=''; words.forEach(wd=>{ const s=cur?cur+' '+wd:wd; if(cur && f.widthOfTextAtSize(s,SZ)>w){ out.push(cur); cur=wd; } else cur=s; }); if(cur) out.push(cur); return out.map(x=>fitW(x,w,f,SZ)); };
  const measure=b=>{ const rows=[], avail=CW-2*P;
    (b.lines||[]).forEach(l=>{
      if(l.label!=null){ const lab=clean(l.label), lw=bold.widthOfTextAtSize(lab+' ',SZ), txt=clean(l.text||'').trim();
        if(!txt) rows.push({lab, lw, blank:true}); else wrap(txt, avail-lw, font).forEach((p,i)=>rows.push(i?{text:p, ind:lw}:{lab, lw, text:p})); }
      else { const ind=l.num?20:0; wrap(l.text, avail-ind, font).forEach((p,i)=>rows.push({num:i?'':l.num, text:p, ind})); }
      if(l.gap) rows.push({gap:1}); });
    return {rows, h:HB+P+rows.reduce((a,r)=>a+(r.gap?6:LH),0)+P-2}; };
  let page, colY, first=true;
  const newPage=()=>{ page=doc.addPage([W,H]); let y=H-M;
    if(first){ page.drawText(clean(o.title),{x:M,y:y-20,size:22,font:bold,color:navy}); y-=38; if(o.sub){ page.drawText(fitW(clean(o.sub),W-2*M,font,11),{x:M,y,size:11,font,color:grey}); y-=10; } page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:1.5,color:navy}); y-=16; first=false; }
    else { page.drawText(clean(o.title+' (continued)'),{x:M,y:y-10,size:11,font:bold,color:navy}); y-=26; }
    if(o.foot) page.drawText(fitW(clean(o.foot),W-2*M-150,font,8.5),{x:M,y:M,size:8.5,font,color:grey});
    const up=clean('Updated '+parse(TODAY()).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})); page.drawText(up,{x:W-M-font.widthOfTextAtSize(up,8.5),y:M,size:8.5,font,color:grey});
    colY=[y,y]; };
  newPage();
  for(const sec of o.sections){
    if(sec.heading){ let y=Math.min(colY[0],colY[1]); if(y-22-G-HB-3*LH<BOT){ newPage(); y=colY[0]; }
      page.drawRectangle({x:M,y:y-22,width:W-2*M,height:22,color:sky});
      page.drawText(fitW(clean(sec.heading).toUpperCase(),W-2*M-2*P,bold,10.5),{x:M+P,y:y-15,size:10.5,font:bold,color:navy});
      colY=[y-22-G, y-22-G]; }
    for(const b of sec.boxes){
      const {rows,h}=measure(b); let c=colY[0]>=colY[1]?0:1;
      if(colY[c]-h<BOT){ if(colY[1-c]-h>=BOT) c=1-c; else { newPage(); c=0; } }
      const x=M+c*(CW+G), top=colY[c];
      page.drawRectangle({x, y:top-h, width:CW, height:h, borderColor:line, borderWidth:1});
      page.drawRectangle({x, y:top-HB, width:CW, height:HB, color:navy});
      page.drawText(fitW(clean(b.title),CW-2*P,bold,12),{x:x+P, y:top-HB+8, size:12, font:bold, color:white});
      let y=top-HB-P-SZ+1;
      rows.forEach(r=>{
        if(r.gap){ y-=6; return; }
        if(r.lab) page.drawText(r.lab,{x:x+P, y, size:SZ, font:bold, color:ink});
        if(r.num) page.drawText(clean(r.num),{x:x+P, y, size:SZ, font, color:grey});
        const tx=x+P+(r.lw||r.ind||0);
        if(r.blank) page.drawLine({start:{x:tx, y:y-2}, end:{x:x+CW-P, y:y-2}, thickness:0.6, color:line});
        else if(r.text) page.drawText(r.text,{x:tx, y, size:SZ, font, color:ink});
        y-=LH; });
      colY[c]=top-h-G;
    }
  }
  return doc.save();
}

const PHOTO_DB = () => 'lc-photos-' + KEY;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(PHOTO_DB(),1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function photoPut(id, data){ photoCache[id]=data; const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('p','readwrite'); t.objectStore('p').put(data,id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function photoGet(id){ if(photoCache[id]) return photoCache[id]; const db=await idb(); return new Promise(res=>{ const r=db.transaction('p').objectStore('p').get(id); r.onsuccess=()=>{ if(r.result) photoCache[id]=r.result; res(r.result||null); }; r.onerror=()=>res(null); }); }
async function photoDel(id){ delete photoCache[id]; try{ const db=await idb(); db.transaction('p','readwrite').objectStore('p').delete(id); }catch(e){} }
async function photoAll(){ const db=await idb(); return new Promise(res=>{ const out={}, r=db.transaction('p').objectStore('p').openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; r.onerror=()=>res(out); }); }
async function photoClear(){ try{ const db=await idb(); db.transaction('p','readwrite').objectStore('p').clear(); }catch(e){} for(const k in photoCache) delete photoCache[k]; }
const photoCache = {};
let sheetPhotos = [];   // pictures in the note being edited

function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const max=1280, sc=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('That file is not a picture')); };
    img.src=url;
  });
}
async function addPhotoFiles(files, target){
  const ids=[];
  for(const f of files){ try{ const data=await shrinkPhoto(f); const id='ph'+uid(); await photoPut(id,data); photoCache[id]=data; ids.push(id); }catch(e){ toast(e.message||'Could not add that picture'); } }
  if(!ids.length) return;
  if(target==='study' && SA()){ SA().photos=[...(SA().photos||[]), ...ids]; save(); render(); }
  else { sheetPhotos.push(...ids); sheetAdded.push(...ids); const box=document.getElementById('sheetPhotos'); if(box) box.outerHTML=photoStrip(sheetPhotos,'sheet'); hydratePhotos(); }
  toast(ids.length>1? ids.length+' pictures added' : 'Picture added');
}
