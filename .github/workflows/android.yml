# Life Compass Android app.
# Every time the app changes, GitHub builds it and publishes it here:
# https://github.com/nyarkogideon956-dot/life-compass/releases/latest/download/life-compass.apk
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['index.html', 'version.json', 'sounds/**', '*.ogg', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tidy the main page
        run: |
          python3 - <<'PY'
          import fnmatch, os, subprocess
          # Tidy the main page: put the alarm sounds in sounds/ and remove loose Android files uploaded by mistake.
          JUNK = ['AndroidManifest*.xml', 'Example*Test.java', 'MainActivity.java', 'activity_main.xml', 'build*.gradle',
                  'capacitor*.gradle', 'capacitor.config*.json', 'capacitor.plugins.json', 'colors.xml', 'config.xml',
                  'copy-web.js', 'cordova*.js', 'cordova.variables.gradle', 'download', 'download (*)', 'file_paths.xml',
                  'gradle-wrapper.*', 'gradle.properties', 'gradlew', 'gradlew.bat', 'ic_launcher*', 'ic_stat_lc.xml',
                  'package.json', 'package-lock.json', 'proguard-rules.pro', 'settings.gradle', 'splash*.png',
                  'strings.xml', 'styles.xml', 'variables.gradle', 'android-app.zip']
          changed = False
          os.makedirs('sounds', exist_ok=True)
          for f in sorted(os.listdir('.')):
              if not os.path.isfile(f):
                  continue
              if f.endswith('.ogg'):
                  subprocess.run(['git', 'mv', '-f', f, os.path.join('sounds', f)], check=True); changed = True
              elif any(fnmatch.fnmatch(f, p) for p in JUNK):
                  subprocess.run(['git', 'rm', '-q', '-f', f], check=True); changed = True
          print('tidied' if changed else 'nothing to tidy')
          PY
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Tidy: move alarm sounds to sounds/ and remove loose Android files"
            git pull --rebase -q || true
            git push || echo "Tidy will happen on the next build"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create the Android project
        run: |
          mkdir app-build && cd app-build
          cat > package.json <<'EOF'
          {
            "name": "life-compass-android",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.2.2",
              "@capacitor/core": "6.2.2",
              "@capacitor/filesystem": "6.0.4",
              "@capacitor/local-notifications": "6.1.3",
              "@capacitor/share": "6.0.4"
            },
            "devDependencies": { "@capacitor/cli": "6.2.2" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.lifecompass.gideon",
            "appName": "Life Compass",
            "webDir": "www",
            "plugins": { "LocalNotifications": { "smallIcon": "ic_stat_lc", "iconColor": "#0C3C78" } }
          }
          EOF
          npm install --no-audit --no-fund
          mkdir www
          cp ../index.html ../manifest.webmanifest ../version.json ../*.png ../*.svg www/
          npx cap add android

      - name: Add icons, alarm sounds and alarm permissions
        working-directory: app-build
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import os, re, shutil, glob
          from PIL import Image, ImageDraw
          # Runs inside build/ after "npx cap add android": icons, sounds, colours and alarm permissions.
          A = 'android/app/src/main'
          R = A + '/res'

          m = open(A + '/AndroidManifest.xml').read()
          if 'USE_EXACT_ALARM' not in m:
              m = m.replace('<uses-permission android:name="android.permission.INTERNET" />', '''<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />''')
              open(A + '/AndroidManifest.xml', 'w').write(m)

          g = open('android/app/build.gradle').read()
          g = re.sub(r'versionCode \d+', 'versionCode((System.getenv("LC_VERSION_CODE") ?: "1") as Integer)', g)
          g = g.replace('versionName "1.0"', 'versionName(System.getenv("LC_VERSION_NAME") ?: "1.0")')
          if 'signingConfigs' not in g:
              g = g.replace('    buildTypes {\n        release {\n', '''    signingConfigs {
                  release {
                      storeFile file("lifecompass.keystore")
                      storePassword System.getenv("LC_KEYSTORE_PASSWORD")
                      keyAlias "lifecompass"
                      keyPassword System.getenv("LC_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
          ''')
          open('android/app/build.gradle', 'w').write(g)

          open(R + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0C3C78</color>\n</resources>\n')
          open(R + '/values/colors.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="colorPrimary">#0C3C78</color>\n    <color name="colorPrimaryDark">#0C3C78</color>\n    <color name="colorAccent">#1565C0</color>\n</resources>\n')
          open(R + '/drawable/ic_stat_lc.xml', 'w').write('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="100" android:viewportHeight="100">
              <path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="8" android:pathData="M50,14 A36,36 0 1,1 49.99,14 Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M50,22 L58,50 L50,78 L42,50 Z"/>
          </vector>
          ''')
          fg_xml = R + '/drawable-v24/ic_launcher_foreground.xml'
          if os.path.exists(fg_xml): os.remove(fg_xml)

          os.makedirs(R + '/raw', exist_ok=True)
          for f in glob.glob('../sounds/*.ogg'):
              shutil.copy(f, R + '/raw/' + os.path.basename(f))
          print('sounds:', sorted(os.listdir(R + '/raw')))

          icon = Image.open('../icon-1024.png').convert('RGBA')          # rounded navy square with compass
          full = Image.open('../icon-maskable-512.png').convert('RGBA')  # full navy square with compass
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              s = int(48 * k)
              icon.resize((s, s), Image.LANCZOS).save(f'{R}/mipmap-{d}/ic_launcher.png')
              r = full.resize((s, s), Image.LANCZOS); mask = Image.new('L', (s, s), 0); ImageDraw.Draw(mask).ellipse((0, 0, s - 1, s - 1), fill=255)
              out = Image.new('RGBA', (s, s), (0, 0, 0, 0)); out.paste(r, (0, 0), mask); out.save(f'{R}/mipmap-{d}/ic_launcher_round.png')
              f = int(108 * k); full.resize((f, f), Image.LANCZOS).save(f'{R}/mipmap-{d}/ic_launcher_foreground.png')
          for f in glob.glob(R + '/drawable*/splash.png'):
              w, h = Image.open(f).size; s = int(min(w, h) * 0.3)
              bg = Image.new('RGBA', (w, h), '#FFFFFF'); bg.alpha_composite(icon.resize((s, s), Image.LANCZOS), ((w - s) // 2, (h - s) // 2))
              bg.convert('RGB').save(f)
          print('icons and splash ready')
          PY

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LC_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the secret LC_KEYSTORE_B64 (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > app-build/android/app/lifecompass.keystore

      - name: Build the app
        working-directory: app-build/android
        env:
          LC_KEYSTORE_PASSWORD: ${{ secrets.LC_KEYSTORE_PASSWORD }}
          LC_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$LC_KEYSTORE_PASSWORD" ]; then echo "::error::Add the secret LC_KEYSTORE_PASSWORD"; exit 1; fi
          export LC_VERSION_NAME=$(grep -o 'APP_VERSION = [0-9]*' ../../index.html | grep -o '[0-9]*$')
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../../life-compass.apk

      - name: Publish the app for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -o 'APP_VERSION = [0-9]*' index.html | grep -o '[0-9]*$')
          gh release delete app --cleanup-tag -y || true
          gh release create app life-compass.apk \
            --title "Life Compass app - version $V" \
            --notes "On your Android phone, tap life-compass.apk to download it, then open it to install. Updating keeps your entries." \
            --latest
